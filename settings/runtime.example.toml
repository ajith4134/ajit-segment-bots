[mean_reversion_minimum_volatility_fraction]
value = 0.000037
unit  = "fraction of price"
note  = "Claude, 2026-09-06: the least realised volatility over the window at which a mean-reversion z-score is worth computing -- a symbol moving less than it costs to trade has no reversion worth catching. Re-derived from Indian data; the previous value, 0.0005, was 'five basis points, just under the round trip at the venues' taker fees' (operator, 2026-08-23), which is a crypto perpetual's cost on a crypto perpetual's price and refuses an NSE index outright. Measured on the captured tape for 2026-09-04. CORRECTION, same day: an earlier version of this note said the only instruments this setting can act on are the three index underlyings, because broker-underlying-price-frame-bridge publishes exactly NIFTY, BANKNIFTY and SENSEX as symbol-price-frame. That is wrong -- symbol-price-frame has a second producer, price-level-sampler, which consumes market-data and therefore carries every Upstox print the broker-market-data-bridge relays. Measured from the live heartbeat table: mean-reversion-detector holds 1,721 symbols, not 3. This makes the single-number shape of this setting worse rather than better, because that universe spans indices whose sd/mean is about 4e-5 and options whose sd/mean is about 1e-2 -- two hundred and fifty times apart, gated by one fraction. The value below is still the right direction and the zero-candidate finding was measured from the parts' own bus counters rather than from this reasoning, but the per-instrument bound is now the fix rather than a refinement. NIFTY's own standard deviation over a 256-observation window is 0.000032 of its level at the median -- sixteen times under the old floor. It refused 32,796 of 35,136 NIFTY observations (93.3%) and 32,842 of 34,871 on BANKNIFTY (94.2%), and mean-reversion-detector raised zero candidates in 70,007 detections across both. This value is what the round trip actually costs, computed the way the Indian path really charges: the signal is on the index but the trade is in an option, so the condition is delta x z_threshold x sd_index >= round_trip_fraction x premium, i.e. sd/mean >= round_trip x premium / (delta x z x spot). Evaluated against real captured option greeks and real premiums on 2026-09-04 with runtime/indian_options_fee_model.py and this file's own six Upstox charge rates: NIFTY 23800 CE (premium 205.00, delta 0.726, round trip 0.541% of premium) needs 0.000032; NIFTY 23950 CE needs 0.000037; NIFTY 23800 PE 0.000069; NIFTY 24150 CE 0.000080. The median, 0.000037, is this value. The spread across those four is 2.5x and is real rather than noise -- a far-OTM contract's flat Rs20 brokerage is a much larger share of a small premium -- so one global fraction cannot express 'the move must pay for the contract about to be bought', and the correct shape is a per-contract bound computed at strike selection. That is recorded in docs/feature-audit.md as the remaining work; this value unblocks the cold start, which nothing else can: momentum-burst-detector needs a playbook-rule, which needs an opportunity-instruction, which needs a closed trade, so mean-reversion-detector is the only detector that can raise the first candidate on a cold system. Re-derive when the segments trade something other than index options, or when Upstox's charge schedule changes."

