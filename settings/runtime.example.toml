unit  = "closed trades"
note  = "operator, 2026-08-23, mirrored for the short side from bull_setup_weight_minimum_observations (2026-08-23): how many closed trades a detector needs before the learner moves its weight off one. Twenty, the least at which a hit rate separates from the base rate at all."

[bear_setup_weight_minimum]
value = 0.25
unit  = "weight"
note  = "operator, 2026-08-23, mirrored for the short side from bull_setup_weight_minimum (2026-08-23): the least weight a detector's setups may be given, whatever its record. A quarter rather than zero: a detector weighted to nothing produces no trades and therefore no evidence that could ever restore it."

[bear_setup_weight_maximum]
value = 3.0
unit  = "weight"
note  = "operator, 2026-08-23, mirrored for the short side from bull_setup_weight_maximum (2026-08-23): the most weight a detector may be given. Three, so one detector with a good week cannot swamp the rest of the bot's evidence."

[bear_settlements_per_day]
value = 3.0
unit  = "funding settlements per day"
note  = "operator, 2026-08-23: how many times a day funding is charged on a short, used by the bear bot to turn a funding rate into a carry over its horizon when the symbol's own interval is not known. Three, the eight-hourly default on both venues; the catalogue carries each symbol's real interval where the venue states it (132 of Binance's 872 symbols on 2026-08-22 did not)."

[bear_maximum_carry_fraction_of_horizon]
value = 0.01
unit  = "fraction of price"
note  = "operator, 2026-08-23: the most funding a short may be projected to pay over its horizon before bear-setup-filter refuses the setup. One percent: at the 1.5 reward-to-risk and the stops the plans set, a short that pays a percent to be held has paid away its edge before the move."

[bear_outlier_dangerous_side_threshold]
value = 4.0
unit  = "standard deviations"
note  = "operator, 2026-08-23: how far a feature may sit from its usual range on the side that is dangerous for a short -- a squeeze already under way -- before bear-outlier-rejector refuses the vector outright rather than flagging it. Four, twice the ordinary outlier threshold: a short into a four-sigma squeeze is the trade that ends accounts."

[bear_squeeze_room_deviation]
value = 1.5
unit  = "standard deviations"
note  = "operator, 2026-08-23: how far the short-squeeze room feature -- how much the price could rise before shorts are forced out -- may sit below its usual level before the rejector flags the vector. One and a half, tighter than the general two because this is the one feature whose tail is the bear bot's own loss."

[bear_rising_volatility_deviation]
value = 1.5
unit  = "standard deviations"
note  = "operator, 2026-08-23: how far realised volatility may sit above its usual level before the rejector flags a short setup. One and a half, for the same reason as the squeeze room: a short in rising volatility is a short whose stop is reached by noise."

[bear_entry_minimum_extension_quantile]
value = 0.2
unit  = "quantile"
note  = "operator, 2026-08-23: the quantile of a symbol's measured bounces below which the bear entry timer will not enter -- the price must have bounced at least this far from its low for the short to be entered into a bounce rather than into the hole. A fifth, mirroring bull_entry_maximum_extension_quantile at 0.8 from the other side."

[bear_entry_prior_extension_floor]
value = 0.01
unit  = "fraction of price"
note  = "operator, 2026-08-23: the bounce assumed worth waiting for before the timer has measured a symbol's own. One percent, below the 1.5% largest intraday move measured on the captured thirty, so an ordinary bounce reaches it."

[bear_setup_weight_loss_window]
value = 200
unit  = "closed trades"
note  = "operator, 2026-08-23: how many recent losses per detector bear-setup-weight-learner keeps to measure the tail of a detector's losses. Two hundred, the learning window used throughout."

[bear_setup_weight_prior_loss_fraction]
value = 0.02
unit  = "fraction of price"
note  = "operator, 2026-08-23: the size of a losing short assumed before a detector's losses have been measured. Two percent, the stop the plans set plus slippage through it -- a short's loss is unbounded in principle, and the prior must be the stop, not the median."

[bear_setup_weight_prior_win_fraction]
value = 0.02
unit  = "fraction of price"
note  = "operator, 2026-08-23: the size of a winning short assumed before measured. Two percent, so the prior tail ratio is one and a detector is neither favoured nor discounted on no evidence."

[bear_setup_weight_tail_quantile]
value = 0.95
unit  = "quantile"
note  = "operator, 2026-08-23: the quantile of a detector's losses read as its tail. The ninety-fifth: one short in twenty goes that badly."

[bear_setup_weight_tolerated_tail_ratio]
value = 3.0
unit  = "multiple of the typical win"
note  = "operator, 2026-08-23: how large a detector's tail loss may be, relative to its typical win, before the learner discounts the detector for it whatever its hit rate. Three: a short setup that wins often and loses three wins at a time once in twenty is a setup that loses."

[bear_invalidation_squeeze_room_collapse]
value = 0.5
unit  = "fraction"
note  = "operator, 2026-08-23: how far the squeeze room measured at entry must have collapsed before the watcher asks to close a short. Half: the room a short had to be wrong in has halved, and the squeeze that closes it is that much closer."

[bear_invalidation_volatility_rise]
value = 0.5
unit  = "fraction"
note  = "operator, 2026-08-23: how far realised volatility must have risen since entry before the watcher asks to reduce a short. Half again: the noise that reaches the stop has grown by half."

[bear_invalidation_carry_fraction_of_expected_move]
value = 0.5
unit  = "fraction"
note  = "operator, 2026-08-23: the share of the move a short was expected to make that its funding carry may have eaten before the watcher asks to close it on carry grounds. Half: past that the trade is paying to wait for less than it can make."

[bear_l2_regularisation]
value = 0.0001
unit  = "penalty coefficient"
note  = "operator, 2026-08-23, mirrored for the short side from bull_l2_regularisation (2026-08-22): how strongly the model is pulled back towards small weights. Nonzero so that a feature which happens to line up with a handful of early outcomes cannot dominate; small enough that it does not erase a real relationship. Judgement, to be replaced by a value chosen on held-out data once there is held-out data."

[under_allocation_alert_fraction]
value = 0.5
unit  = "fraction of the main balance"
note  = "operator, 2026-08-23: the share of the main account left unallocated to any segment below which allocation-conservation-checker raises an alert. Half: capital sitting in the main account is capital no segment can learn with, and half of it idle is a settings file nobody finished rather than a reserve somebody chose. Over-allocation -- segments summing past the balance -- is an alert at any amount."

[rebalance_minimum_closed_trades]
value = 30
unit  = "closed trades"
note  = "operator, 2026-08-23: how many closed trades a segment needs before allocation-rebalance-proposer will propose moving capital towards or away from it. Thirty, at which a realised return separates from noise at about one standard error; a proposal on fewer would move money on luck."

[rebalance_maximum_move_fraction]
value = 0.2
unit  = "fraction of a segment's allotment"
note  = "operator, 2026-08-23: the most one proposal may move in or out of a segment. A fifth, so a run of good trades cannot concentrate the account in one segment in one step; the proposal is the operator's to accept."

[rebalance_utilisation_floor]
value = 0.1
unit  = "fraction"
note  = "operator, 2026-08-23: the utilisation below which a segment is proposed to give capital up rather than receive it -- a segment using a tenth of what it holds is not short of capital whatever its return."

[live_balance_tolerance_fraction]
value = 0.02
unit  = "fraction of the allocation"
note  = "operator, 2026-08-23: how far a live venue balance may differ from the segment's allocation before live-balance-divergence-watch alerts. Two percent, about a day of funding and fees on a fully deployed allocation; beyond it money has moved that the settings do not know about. Paper segments are not checked: their balance is the keeper's."

[paper_currency_rate_maximum_age]
value = 300.0
unit  = "seconds"
note  = "operator, 2026-08-23: how old a conversion rate may be before paper-currency-converter refuses to convert with it. Five minutes; the rate comes from the live trade stream of the conversion pair, which prints many times a minute, so a rate older than that is a pair that stopped trading."

[ablation_measurement_samples]
value = 60
unit  = "health reports"
note  = "operator, 2026-08-23: how many health reports ablation-harness averages before and during an ablation. Sixty at one report a second per part: a minute, long enough that one slow tick does not decide what a part is worth."

[ablation_recovery]
value = 120.0
unit  = "seconds"
note  = "operator, 2026-08-23: how long the harness waits after one ablation before beginning another, so the system measured is the system recovered. Two minutes, twice the switch-flap window the governor watches."

[ablation_significant_change_fraction]
value = 0.2
unit  = "fraction"
note  = "operator, 2026-08-23: how far a metric must move under ablation before the scorecard calls the change significant. A fifth; smaller moves are within the run-to-run variation of rate ratios and staleness on the live spine."

[alert_cooldown]
value = 300.0
unit  = "seconds"
note  = "operator, 2026-08-23: how long alert-raiser holds a repeat of the same condition from the same source before raising it again. Five minutes: an alert per tick is noise nobody reads, and five minutes is the coverage window the feed auditor uses."

[board_published_path]
value = "~/.local/share/ajit-segment-bots/board-snapshot.json"
unit  = "path"
note  = "operator, 2026-08-23: where board-publisher writes the latest snapshot. A file on this machine rather than a link on the web: only port 22 listens here, and publishing to the shared Artifact URL is a person's act (dashboard/rebuild_all_boards.sh prints the URLs). The link this part publishes is this path, and stale-board-watch compares what is in it against what was built."

[board_stale_input]
value = 60.0
unit  = "seconds"
note  = "operator, 2026-08-23: how old a tile's input may be before board-snapshot-builder shows the tile as not measured rather than as its last value. A minute, sixty health intervals; a source that has said nothing for a minute has stopped."

[board_maximum_lag]
value = 120.0
unit  = "seconds"
note  = "operator, 2026-08-23: how far behind the built snapshot the published one may be before stale-board-watch alerts. Two minutes, two publish intervals."

[board_source_stopped_after]
value = 300.0
unit  = "seconds"
note  = "operator, 2026-08-23: how long without a new snapshot before the watch says the source stopped rather than that the board is lagging. Five minutes: the builder publishes once a health interval, so five minutes of nothing is the builder, not the link."

[clock_drift_warning]
value = 1.0
unit  = "seconds"
note  = "operator, 2026-08-23: how far the venue's clock may sit from this machine's before clock-skew-monitor warns. One second: both venues reject a signed request whose timestamp is more than a few seconds off, and a second of drift is the last point at which every request still lands."

[clock_rejections_before_alert]
value = 3
unit  = "rejections"
note  = "operator, 2026-08-23: how many timestamp rejections from a venue inside clock_rejection_window before the monitor alerts. Three, so one rejection on a slow request is not an alert."

[clock_rejection_window]
value = 300.0
unit  = "seconds"
note  = "operator, 2026-08-23: the window clock_rejections_before_alert is counted over. Five minutes."

[drawdown_episode_minimum_depth]
value = 0.01
unit  = "fraction of peak equity"
note  = "operator, 2026-08-23: how far equity must fall from its peak before drawdown-episode-tracker opens an episode. One percent, one full-risk loss at risk_maximum_per_position_fraction; shallower dips are the noise of open positions marking."

[fund_conservation_tolerance]
value = 0.01
unit  = "USDT"
note  = "operator, 2026-08-23: how far the cash and position value a fill moved may disagree with what the fill itself implies before fund-conservation-auditor alerts. A cent, the rounding of a quantity snapped to the venue's lot size at the prices of the captured symbols; anything larger is money that appeared or vanished."

[probe_timeout]
value = 10.0
unit  = "seconds"
note  = "operator, 2026-08-23: how long probe-runner gives one probe before recording it as timed out. Ten seconds: the slowest probe measured -- counting the tape's records over nine gigabytes -- takes under five, and a probe that hangs must not stop the ones behind it."

[limit_walk_cadence]
value = 2.0
unit  = "seconds"
note  = "operator, 2026-08-23: how often limit-price-walker steps a resting limit order towards the touch. Two seconds, a few prints on the captured symbols; faster would chase every tick, slower leaves the order behind a moving book."

[limit_walk_prior_step_fraction]
value = 0.0002
unit  = "fraction of price"
note  = "operator, 2026-08-23: the step a walk takes before the walker has measured how far the touch moves between its own steps. Two basis points, about the spread on the liquid captured symbols."

[limit_walk_maximum_total_fraction]
value = 0.004
unit  = "fraction of price"
note  = "operator, 2026-08-23: the most a limit order may be walked from where it was placed. The same 0.4% as maximum_decision_price_drift: past it the order is no longer the decision that placed it."

[order_not_found_prior_threshold]
value = 3
unit  = "denials"
note  = "operator, 2026-08-23: how many times a venue may answer that an order does not exist before order-not-found-debouncer believes it, until the venue's own lag has been measured. Three: both venues answer not-found for a few hundred milliseconds after accepting an order, and one poll inside that window is the lag, not the truth."

[order_not_found_maximum_threshold]
value = 10
unit  = "denials"
note  = "operator, 2026-08-23: the most denials the debouncer will ever wait for, however slow a venue has measured. Ten; past that an order that never appeared did not exist."

[order_reject_retry_threshold]
value = 0.5
unit  = "probability"
note  = "operator, 2026-08-23: the learned chance a retry succeeds above which a rejection is classed as retryable. A coin flip: a reason that clears half the time is worth one more attempt at the venue's cost of a request."

[order_resubmit_attempts_allowed]
value = 3
unit  = "attempts"
note  = "operator, 2026-08-23: how many times an order may be resubmitted after a retryable rejection. Three, so a transient venue error is retried and a persistent one is not hammered -- both venues escalate repeated rejections to a ban."

[order_resubmit_prior_clear_seconds]
value = 2.0
unit  = "seconds"
note  = "operator, 2026-08-23: how long to wait before a first resubmission, until the time a venue's transient rejections take to clear has been measured. Two seconds, past the window both venues hold a rate-limit rejection."

[order_resubmit_maximum_wait]
value = 60.0
unit  = "seconds"
note  = "operator, 2026-08-23: the longest a resubmission is held. A minute, the spread-reversion horizon; an order held longer is an order for a market that has gone."

[order_poll_prior_resolution]
value = 4.0
unit  = "seconds"
note  = "operator, 2026-08-23: how long an order is assumed to take to resolve at the venue before resolution times have been measured. Four seconds, twenty times the measured 80-200 ms order round trip, so the first poll does not land before the venue has an answer."

[order_poll_minimum_interval]
value = 0.5
unit  = "seconds"
note  = "operator, 2026-08-23: the fastest order-state-poller polls one order. Half a second: faster would spend the venue's rate budget on an answer that has not changed."

[order_poll_maximum_interval]
value = 30.0
unit  = "seconds"
note  = "operator, 2026-08-23: the slowest the poller polls a resting order. Thirty seconds, so a fill is never unseen for longer than half the decision horizon."

[order_poll_overdue_multiple]
value = 10.0
unit  = "multiple of the resolution time"
note  = "operator, 2026-08-23: how many times its usual resolution time an order may take before the poller calls it overdue. Ten: an order ten times slower than usual is stuck at the venue, not slow."

[resting_order_prior_time_to_live]
value = 30.0
unit  = "seconds"
note  = "operator, 2026-08-23: how long a resting order is left before resting-order-cancel-policy cancels it, until fill times have been measured. Thirty seconds, half the decision horizon."

[resting_order_maximum_time_to_live]
value = 600.0
unit  = "seconds"
note  = "operator, 2026-08-23: the longest any resting order is left whatever the measurement says. Ten minutes."

[resting_order_prior_distance_fraction]
value = 0.002
unit  = "fraction of price"
note  = "operator, 2026-08-23: how far the market may move away from a resting order before it is cancelled, until the distance at which orders stop filling has been measured. Twenty basis points, ten spreads on the liquid symbols."

[resting_order_maximum_distance_fraction]
value = 0.01
unit  = "fraction of price"
note  = "operator, 2026-08-23: the furthest the market may be from a resting order before it is cancelled regardless. One percent."

[execution_minimum_observations]
value = 10
unit  = "observations"
note  = "operator, 2026-08-23: how many measured outcomes the execution learners -- walk steps, denial lags, retry rates, resolution times, fill distances -- need before they use the measurement over the prior. Ten, the least a quantile of a small sample can mean; the execution path measures faster than the trading path and needs fewer."

[execution_window]
value = 200
unit  = "observations"
note  = "operator, 2026-08-23: how many recent observations the execution learners keep. Two hundred, about a day of orders at today's paper rate."

[venue_balance_freshness]
value = 30.0
unit  = "seconds"
note  = "operator, 2026-08-23: how old a venue balance reading may be before venue-balance-reader reads it again. Thirty seconds; a balance moves with fills and funding, and thirty seconds is one order's maximum poll interval."

[settlement_currency]
value = "USDT"
unit  = "currency"
note  = "operator, 2026-08-23: the currency both venues settle the traded perpetuals in, and the one the paper account keeps. USDT on binance-usdm and bybit-linear."

[decoding_minimum_trades]
value = 20
unit  = "closed trades"
note  = "operator, 2026-08-23: how many closed trades a decoder needs before its reading is a measurement -- an excursion profile, a holding-horizon curve, a winner pattern, a lesson. Twenty, the observation floor used throughout."

[decoding_window]
value = 200
unit  = "closed trades"
note  = "operator, 2026-08-23: how many recent closed trades the windowed decoders keep. Two hundred, about a day at today's paper rate."

[entry_quality_window]
value = 60.0
unit  = "seconds"
note  = "operator, 2026-08-23: how far before the entry entry-quality-scorer looks at prices to judge how much was given away by chasing. Sixty seconds, the spread-reversion horizon: a move that began earlier than the signal is not chasing, it is the setup."

[entry_quality_minimum_prices]
value = 5
unit  = "prints"
note  = "operator, 2026-08-23: how many prints inside the window the scorer needs to judge an entry. Five; fewer is a symbol that did not trade, not an entry that chased."

[entry_quality_chasing_movements]
value = 2.0
unit  = "typical movements"
note  = "operator, 2026-08-23: how many of the symbol's typical one-minute movements the price must have moved in the signal's direction before the entry, for the scorer to call it chased. Two: one is the move the signal saw, two is the move it missed."

[exit_quality_gave_back_threshold]
value = 0.5
