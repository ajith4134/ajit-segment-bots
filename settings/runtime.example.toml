note  = "operator, 2026-09-07: the metered and free-tier chat endpoints metered-api-caller may use, one row each. Every one speaks the OpenAI /chat/completions body -- Kimi, Groq, Cerebras and OpenRouter are the same request and the same response -- so a provider is a row here rather than a module, which is the point of the shape. **A price of 0.0 is a real price and not a missing one**: metered-api-caller prices a call before making it and refuses what it cannot price, so a free tier has to declare zero rather than nothing. Kimi is priced from Moonshot published kimi-k2 rates (about $0.60 per million input tokens and $2.50 per million output); the three free tiers are zero because their free allowance is free until it rate-limits, which the caller counts separately from a failure. The secret_field names a group and field in the encrypted store (docs/secrets.md); a provider whose key is missing or still PLACEHOLDER_ is reported absent and never called, because firing at an endpoint with no credential spends a retry budget to learn what the store already knew. Adding a provider is a row; removing one is deleting a row. Verify a new row with tests/runtime/test_llm_providers.py before trusting it."

