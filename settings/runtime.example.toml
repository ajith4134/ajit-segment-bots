value = 5
unit  = "consecutive checks"
note  = "Claude, 2026-09-06: how many checks in a row a part must be over detector_slowdown_ratio before taking-longer-every-tick is a fault. Measured on the live spine that day: the rule fired 15,109 times -- every fault the detector raised was this one kind -- and unattended-run-warden had refused 4,671 restarts for a system-wide cause that was this detector's own noise, leaving the part that restarts a broken part deaf. The cause, unexplained in the code until then: both halves of the comparison come from one rolling window, so `earlier` is not a baseline but simply half a window ago, and a ratio between two means of a fluctuating series crosses any fixed threshold at a rate set by its variance, for ever. Five because the fault is named for persistence -- one window crossing is a spike, five consecutive is the growing structure it describes -- and because at the ~3% per-check rate this rule fired at, five independent crossings is about one in ten million rather than one in thirty. Raise it if noise returns; lowering it below three puts the warden back where it was."

[broker_feed_venue_id]
value = "upstox"
unit  = "venue id"
note  = "Claude, 2026-09-06: the venue_id the broker feed stamps on every market-data message, which feed-gap-detector keys its broker detector on. A named setting rather than an import of broker-underlying-price-frame-bridge's UPSTOX_VENUE_ID constant, because T-4 says a part names data and never another part -- and rather than a literal, because RL-061 says a number or name a decision turns on carries provenance. It must equal what broker-market-data-bridge actually publishes: measured 2026-09-06 from the captured tape and the live heartbeat, every broker market-data message carries venue_id \"upstox\". If a second broker is ever added this becomes a list, the same way captured_venues already is. Added because feed-gap-detector built its detectors only from load_captured_venue_adapters, so every Upstox print hit a silent `continue` and the one part that would notice the Indian feed going quiet was watching two crypto streams that stopped on 2026-09-01."

[feed_gap_patience_multiple]
value = 2.8
unit  = "multiple of a stream's own p99 inter-print gap"
note  = "Claude, 2026-09-06: how far past its own habit a stream must be silent before feed-gap-detector calls the silence a gap. The bound per stream becomes max(feed_gap_threshold, this x that stream's own p99 inter-print gap, estimated online from the gaps the detector itself observed), so a liquid symbol keeps the proven 60 s floor exactly and a quiet NSE option contract stops being reported as a stopped feed. Needed because feed_gap_threshold's own note already says the flat 60 s 'is NOT safe at the full universe: an illiquid perpetual is quiet for minutes at a time', and the Indian universe is that case at scale -- 1,974 subscribed instruments, mostly option contracts that print every few minutes. This project has already paid for the flat-floor version of this mistake once: anomaly_feed_silence_patience_multiple's own note records 3,282 of 3,289 anomalies being this-venue-has-stopped-updating on NSE contracts that were merely quiet, each one halting trading in that symbol. 2.8 carries the same provenance price_gap_patience_multiple and anomaly_feed_silence_patience_multiple both carry -- the ratio that let ordinary quiet through while a real 1031 s outage still cleared every window by more than a factor of eight -- and is the same rule RollingWindow._gap_bound_seconds applies to a price window. Deliberately not re-fitted here: it is the same question about the same feeds, and inventing a second number for it would be a number with no measurement behind it. Re-measure against a real Indian session once one has run with this on."

[bound_capital_awaits_a_position_for_seconds]
value = 30.0
unit  = "seconds"
note  = "Claude, 2026-09-12: how long trade-capital-bounds-gate counts capital it has let through against the position ceiling before a `position` message has reported it back. The gate's ceiling is on the position, and a position cannot be published until an order fills, so between binding an order and hearing about it there is a window in which the next order sees a ceiling nothing is spending. Measured on 2026-09-08: four separate orders for NIFTY 24550 CE 08 SEP 26 -- client order ids 55d0de91, a0be0a0c, 594fd4b9 and 679e2e0d, eight fills between them -- were bound and filled inside the SAME MILLISECOND at 09:42:00.309, each passing the ceiling honestly against a position record none of them had yet updated, and the position walked from 712,985 to 6,110,301 units. Thirty seconds because the round trip from a bounded order to a published position is a fill plus a position tick, which is sub-second on this spine, and this wants headroom for a contended machine rather than precision; the cost of being too long is a real order briefly refused, the cost of being too short is the stack above. It MUST expire: an order refused downstream, cancelled, or never filled would otherwise reserve the ceiling for the rest of the session, which is the unbounded-LatestByKey trap this project has paid for three times -- most recently 2026-08-26, when every part the governor had ever switched off still counted as running because four readers of part-resource-usage had no age bound. Read `reservations_that_expired` on the gate's own standing: a number climbing there means orders are being bound and not filled, which is worth seeing on its own."

[broker_order_product]
value = "D"
unit  = "Upstox product code"
note  = "Claude, 2026-09-12: which Upstox product a live order is placed under. 'D' is delivery, 'I' is intraday, 'MTF' is the margin trading facility -- Upstox's own codes, and note there is no plain 'CNC' string. D for the two built segments: a bought index or stock option is held to its own expiry rather than squared off before the close, and placing it as intraday would have the broker square it off at whatever the book offers at 15:15, which is an exit this system did not choose and cannot learn from. Stated here rather than hardcoded in broker-order-router so a future intraday segment says 'I' in settings instead of editing the part (RL-061)."

[broker_order_validity]
value = "DAY"
unit  = "Upstox validity code"
note  = "Claude, 2026-09-12: how long a live order stands if it does not fill. 'DAY' -- it expires at the close -- or 'IOC', fill what you can immediately and cancel the rest. DAY because every order this project places today is a market order that fills on arrival, so the validity only matters for the case where it does not, and an order surviving to the close is recoverable while one silently cancelled is a decision that quietly did not happen. Revisit with IOC the day limit orders are routed live, where resting is the point."

[broker_order_timeout_seconds]
value = 10.0
unit  = "seconds"
note  = "Claude, 2026-09-12: how long broker-order-router waits for Upstox's place-order endpoint before giving up. Ten seconds, against Upstox's own separate low-latency host for order placement (api-hft.upstox.com) where a normal response is well under a second. Long enough that ordinary latency is not a failure, short enough that a hung socket does not hold the tick loop. The timeout case is the dangerous one and is handled rather than avoided: the client order id is remembered BEFORE the call, so a retry after a timeout is refused as a duplicate rather than opening a second position -- a timeout is exactly the case where the order may or may not have arrived."

[book_and_paper_fetches_per_tick]
value = 1
unit  = "fetches per tick"
note  = "Claude, 2026-09-12: how many skill-gaps book-and-paper-fetcher goes and fetches in one tick. ONE, and the bound exists rather than the number being tuned: this part fetched every gap that had arrived in a single tick, with a real HTTP call each. Measured on the live spine that day -- 307 gaps seen, 20 fetched, 287 rate-limited -- the part reported `silent` for 308 seconds with its state still `on`, because one tick had been running the whole time. A part that blocks its own loop for five minutes cannot be switched off (T-2: the governor owns the switch and can only take a part that returns to its loop), cannot emit health, and is reported silent by failing-part-detector while nothing is wrong with it; its skipped_tick_effect is `corrupts`, which makes a tick it never finishes worse than one it skips. One because the per-host rate limiter refuses most gaps anyway (287 of 307 that day), so a larger bound buys throughput this part is not allowed to use. Nothing is lost: a gap not fetched this tick is read on the next."

[broker_news_instruments_per_request]
value = 30
unit  = "instrument keys per request"
note  = "Claude, 2026-09-12: how many instruments broker-news-reader asks the broker about in one request. THIRTY is Upstox's own documented cap, verified against upstox.com/developer/api-documentation/get-news the same day -- a request above it is refused outright rather than truncated, so this is the cap and not a choice around it. The two option segments track 220 underlyings, so one full sweep is eight requests and the part rotates through them one slice per tick rather than issuing eight in one: a part that blocks its own loop on I/O cannot be switched off (T-2), which is what book-and-paper-fetcher was found doing the same day with a five-minute tick. Rotation rather than always taking the first thirty, because the other 190 would otherwise never have their news read and nothing would report it -- items_read would climb happily."

[broker_news_timeout_seconds]
value = 20.0
unit  = "seconds"
note  = "Claude, 2026-09-12: how long broker-news-reader waits for the broker's news endpoint before giving up. Twenty seconds: measured against the real endpoint that day the call returned 17 items for two underlyings well inside a second, and this is that with wide headroom for a news service which is not on Upstox's low-latency host and has no trading path depending on it. Long enough that ordinary slowness is not a failure; short enough that a hung socket does not hold the tick. A failed read is recorded on the standing and not retried within the tick -- retrying inside a loop is what turns a slow endpoint into a rate limit."

[broker_news_seconds_between_requests]
value = 10.0
unit  = "seconds between news requests"
note  = "Claude, 2026-09-12: how long broker-news-reader waits between calls to the broker's news endpoint. Measured on the live spine the moment this part first ran WITHOUT a pace: 371 requests in 110 seconds -- 3.37 a second, about 291,000 calls a day at an endpoint that is rate limited. Nothing had failed yet, which is exactly the shape of problem that arrives as a ban rather than as an error, and is the reasoning api-key-pool-rotator's own note already gives for resting a key. Ten seconds, derived from the sweep: news can only be ABOUT a company or an index, which is 2,871 of the master's 118,388 instruments, so a full sweep at 30 keys a request is 96 requests and one every ten seconds comes back round to any given share about every sixteen minutes. That is faster than Indian market news moves and 337 times gentler than what it was doing. Shorten it only on evidence that a story was acted on late -- news-latency-meter is the part that would show it."

[news_story_headline_overlap_to_collapse]
value = 0.8
unit  = "shared headline words over all headline words"
note  = "Claude, 2026-09-12: how far two headlines must overlap before news-item-deduplicator calls them one story. DERIVED, not chosen, and the derivation is a measurement on this project's own capture of the real Upstox news endpoint (tests/captured/upstox/2026-09-12-news-for-two-underlyings.json, 17 rows and the broker's own metadata.total_records of 14). Jaccard over the part's own story_tokens: the 3 pairs that are provably one story -- identical headings returned under two instrument keys -- score 1.000, and the 133 pairs that are provably different score max 0.600, p95 0.250, median 0.044. 0.8 is the midpoint of that gap. The 0.600 pair is why it cannot sit lower: 'SENSEX, NIFTY50 resume decline after a day's pause dragged by Reliance Industries, Larsen & Toubro' against '...dragged by IT stocks' is one outlet's market wrap on two different days, and collapsing those two would delete a day of news. Only one source runs today, so cross-outlet collapse is evidenced from a single outlet's own repeats; re-derive when a second source lands, and news-item-deduplicator's collapsed_by_headline counter is what makes a threshold that starts destroying stories visible rather than silent."

[news_story_remembered_for_seconds]
value = 691200
unit  = "seconds"
note  = "Claude, 2026-09-12: how far back news-item-deduplicator can recognise a story it has already seen. Derived from the source's own backlog, measured twice on real captures the same day: 14 stories for 2 underlyings spanned 153.27 hours, and 31 stories for the 30 underlyings the option segments actually track spanned 167.08 hours (2026-09-05 05:11 to 2026-09-12 04:16 UTC). Upstox's news endpoint is a rolling backlog, so broker-news-reader re-delivers those same stories on every sweep -- about every sixteen minutes at 2,871 instruments and 30 keys a request -- and a memory shorter than the backlog republishes a week-old story as breaking news, forever. EIGHT days (691,200s) is the next whole day above the measured 167.08 hours; whole days because a backlog refilled daily is bounded in days. The first derivation of this number said seven days off the narrower capture, which left 0.92 hours of margin -- the wider capture is why it is eight, and it is also the warning that this margin is measured, not generous. Cost is memory: stories_held in the standing says how many are held, each with its headline tokens."

[news_wait_for_the_model_seconds]
value = 60.0
unit  = "seconds"
note  = "Claude, 2026-09-13: how long news-text-structurer holds a story for a model's answer before structuring it from the source's own heading and summary instead, marked read_by the-source-own-fields-only-no-model-answered. CHOSEN, not yet measured end to end, and saying so is the point. The one measured input is llm_subscription_measured_latency_seconds, 8s for a call on a loaded spine; the request also crosses prompt-renderer, llm-model-picker, llm-request-router, the caller and structured-output-enforcer, a tick each, and no measurement of that whole path exists yet. Sixty seconds is 7.5 times the call alone. Too short costs twice: the story is published source-only and the answer, when it lands, is counted as answers_for_a_story_not_awaited and paid for anyway. Re-derive from the standing once the structurer runs live: if answers_for_a_story_not_awaited climbs beside gave_up_waiting, this is too short."

[news_stories_asked_about_per_tick]
value = 1
unit  = "stories"
note  = "Claude, 2026-09-13: how many not-yet-asked stories news-text-structurer turns into llm-requests each tick, oldest first. One. The ceiling that actually binds is llm_subscription_calls_per_hour (20) at about $0.041 a call, enforced by llm-request-router; asking more per tick does not buy more answers, it buys more refusals, and a refused story falls back to its source fields after news_wait_for_the_model_seconds and is never asked about again. Measured backlog on 2026-09-12: about 31 distinct stories across the 30 underlyings the option segments track, over 167 hours, so one a tick clears a real backlog in well under a minute of ticks and the router's hourly bound is what paces the money."

[news_structuring_maximum_sentences]
value = 4
unit  = "sentences"
note  = "Claude, 2026-09-13: the most sentences news-text-structurer's request permits. Four, the same bound llm_maximum_sentences gives every brain part and for the same reason -- every sentence is one more claim to verify against the facts. The answer is one JSON object with five short fields, so four is headroom, not a squeeze: both captured haiku answers (tests/captured/upstox/2026-09-12-two-real-stories-read-by-haiku.json) fit it."

[news_latency_window_observations]
value = 500
unit  = "observations"
note  = "Claude, 2026-09-12: how many arrivals news-latency-meter keeps per source when estimating what latency is ordinary for it. A bounded window rather than every arrival ever, so a source that improves is measured as it is now and not as an average of its whole history. 500: the measured Upstox news endpoint carries about two stories a day per underlying and the reader sweeps 2,871 instruments, so a few hundred arrivals is hours of a source's behaviour rather than minutes of it -- long enough that one slow afternoon does not become the habit, short enough that yesterday's outage stops counting today. Memory is 500 floats per source and this block has 6 declared sources."

[news_latency_minimum_observations_to_state_a_typical]
value = 20
unit  = "observations"
note  = "Claude, 2026-09-12: how many arrivals a source must show before news-latency-meter will state a typical latency for it. Below this the reading carries typical_latency_ns of None rather than a number, because news-impact-forecaster discounts a late item against that typical and discounting against a figure measured from three arrivals is discounting against noise (Rule 8: not measured is its own state, never a default). Twenty at the median: the median of twenty observations moves by less than one observation's worth when the next one arrives, and the measured source delivers enough per sweep to reach twenty inside an hour."

[news_latency_prior_seconds]
value = 0.0
unit  = "seconds"
note  = "Claude, 2026-09-12: the prior news-latency-meter holds for a source's typical latency before it has measured one. ZERO, and it is never published as a value -- typical_latency_ns is None until the estimate is fitted, so this prior exists only to satisfy QuantileEstimator's constructor and is deliberately the one number that cannot be mistaken for a measurement. A non-zero prior here would be an invented claim about how fast a source this system has never watched delivers; the measured truth for the one source that exists is nothing like a guess anyway -- the newest of 14 real stories was first seen 21.5 hours after it was published, because this source is a digest and not a wire."

[news_source_gap_window_observations]
value = 500
unit  = "observations"
note  = "Claude, 2026-09-12: how many gaps between arrivals news-source-health-monitor keeps per source. Same size and same reasoning as news_latency_window_observations -- a bounded window measures a source as it behaves now -- and deliberately the same number rather than a second one to tune, since both windows watch the same arrivals of the same sources. The monitor's own longest-gap record is NOT windowed: 'quiet for longer than this source has ever been quiet' is the bound that decides NOT_DELIVERING, and windowing it would let the overnight gap fall out of memory and make every morning look like a dead feed."

[news_source_minimum_gaps_to_state_a_habit]
value = 20
unit  = "gaps"
note  = "Claude, 2026-09-12: how many gaps a source must show before news-source-health-monitor will judge its silence. Below this the standing is NOT_MEASURED, which is its own state and not a healthy one -- a dead feed reads exactly like a quiet news day, and so does a feed nobody has watched long enough to know its rhythm. TWENTY, and the number is arithmetic rather than taste: QuantileEstimator takes the nearest rank, so the 95th percentile of n observations IS the maximum until ceil(0.95n) - 1 < n - 1, which first holds at n = 20. Below twenty gaps the monitor's middle state, QUIETER_THAN_USUAL, is unreachable -- silence would jump straight from DELIVERING to NOT_DELIVERING -- and Rule 8 refuses a display whose failing states cannot be rendered. Measured on the real 30-underlying capture, which carries exactly 30 gaps: nearest-rank median 6,242.3s (1.73h), 95th percentile 64,524.9s (17.92h), longest 102,145s (28.37h), so all three states separate. The narrower 2-underlying capture has 13 gaps and its 95th percentile equals its maximum -- that is the defect this value exists to close, and it was found by a test failing rather than by reading the code."


[news_source_standing_refresh_interval_seconds]
value = 60.0
unit  = "seconds"
note  = "Claude, 2026-09-12: how long news-source-health-monitor may leave an unchanged source standing unsaid before saying it again. A level, not an event (runtime/level_publishing.py): silence is a level that no arriving message announces, so the monitor re-judges every source every tick but only publishes when that source's own standing differs or this interval is due. Sixty seconds because alert-raiser is the consumer and the thing it would fire on -- a source that has gone dark -- is measured in minutes for a news feed delivering twice a day per name, not in ticks. Published per source with LevelPublisherByKey so one source going quiet does not restate the other five, which is the 89,747 msg/s storm of 2026-08-26 in miniature."

[prompt_seeding_is_allowed]
value = 1
unit  = "1 allows seeding, 0 refuses it"
note  = "Claude, 2026-09-12: whether seed-prompt-promoter may promote a purpose's FIRST prompt version, which no score can ever reach. ON, and it is the switch that turns sixteen idle parts into parts that make real LLM calls -- so the reasoning for the value is the blast radius, measured before it was flipped. Nothing in this project had ever made an LLM call: prompt-renderer had seen 906 requests and refused all 906 for `no-active-prompt-version-for-this-purpose`, because an active version needs a promotion, a promotion needs a score, a score needs golden cases and validated output, and validated output needs an active version. docs/proposals/the-first-prompt-for-a-purpose-cannot-be-scored.md carries the whole ring. What bounds the spend once the ring opens, read off this same file: llm_subscription_calls_per_hour 20, llm_quota_calls_allowed 200 per llm_quota_window_seconds 18000, llm_subscription_model haiku, llm_spend_ceiling 1.0 USD per day with no paid key installed at all. At the measured $0.041 for a stripped haiku call through the Claude Code session transport (runtime/llm_providers.claude_code_session_call, 2026-09-07) that is about $0.82 an hour at the cap and roughly $8 per five-hour window worst case, all of it against the operator's own subscription rather than a card. Set this to 0 to close the ring again: every purpose goes back to being refused by the renderer, which is the state the block was built in and not a failure."

[implied_volatility_trading_seconds_per_year]
value = 5512500.0
unit  = "seconds"
note  = "Claude, 2026-09-15: how many seconds NSE's F&O market trades in a year, the denominator that puts a forecaster's volatility over its horizon onto the same annual scale as the implied volatility Upstox states. volatility-gap-detector compared the two raw until this date: a 300s forecast of about 0.0004 against a NIFTY implied volatility of 0.28 on the day's tape, so every one of 17,242 candidates read 'implied rich', largest gap 718. MEASURED from NSE's own holiday API (/api/holiday-master?type=trading) for 2026: 261 weekdays less 16 F&O weekday holidays = 245 trading days, times the 22,500s from market_session_opens_at_ist to market_session_closes_at_ist (measurements/2026-09-15-volatility-gap-units/). Trading seconds rather than calendar seconds, because implied variance is realised while the market trades and every forecaster here measures trading time; calendar seconds would understate the annualised forecast by sqrt(31,536,000 / 5,512,500) = 2.39x. Re-derive each January from that year's list."
