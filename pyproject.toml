[project]
name = "ajit-segment-bots"
version = "0.1.0"
description = "Crypto segment trading bots. Every part is a transistor."
requires-python = "==3.14.*"

# Every entry is pinned exact and carries why it was admitted (RL-065).
# The interpreter is the standard build, not free-threaded: spec section 15.1.
dependencies = [
    # Numeric arrays and the memmap-backed durable state of section 15.4.
    # 2.5.2 is the version measured in the spec; OpenBLAS 0.3.34 ships with it,
    # which is the release where the pthread_atfork deadlock of numpy#30092 is fixed.
    "numpy==2.5.2",
    # The only way to verify a live BLAS thread count. Without it, section 7's
    # claim that BLAS is pinned to one thread per part cannot be made under Rule 0.
    "threadpoolctl==3.6.0",
    # inotify for the settings directory (section 15.3). Its Linux wheel is pure
    # Python via ctypes, so it needs no C compiler -- which matters on this box.
    "watchdog==6.0.0",
    # Public REST across venues: symbol catalogues and depth snapshots (phase 1
    # spec section 3). Admitted for its breadth rather than for these two calls --
    # the user's condition on phase 1 is that a third venue be cheap to add, and
    # ccxt already speaks 100+ of them, so venue three is an adapter over an
    # exchange it already knows instead of a new HTTP client written by hand.
    # Its websocket half has been free and open-source since 1.95 (verified: the
    # project's own statement, plus `import ccxt.pro` against a real install), so
    # no paid licence is implied by this line.
    # It costs 23 transitive packages, including cryptography that a public-only
    # phase never signs anything with. That is the price of the breadth above and
    # is recorded here rather than discovered later. Every one resolved to a
    # cp314 binary wheel -- this box has no compiler, so a source build would
    # have failed rather than silently succeeded.
    "ccxt==4.5.75",
    # The stream half is deliberately NOT ccxt's. The tape records raw venue
    # payloads rather than a library's normalisation (spec section 2.2), and the
    # sequence-continuity check is this project's own job because Bybit's own
    # reference SDK does not implement one at all (spec section 6). Both need the
    # bytes as they arrived, which a normalising client does not preserve.
    # Pure-Python wheel, so no compiler.
    "websockets==17.0.1",
    # Decodes Upstox's protobuf-encoded v3 market feed (spec section 5) --
    # the only broker adapter needing this so far, but any future adapter
    # streaming protobuf reuses it rather than adding a second decoder.
    # cp310-abi3 wheel, forward-compatible with 3.14, no compiler needed.
    "protobuf==7.36.1",
    # Fully-automated daily Upstox login (mobile+password+PIN+TOTP -> access
    # token), so broker-token-refresh-scheduler needs no human click. MIT,
    # actively maintained (PyPI, checked 2026-09-01). Unofficial -- replays
    # Upstox's internal login endpoints, same as every retail algo trader's
    # approach to this; see docs/secrets.md for where the credentials it
    # needs are stored.
    "upstox-totp==1.0.8",
    "ddgs>=9.16.0",
]

[project.optional-dependencies]
# Test runner. Pure Python, so no ABI question.
test = ["pytest==9.1.1"]
# Renders a spec or a board to a page. Pure Python.
docs = ["markdown-it-py==4.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A test that measures memory or durability must say which filesystem it ran on.
# Marked tests place a real process under a real cgroup limit and are slower.
markers = [
    "cgroup: places a process in a systemd transient scope and reads its cgroup files",
    "slow: takes more than a second because it forks, kills, or waits on writeback",
    # Calls a real public service. RL-063 says a verdict rests on real data, and
    # the three research readers spent a whole live session failing 380,660
    # fetches each with every checker green -- so their sources are tested
    # against the services themselves. Deselect with -m "not network" on a box
    # with no egress.
    "network: calls a real public service (arXiv, Crossref, GitHub, DuckDuckGo)",
    # Spends the operator's own LLM allowance. One stripped haiku call through the
    # Claude Code session transport is about $0.041 (measured 2026-09-07), and the
    # chain it proves -- a real market fact to a validated model answer -- could
    # not be proved any other way while the market is shut. Deselect with
    # -m "not spends_real_money".
    "spends_real_money: makes a real LLM call against the operator's subscription",
]
# Import `runtime` from the repository root rather than from wherever pytest was
# invoked. Declared here so no test needs a sys.path line of its own.
pythonpath = ["."]
