[upstox_candle_interval]
value = "I1"
unit  = "Upstox OHLC interval code"
note  = "Claude, 2026-09-02: which of Upstox's own OHLC bars broker-candle-bridge republishes onto the shared candle wire. Real bug found this date: market.marketOHLC.ohlc is a repeated field -- one MarketFullFeed message bundles several granularities together (Upstox documents \"I1\" for 1-minute and \"1d\" for daily; upstox.com/developer/api-documentation/v3/get-market-data-feed, fetched 2026-09-02), and the bridge was republishing every one of them onto `candle` unfiltered. kline-window-builder keys its per-symbol candle list by (venue_id, symbol) only, with no interval check, so a 1-day bar landed in the same window as 1-minute bars and corrupted its spacing/gap-detection math the instant a real feed ever carried more than one granularity. \"I1\" matches candle_interval's own reasoning (1m is the finest bar, the base the 5m/15m/30m ladder aggregates from) expressed in Upstox's own code rather than the crypto setting's \"1m\" -- broker-candle-bridge keeps Upstox's raw interval string on NormalisedCandle rather than remapping it, so this is compared against that raw string directly, never against candle_interval."

[zero_to_hero_maximum_premium]
value = 5.0
unit  = "rupees"
note  = "Claude, 2026-09-01: NOT YET MEASURED against real captured Indian option-chain data -- no live account is connected. Rs 5 is a commonly-cited colloquial cutoff for 'deep OTM lottery ticket' territory in Indian retail options discussion, used as a starting default rather than a derived figure. Re-derive from real premium distributions on NIFTY/BANKNIFTY/SENSEX expiry-day chains before this setting is relied on for anything beyond paper-trading exploration. MEASURED 2026-09-06 against real captured Indian option-chain data, which closes the caveat above rather than removing it: 1,524 NSE_FO contracts on the tape for 2026-09-04 carry both a real in-session premium and a real Upstox delta. Premium quantiles across them are p01 0.18, p05 0.70, p10 1.35, p25 5.00, p50 29.90; |delta| quantiles are p01 0.005, p05 0.017, p10 0.034, p25 0.130. So Rs 5 is the chain's own first quartile almost exactly, and 0.10 delta sits between its p10 and p25 -- the two colloquial defaults turn out to select the cheapest and furthest-OTM quarter of a real chain, which is what they were reaching for. Passing rates: premium 25.3%, delta 21.6%, both 16.3%, and the two disagree on 14.4% of contracts, so neither is redundant. The values are kept rather than moved: they are now sourced, and what should move them is a measured hit rate on scored candidates, not a re-fit to the same distribution. Note this detector only fires on expiry day, and 2026-09-04 was not one for these contracts, so this measures the chain rather than the pattern."

