unit  = "delta magnitude"
note  = "Claude, 2026-09-01: NOT YET MEASURED. 0.10 is a commonly-cited options-literature threshold for 'far out of the money', used as a starting default. Same caveat as zero_to_hero_maximum_premium -- re-derive from real captured Indian option-chain delta distributions before relying on it beyond paper-trading exploration. MEASURED 2026-09-06 against real captured Indian option-chain data, which closes the caveat above rather than removing it: 1,524 NSE_FO contracts on the tape for 2026-09-04 carry both a real in-session premium and a real Upstox delta. Premium quantiles across them are p01 0.18, p05 0.70, p10 1.35, p25 5.00, p50 29.90; |delta| quantiles are p01 0.005, p05 0.017, p10 0.034, p25 0.130. So Rs 5 is the chain's own first quartile almost exactly, and 0.10 delta sits between its p10 and p25 -- the two colloquial defaults turn out to select the cheapest and furthest-OTM quarter of a real chain, which is what they were reaching for. Passing rates: premium 25.3%, delta 21.6%, both 16.3%, and the two disagree on 14.4% of contracts, so neither is redundant. The values are kept rather than moved: they are now sourced, and what should move them is a measured hit rate on scored candidates, not a re-fit to the same distribution. Note this detector only fires on expiry day, and 2026-09-04 was not one for these contracts, so this measures the chain rather than the pattern."

