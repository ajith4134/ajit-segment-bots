[symbol_universe_option_contracts_per_underlying]
value = 50
unit  = "option contracts per underlying per expiry"
note  = "Claude, 2026-09-04: how many of the nearest expiry's option contracts broker-symbol-universe-bridge publishes for each underlying, taken nearest the money first. Fifty, matching the figure the operator's standing ruling on captured_symbol_count fixed on 2026-08-25 -- 'hold at 50 and stop walking. The count is not raised again until the project is 100 percent built' -- and for the reason recorded in that note rather than by analogy: cointegration-pair-finder and spread-reversion-detector fail as the SQUARE of the universe, and at 205 symbols the pair finder had tested 3,277,888 pairs while the spread detector had dropped 332,858 inputs and was still climbing. A nearest expiry across these three indices is well over a thousand contracts, so publishing the chain whole would reproduce that failure on a segment that has never completed a trade. Nearest the money rather than the first fifty the instrument master lists, because that is where the liquidity is: measured 2026-09-04 (measurements/2026-09-04-why-detector-windows-never-fill/), only 76 of 891 traded NSE_FO instruments -- 8.5% -- had traded often enough to fill a 256-observation detector window, and the ones that had not are the far-from-the-money contracts. This is a dial to walk with measurement, the way captured_symbol_count's own history shows it must be, and not before the segment has completed a round trip."

[broker_subscription_universe_maximum_age]
value = 120.0
unit  = "seconds"
note  = "Claude, 2026-09-04: how old a symbol-universe reading may be before broker-market-feed-reader stops subscribing from it. Four times symbol_universe_restatement_interval (30s), the same one-missed-restatement-is-not-a-fault reasoning broker_instrument_listing_maximum_age carries against its own refresh interval. The bound exists at all because an unbounded LatestByKey is the trap this project has fallen into repeatedly -- on 2026-08-26 four parts read part-resource-usage with no bound, so every part the governor had ever switched off still counted as running, and off-state-verifier recorded 167 faults with 0 verified releases. A universe that stopped being restated must stop being subscribed from rather than standing forever."

[anomaly_feed_silent_after_seconds]
value = 300.0
unit  = "seconds"
note  = "Claude, 2026-09-04: the floor beneath which market-anomaly-detector never calls a symbol's feed stopped, whatever its own rhythm. Its own setting, because until today this part read feed_coverage_window -- a setting belonging to feed-coverage-auditor, answering a different question (does this stream cover this symbol at all) and carrying that part's provenance, not this one's. Borrowing it meant this detector's bound moved whenever the auditor's did, for reasons that had nothing to do with anomalies. Started at 300.0, the value it had been inheriting, so this change is the ownership and the per-symbol patience below rather than a silent retune of a live threshold."

[anomaly_feed_silence_patience_multiple]
value = 2.8
unit  = "multiple of a symbol's own p99 gap between prints"
note  = "Claude, 2026-09-04: how far past its own habit a symbol must be silent before that silence is an anomaly. The bound becomes max(anomaly_feed_silent_after_seconds, this x that symbol's own p99 inter-print gap, estimated online), so a liquid symbol keeps the floor exactly and an option contract that ordinarily prints every few minutes stops being reported as a stopped feed. 2.8 carries the same provenance price_gap_patience_multiple's does -- the ratio that let ordinary quiet through while a real 1031s outage still cleared every window by more than a factor of eight -- and is the same rule RollingWindow._gap_bound_seconds already applies to a price window. Measured 2026-09-04: with the floor alone, 3,282 of 3,289 anomalies were 'this-venue-has-stopped-updating' on NSE option contracts that were merely quiet, and each one halted trading in that symbol. Re-measure against a real chain rather than trusting the crypto-derived ratio; it is the first number here that has never been fitted to Indian data."

[anomaly_feed_silence_gaps_needed]
value = 8
unit  = "gaps between prints"
note  = "Claude, 2026-09-04: how many of its own gaps a symbol must have shown before the patience above applies to it at all; below this the floor stands alone. Eight, for the reason RollingWindow._gap_bound_seconds requires half a window: a p99 estimated from a handful of gaps is one early pause deciding what ordinary looks like for that symbol forever, and the failure it would cause is the one this whole bound exists to prevent -- a genuinely dead feed inheriting patience from the pause that killed it."

[segment_trading_venues]
value = ["upstox"]
unit  = "venue id"
note  = "Claude, 2026-09-04: the venues whose recorded trades belong to the segment now trading, so a board does not answer a question about this segment with another one's rows. The position journal is append-only and still holds the crypto era's round trips: measured on the live board 2026-09-04, it served 100 closed trades -- SANDUSDT on binance-usdm -- beside capital, a universe and open positions that were all index-options in INR. Those trades are real and are kept; they are simply not this segment's, and the true state of index-options is that nothing has closed yet. An allowlist rather than a list of crypto venues to drop, because an ignore-list admits the first venue nobody thought to exclude, and a second broker is already planned (goal.md item 6) -- add it here when its adapter lands. Naming Upstox here rather than reading it from an adapter keeps the board off the diagram (T-4): a board that imported a part to learn this would be wiring itself into the circuit."

[backtest_window_reading_maximum_age_seconds]
value = 120.0
unit  = "seconds"
note  = "Claude, 2026-09-04: how old a historical-window, fill-sequence or fillable-size reading may be before instruction-replayer stops holding it. Ten seconds is ten refreshes at level_refresh_interval_seconds (1.0 s) -- the same figure and the same reasoning as part_usage_reading_maximum_age_seconds, so a level that is still true is restated ten times before it could age out. Measured why it is needed: historical-bar-store minted a fresh window_id for an unchanged window once a second per symbol, each carrying backtest_window_bars (1,440) bars, and the replayer keyed a LatestByKey on that id. It reached 13.9 GB and the kernel OOM-killed ajit-spine.service at 15:47:09 that day. The identity fix stops new keys being minted for unchanged windows; this bound is what makes a window that genuinely slides out of date stop being held, and since 2026-09-04 LatestByKey drops an expired key rather than only hiding it. Deliberately not applied to opportunity-instruction in the same part: instruction-writer publishes on arriving hypotheses rather than restating a level, so a bound there would silently retire instructions that are still live. Raised from 10 s to 120 s later the same day, when historical_window_refresh_interval_seconds was set to 30 s: a bound must outlast the refresh that feeds it or a still-current window ages out between restatements, which is the shape that made position-sizer price against a fifty-six minute stale price. 120 s is four refreshes, the same ratio the 10 s bound had against the 1 s one it was written for."

[closed_trade_join_maximum_age_seconds]
value = 3600.0
unit  = "seconds"
note  = "Claude, 2026-09-04: how long a fact about one closed trade is held while the parts that join facts about that trade wait for the rest. loss-cause-classifier, trade-episode-encoder, expectancy-decomposer and bot-scorekeeper each assemble several statements keyed by trade_id -- pnl-attribution, stop-audit, shortfall-breakdown, regime-transition-flag, outcome-significance -- and every one of those producers publishes once per closed trade and never restates it, so the key space is every trade ever closed and a LatestByKey over it only grows. An hour is far longer than the join actually needs: all of these producers fire off the same closed-trade event and their outputs arrive within seconds of each other, so the bound is set by what a very slow producer could take rather than by what a normal one does. Too short is the dangerous direction, because a fact that arrives after its trade aged out is a trade that is silently never classified, and nothing would report it -- which is why the number is generous rather than tight. Since 2026-09-04 LatestByKey drops an expired key rather than only hiding it, so this is what actually bounds the memory."

[locked_allocation_maximum_age_seconds]
value = 10.0
unit  = "seconds"
note  = "Claude, 2026-09-04: how long position-sizer holds a locked-allocation that fund-lock-ledger has stopped restating. The ledger publishes its whole lock set on every tick, so a lock that is released simply stops being published -- there is no release message. Keyed by order_id with no bound, the sizer therefore held every lock forever and could never see one released: capital reads as committed against orders that closed, which lowers what the next order is allowed forever. Ten seconds is ten restatements at level_refresh_interval_seconds (1.0 s), the same figure and reasoning as part_usage_reading_maximum_age_seconds. This is the level-versus-statement distinction runtime/input_assembly.LatestStatementBySource was written for; the age bound is the smaller change and answers the same failure, because the ledger restates every tick."

[llm_request_context_maximum_age_seconds]
value = 300.0
unit  = "seconds"
note  = "Claude, 2026-09-04: how long prompt-renderer holds a prompt-context whose request never came back. context-assembler publishes one per LLM request keyed by request_id and never restates it, so the key space is every request ever made and the assembly only grows -- each entry holding a whole assembled context, which is the largest payload this block moves. Five minutes is well past any call this system makes: llm_initial_backoff_seconds and the retry ladder above it are seconds, not minutes, so a context still unrendered at five minutes belongs to a request that failed rather than one that is slow. Deliberately not tighter: rendering a prompt whose context aged out is a request that silently produces nothing."

[journal_segment_maximum_bytes]
value = 1073741824
unit  = "bytes"
note  = "Claude, 2026-09-04: how large one journal segment may grow before the next entry starts a new file. One gibibyte. Measured that day, the five journals held 38 GB between them -- learning-recorder 15.4 GB, trade-lifecycle-recorder 11.5 GB, control-recorder 6.7 GB, position-recorder 4.2 GB -- with no trade ever placed; 75% of the learning journal was decision-rationale and 74% of the lifecycle journal was entry-candidate. Rotation rather than deletion: the journal is the only account of what the system did, so a retention policy that drops the oldest part of it destroys evidence to save disk. Nothing here removes a file; a full segment is renamed to carry the sequence it ended at and the chain continues into the new one, so an operator can archive, compress or move a closed segment with a tool that is not this one. A gibibyte because that is about what a forward reader can walk in a few seconds at these entry sizes (500-2,000 bytes, so 0.5-2 million entries per segment) and small enough that no single file is the 15.4 GB one this replaces -- and because rolling is cheap, a rename, so erring small costs only more files."

[regime_refresh_interval_seconds]
value = 10.0
unit  = "seconds"
note  = "Claude, 2026-09-04: how long an unchanged market-regime may go unsaid before regime-classifier says it again. Its own, rather than level_refresh_interval_seconds (1.0 s), because the keepalive refresh is per key and this level has far more keys than any other: measured that day, 600 symbols held as levels and 14 parts consuming market-regime, so one publish is 14 datagrams and the refresh alone is a floor of 8,400 messages a second before anything changes. That floor, not the absence of a change check, is what made this part 69% of all traffic on the spine. Ten seconds is safe against every reader: the only bounded one is signal-outcome-labeller at regime_reading_maximum_age_seconds (120 s), which sees twelve refreshes before it would age a still-true regime out, and the rest hold market-regime in an unbounded LatestByKey where a level never expires at all. A regime that actually changes is still published immediately -- the refresh is the keepalive, not the cadence."

[excursion_profile_refresh_interval_seconds]
value = 10.0
unit  = "seconds"
note  = "Claude, 2026-09-04: how long an unchanged excursion-profile may go unsaid before signal-excursion-profiler says it again. Its own, rather than level_refresh_interval_seconds (1.0 s), for the reason regime_refresh_interval_seconds has its own: the keepalive refresh is per key, and this part holds 838 of them -- 419 symbols on both sides, restored from a checkpoint -- against 5 consumers of excursion-profile, so one refresh sweep is 4,190 datagrams and the part published 13,044,004 messages while receiving no labels at all. Measured 2026-09-04 after the regime storm was fixed, this part was 43% of everything left on the spine. Ten seconds is safe because every consumer keeps what it drains: profit-lock, stop-target-placer, both exit-plan proposers and tail-trailing-exit-planner each read excursion-profile through Batch and store it per symbol (bull_exit_plan_proposer.py:224), so the refresh is what a reader needs once, on a cold start, and not a cadence anything depends on. That cold-start delay is the real cost and is why this is not longer: an exit-plan proposer refuses to plan without a fitted profile, and a position is open while it waits. Deliberately NOT paired with dropping keys the way regime-classifier's silent symbols are dropped -- a regime window is rebuilt from a few minutes of prices, while these distributions took 52,958 settled claims to fit and are checkpointed precisely so a restart does not throw them away."

[historical_window_refresh_interval_seconds]
value = 30.0
unit  = "seconds"
note  = "Claude, 2026-09-04: how long an unchanged historical-window may go unsaid before historical-bar-store says it again. Its own, and much longer than level_refresh_interval_seconds (1.0 s), because this is the largest payload on the bus: a window carries up to backtest_window_bars (1,440) bars, and four parts consume the type. Measured that day, with the shared interval: window_changes 77 against window_refreshes 70,699 -- 99.9% of everything this part published was a restatement nobody had changed -- and the two parts that read every bar of every window, intra-bar-fill-sequencer and fill-volume-capper, were burning 0.735 and 0.725 of a core between them, 27% of the whole spine, re-sequencing 24,783,629 bars. Thirty seconds is chosen against the bar interval rather than against a cadence: a window can only change when a bar closes, and backtest_bar_interval is 60 s, so a 30 s refresh restates an unchanged window at most twice between the moments it could possibly differ. The cost is that a cold reader waits up to 30 s for its first window, which is acceptable here and would not be on the live trading path: every consumer of this type is in the backtesting block, and a backtest that starts half a minute later is a backtest that starts. Must stay below backtest_window_reading_maximum_age_seconds, which is raised to 120 s alongside it so a still-current window is never aged out between refreshes."

[part_fault_refresh_interval_seconds]
value = 4.0
unit  = "seconds"
note  = "Claude, 2026-09-04: how long an unchanged part-fault may go unsaid before failing-part-detector says it again. Its own, rather than level_refresh_interval_seconds (1.0 s), because the keepalive is per key and this part watches 314 of them: measured that day it published 1,851,716 part-fault messages, 997 a second, 10.8% of everything on the spine, while its change check was working exactly as written and skipping only the 16% whose verdict had genuinely not moved. Four seconds rather than longer because the bound this must stay inside is warden_escalation_forget_seconds (10 s): failing-part-detector drops the key rather than publishing an all-clear, so absence is the only signal a cleared fault has, and a gap between restatements longer than that bound would make every refresh look like a fault clearing and returning. Four seconds leaves two and a half restatements inside the window, the same kind of margin part_usage_reading_maximum_age_seconds keeps against its own cadence. A fault whose part, kind or severity actually changes is still published at once -- the refresh is the keepalive, and 'still suspect' is not news."

[price_increment_refresh_interval_seconds]
value = 10.0
unit  = "seconds"
note  = "Claude, 2026-09-04: how long an unchanged price-increment may go unsaid before tick-size-resolver says it again. This part had no change check at all: it published resolve_all() -- one increment for every symbol it has ever seen a book for -- on every tick, measured that day at 1,204 messages a second and 13% of everything on the spine, for 1,156 symbols of which 1,006 resolved to UNKNOWN. A tick size is the most level-like thing on this bus: it comes from the instrument listing and does not move, and an inferred one converges and then stops. Ten seconds rather than longer because position-sizer is the only consumer and it is on the live trading path -- it refuses to size an order without an increment (REFUSED_NO_INCREMENT), so the refresh is how long a restarted sizer waits before it can place anything. It reads through an unbounded LatestByKey, so nothing ages out and the refresh is only ever a cold-start cost."

[correlation_remap_interval_seconds]
value = 15.0
unit  = "seconds"
note  = "Claude, 2026-09-04: how often correlation-cluster-mapper recorrelates every pair, and how long an unchanged cluster may go unsaid. Its own, rather than level_refresh_interval_seconds (1.0 s), because the cost is quadratic in the universe and the answer is not: correlation_window_length is 256 observations, about an hour at the feed's sampled rate, so a cluster computed once a second is an hour-long statistic recomputed three and a half thousand times per window turnover. Measured 2026-09-04: 548 symbols, 149,878 pairs, unmeasured_pairs 149,878 -- every pair of them, because no pair yet had correlation_minimum_shared_observations -- for 0.423 of a core, the largest single cost on the spine after the historical-window fix. Fifteen seconds still remaps 240 times across one window's span, which is far more often than the statistic can move. Deliberately not solved by forgetting symbols the way regime-classifier's are: the symbols here are not silent, prices keep arriving for all 548, so subjects_gone_quiet correctly declines to drop any and the universe is genuine. Both consumers -- exposure-limiter and trade-cluster-detector -- read through Batch and keep what they drain, so this is a cold-start wait rather than a cadence anything depends on."

[broker_catalogue_restatement_cycle_seconds]
value = 1800.0
unit  = "seconds"
note  = "Claude, 2026-09-04: how long broker-instrument-catalogue-reader takes to say the whole instrument master once, paced evenly. Separate from broker_catalogue_refresh_interval (3600 s), which is how often the master is re-fetched from Upstox and is right as it stands -- Upstox rebuilds the file once daily. This is how often each listing is restated on the bus, and it exists because publishing only on re-fetch left seventeen consumers unable to work. Measured 2026-09-04: expiry-day-zero-to-hero-detector ran ten minutes with listings_seen at zero and had never held a single listing, because its process is restarted by the governor far more often than once an hour and the catalogue is only spoken at the fetch. Pacing is the other half and is the reason this is a rate rather than a repeat: a listing pickles to 400 bytes and the default socket buffer is 212,992, so it holds 532 of them -- a burst of 102,940 overflows it 193 times over, which is why broker-market-feed-reader was measured holding 1,067 listings of 102,940 and none of the three index underlyings the segment trades. At 1,800 s the rate is 57 listings a second, a tenth of what one buffer holds, so no consumer can be overrun however slowly it drains. The cost is 57 x 17 consumers = 972 datagrams a second, about a fifth of the spine's total after the 2026-09-04 fixes, and that cost is the argument for the change this does not make: sixteen of those seventeen consumers want the traded universe rather than the whole NSE master, and filtering it would cut this by two orders of magnitude. That is a blueprint edit, because broker-symbol-universe-bridge selects the universe from the master and must keep receiving all of it."

[subscribed_listing_restatement_cycle_seconds]
value = 300.0
unit  = "seconds"
note  = "Claude, 2026-09-05: how long subscribed-instrument-listing-filter takes to say the whole subscribed set once, paced evenly. The same mechanism as broker_catalogue_restatement_cycle_seconds and deliberately a sixth of it, because the table is fifty times smaller: measured on the live spine 2026-09-05, broker-market-feed-reader reported subscribed_instruments 2,000 against a 102,940-row master. At 300 s the rate is 6.7 listings a second against the 532 a default 212,992-byte socket buffer holds, so no consumer can be overrun however slowly it drains, and ten consumers cost 67 datagrams a second where the master cost them 570. Shorter than the master's cycle on purpose: a consumer restarted by the governor has the whole subscribed set within five minutes rather than thirty, and expiry-day contracts are subscribed on expiry morning, which is exactly when expiry-day-zero-to-hero-detector needs them."

[broker_subscription_state_maximum_age]
value = 4.0
unit  = "seconds"
note  = "Claude, 2026-09-05: how old a broker-subscription-state reading may be before subscribed-instrument-listing-filter stops restating the instruments it names. Four times level_refresh_interval_seconds (1.0 s), the same one-missed-restatement-is-not-a-fault reasoning broker_subscription_universe_maximum_age carries against its own restatement interval. The bound exists at all because an unbounded LatestByKey is the trap this project has fallen into repeatedly -- on 2026-08-26 four parts read part-resource-usage with no bound, so every part the governor had ever switched off still counted as running and off-state-verifier recorded 167 faults with 0 verified releases. A feed reader that has stopped saying what it subscribed is a feed reader whose connection nobody can vouch for, and its last subscription must stop standing rather than stand forever."

[close_out_minutes_before_the_expiry_session_closes]
value = 15.0
unit  = "minutes"
note  = "Claude, 2026-09-05: how long before the session closes on a contract's expiry day pre-expiry-position-closer stops holding it and closes at market. Its size is set by what has to fit inside it, not by taste: an exit is repeated no sooner than order_latency_maximum (5.0 s) and only when the previous ask has been answered by the position shrinking, so the window has to hold several ask-and-answer rounds against a book that is at its thinnest of the week. Fifteen minutes is 180 such rounds at the stated latency, and against NSE's 15:30 close it starts at 15:15 -- inside normal market hours, not the 15:40-16:00 post-close window, which is cash-only and cannot close an option at all. The lower bound is a mechanism, not a preference: Indian single-stock options are PHYSICALLY settled, so a bought call still open at the close becomes a delivery obligation for strike x lot size rather than a premium that expires, and the whole point of this number is that no ask can still be outstanding when that happens. It is deliberately NOT a buffer of whole days, which is what docs/superpowers/specs/2026-09-01-options-segment-bots-design.md section 2 sketched: a day-scale buffer would forbid expiry-day-zero-to-hero-detector from trading the expiry-day move it exists for. Widen it the first time an exit is still outstanding at the close -- longest_wait_seconds and positions_at_the_cap on this part's own standing are what says so -- rather than pre-emptively."

[market_session_reading_maximum_age_seconds]
value = 86400.0
unit  = "seconds"
note  = "Claude, 2026-09-05: how old a market-session-state reading may be before pre-expiry-position-closer stops believing which session it is in. A day, and it is bounded for the reason every LatestByKey and LatestValue here is bounded -- on 2026-08-26 four parts read part-resource-usage with no bound at all, so every part the governor had ever switched off still counted as running. A day rather than minutes because market-session-calendar polls NSE's holiday list only every market_session_poll_seconds (21,600 s = 6 hours) and republishes the level on change or on its refresh interval; a bound tighter than the poll would age out a session that is still perfectly true and leave this part refusing to judge any expiry, which it counts as refused_no_session. The failure this bounds is the opposite one: a calendar that died on Friday must not still be asserting Friday's session on Monday, because closing against the wrong date is closing a day early or not at all."

[intraday_square_off_minutes_before_the_session_closes]
value = 25.0
unit  = "minutes"
note  = "Claude, 2026-09-05: how long before the session closes intraday-square-off-placer stops holding an intraday segment's positions and closes them at market. Sized against the BROKER's deadline rather than the exchange's: Upstox squares off open MIS equity positions itself from roughly 15:15 IST, fifteen minutes before the 15:30 close, so a square-off that merely beat the close would be racing an exit the broker had already started. Twenty-five minutes opens the window at 15:05 and leaves ten clear minutes before the broker acts, which at order_latency_maximum (5.0 s) is 120 ask-and-answer rounds -- an exit repeats no sooner than that and only once the previous ask was answered by the position shrinking. Deliberately wider than close_out_minutes_before_the_expiry_session_closes (15.0), which only has to beat the exchange's own close. THE 15:15 FIGURE IS BROKER POLICY AND IS NOT VERIFIED HERE: it is not in Upstox's instrument master and this project has never placed a live MIS order. Confirm it against Upstox's own published square-off timing before this segment ever runs in live mode; the mechanism -- finish before the broker starts -- is what fixes the shape of this number, and only the deadline itself is assumed."

[margin_quote_wait_after_a_refusal_seconds]
value = 60.0
unit  = "seconds"
note  = "Claude, 2026-09-08: how long broker-margin-quoter waits before asking Upstox again after a call it refused. Exists because a failed call marks nothing as quoted, so the same instruments were due again on the very next tick and the retry was the cause of the refusal rather than a recovery from it. Measured on the live spine 2026-09-08: **18,946 calls made, 18,943 failed**, every one HTTP 429 `UDAPI10005 Too Many Request Sent` (reproduced by hand against the real endpoint that day), quotes_read 60 for a whole session, and unattended-run-warden escalating the part four times as `taking-longer-every-tick`. A minute because that is the order of the window a per-minute API quota resets on and because a margin requirement is not a fast-moving number -- margin_requote_interval_seconds already treats it as one worth re-asking rarely. What would settle it exactly is Upstox's published per-endpoint rate limit read from their own documentation, or the Retry-After header if that endpoint sends one; neither has been read yet, and a wait that is too long only delays a leverage cap this system already holds at the operator ceiling. Same shape as close_order_restated_after_seconds and as switching-planner's 2026-08-26 lesson: an ask is not repeated until it could have been answered."

[margin_quote_instruments_per_call]
value = 20
unit  = "instruments per margin call"
note  = "Claude, 2026-09-05: how many instruments broker-margin-quoter prices in one call to Upstox's margin endpoint. Twenty, which is Upstox's own documented cap and is already stated in the adapter as MAXIMUM_MARGIN_QUOTE_INSTRUMENTS -- the adapter raises rather than truncates above it, so this is the cap and not a choice around it. At twenty, cash-equity-intraday's fourteen underlyings are priced in a single call."

[margin_requote_interval_seconds]
value = 3600.0
unit  = "seconds"
note  = "Claude, 2026-09-05: how long a broker margin quote stands before the instrument is asked about again. An hour. The requirement is set from SEBI VAR+ELM margins that are revised daily rather than intraday, so an hour re-reads it several times a session without spending the rate limit the trade path needs; the whole reason this is quoted per instrument on an interval rather than per order is that the requirement scales with quantity and the ratio does not. Shorten it only on evidence that a limit moved inside a session -- broker-margin-quoter's own leverage_available is what would show it -- and never below what leaves headroom for the order calls themselves."

[leverage_carry_tolerance_per_day]
value = 0.001
unit  = "fraction of notional per day"
note  = "Claude, 2026-09-05: the most leverage-selector will pay per day to borrow, at the chosen leverage, before it reduces that leverage. Ten basis points a day, carried over unchanged from leverage_funding_tolerance_per_day (operator, 2026-08-23), which this replaces -- the tolerance is a statement about how much carry this project is willing to pay for a position, and that judgement does not change because the carry is now a broker's interest on borrowed rupees rather than a perpetual's funding on notional. The old setting stays in place unread, the way retired settings here always have, rather than being deleted under a running spine."

[intraday_borrowing_daily_interest_rate]
value = 0.0
unit  = "fraction of the borrowed amount per day"
note  = "Claude, 2026-09-05: what the broker charges per day on the part of an intraday position its own margin does not cover. ZERO, and the zero is the finding rather than a placeholder: Upstox's intraday (MIS) leverage carries no financing charge for a position opened and squared off inside the same session -- interest is what the MARGIN TRADING FACILITY charges to carry a position overnight, which is a different product this segment deliberately does not use (intraday-square-off-placer exists to guarantee that). This is why the crypto funding penalty could not simply be pointed at an Indian input: a perpetual always pays funding, and an intraday equity position squared off the same day genuinely pays none, so the old code's 0.5 penalty for an unknown rate would have halved every leverage this segment ever chose for a cost nobody charges. NOT VERIFIED against Upstox's own brokerage schedule -- same standing as the 15:15 square-off time -- so confirm it there before this segment runs live, and set it to the real MTF rate the day this project carries an equity position overnight. The mechanism is already wired for that: carry = (1 - 1/leverage) x this rate, so a non-zero value reduces leverage exactly the way funding used to."

[broker_margin_requirement_maximum_age_seconds]
value = 7200.0
unit  = "seconds"
note  = "Claude, 2026-09-05: how old a broker-margin-requirement may be before leverage-selector stops sizing against it. Two hours, twice margin_requote_interval_seconds (3600) -- the same one-missed-restatement-is-not-a-fault reasoning broker_instrument_listing_maximum_age carries against its own refresh interval. Bounded at all because an unbounded LatestByKey is the trap this project has fallen into repeatedly: on 2026-08-26 four parts read part-resource-usage with no bound and every part the governor had ever switched off still counted as running. Here the bound has teeth -- a permission the broker gave two hours ago and has not restated must expire into UNLEVERAGED_NO_BROKER_QUOTE rather than stand forever, because sizing against a stale grant is the same failure as sizing against one nobody gave."

[built_segments]
value = ["index-options", "stock-options", "cash-equity-intraday"]
unit  = "segment"
note  = "operator, 2026-09-05: every segment this spine trades at once, from the temporary goal in docs/goal.md -- three bots paper trading on live data by Monday 2026-09-07. `segment_id` above stays as the one whose settings stand in wherever a value is not keyed by segment yet; this is the list. A spine trading one segment states a one-item list rather than removing the setting. Order is the operator's and is kept: it is the order the instrument classifier reports claimants in, and nothing else depends on it. Adding a segment here is not enough to trade it -- segments/<id>.toml must exist and state its own capital, money mode, underlyings and instrument types."

[capital_bounds_maximum_age_seconds]
value = 120.0
unit  = "seconds"
note  = "Claude, 2026-09-05: how old a segment's trade-capital-bounds may be before trade-capital-bounds-gate stops binding orders against it. capital-allotment-reader re-reads and republishes every tick, so two minutes is many missed restatements and not one; the bound exists because the gate now keys bounds by segment (three segment bots on one spine) and an unbounded LatestByKey holds a key's last value forever -- the trap that on 2026-08-26 left every part the governor had switched off still counting as running. A segment whose capital settings stopped being read must stop having orders bound against the last figure it published: the gate refuses an order with no bounds by name, which is the honest answer, and binding a stale ceiling would be a silent one. Same figure and same reasoning as broker_subscription_universe_maximum_age."

[money_mode_maximum_age_seconds]
value = 120.0
unit  = "seconds"
note  = "Claude, 2026-09-05: how old a segment's money-mode may be before order-destination-router stops addressing orders with it. money-mode-reader re-reads and republishes every tick, so two minutes is many missed restatements. The bound exists because the router now keys the mode by segment -- three segment bots share one spine and one of them could be live while another is on paper -- and an unbounded LatestByKey holds a key's last value forever, which is what left every switched-off part counting as running on 2026-08-26. A segment whose mode stopped being read sends no order at all, which is what the router already does with an absent mode: paper would silently drop a live trade and live would spend real money on an unread setting."

[correlation_passes_per_sweep_ceiling]
value = 240
unit  = "passes"
note  = "Claude, 2026-09-05: the most passes correlation-cluster-mapper may take to measure every pair once. It is what makes the pair budget derived rather than chosen -- the budget is the pair count divided by this, so one full sweep finishes inside one correlation window and no correlation is ever older than the window it describes. 240 is correlation_window_length (256 observations, about an hour at the feed's sampled rate) divided by correlation_remap_interval_seconds (15 s): 240 remaps per hour. Measured on this box the same day: one pair costs 76 microseconds with each symbol's returns computed once per pass, so the 2,444-share cash-equity universe's 2,985,346 pairs come to 12,439 per pass and 0.95 s of CPU every 15 s -- 6% of a core. Without it the same universe is 228 seconds of CPU per 15-second pass, fifteen cores continuously, for a statistic whose own window is an hour long."

[correlation_maximum_pairs_per_pass]
value = 20000
unit  = "pairs"
note  = "Claude, 2026-09-05: the hard ceiling on one pass, whatever the sweep ceiling derives. 20,000 pairs is 1.5 s of CPU at the measured 76 microseconds a pair, or 10% of a core at the 15-second remap interval -- and a pass is one uninterrupted stretch of work, so this is also how long the part may take to answer its control socket. It binds only if the universe grows past about 3.1 million pairs (2,490 symbols), at which point a sweep starts taking longer than one window and the standing says so: sweeps_completed stops climbing once per window."

[correlation_remembered_pairs_maximum]
value = 100000
unit  = "pairs"
note  = "Claude, 2026-09-05: how many cluster-forming pairs are carried between passes. Clusters are built from a whole sweep rather than from one pass's slice -- a pair measured three passes ago is still the best answer there is about it -- so the measurements have to be remembered, and remembering all of them at 2,444 symbols is three million entries. Only pairs at or above correlation_cluster_threshold are kept, because those are the only ones union-find acts on, and a pair that falls below it is forgotten the moment it is remeasured. 100,000 bounds this at tens of megabytes; strong_pairs_evicted on the standing is what says the bound was reached, and a number climbing there means the threshold is too low for this universe rather than that the memory is too small."

# ---------------------------------------------------------------------------
# Added 2026-09-06. These 61 settings existed only in the operator's live
# ~/.config copy and in no tracked file, so a lost disk would have taken the
# whole Indian-market half of this configuration with it -- every
# equity_intraday_* charge rate, every cash_equity_shortlist_* weight, the
# broker connection settings, and the zero_to_hero thresholds. Rule 9 says
# everything on this server lives in GitHub; a number nobody can restore is
# exactly the thing that rule exists for. Values and provenance notes are
# copied verbatim from the live file, which stays the one the parts read.
# ---------------------------------------------------------------------------

[symbol_selection_liquidity_pool_size]
value = 300
unit  = "symbols per venue"
note  = "operator, 2026-08-29: under the volume-and-volatility-blend metric, only the top this-many by volume are even eligible to be ranked by volatility -- a floor so a thin, hard-to-fill symbol cannot outrank a liquid one purely by having spiked. Not measured: a first estimate, six times captured_symbol_count (50), wide enough to surface real movers without reaching into the illiquid tail of ~860 symbols per venue. Revisit once the blend has run and fill quality on its lower-liquidity selections can be checked."

[symbol_selection_volatility_weight]
value = 0.35
unit  = "fraction, 0 to 1"
note  = "operator, 2026-08-29: how much a symbol's 24-hour range percentile counts against its volume percentile under the volume-and-volatility-blend metric -- 0 is pure volume (identical to quote-volume-24h restricted to the pool), 1 is pure volatility. 0.35 is a judgement call, not a measurement: there is no historical run yet to tune it against. Revisit against the first blend-selected watchlist's actual trade outcomes. Together with symbol_selection_momentum_weight and symbol_selection_acceleration_weight, must sum to at most 1.0 -- the remainder is volume's share."

[symbol_selection_momentum_weight]
value = 0.15
unit  = "fraction, 0 to 1"
note  = "operator, 2026-08-29: how much a symbol's 1-hour price-change percentile counts, under volume-and-volatility-blend. Bybit-only: it states a 1-hour-old price on its bulk ticker (prevPrice1h) and Binance states nothing shorter than 24h at all, so this signal is silently unavailable on Binance and its weight there returns to volume rather than ranking every symbol identically. Kept deliberately small -- a flat 1-hour net change cannot tell a fresh move from a spike that already reversed within the hour, which is the whole reason symbol_selection_acceleration_weight exists as the stronger signal."

[symbol_selection_acceleration_weight]
value = 0.35
unit  = "fraction, 0 to 1"
note  = "operator, 2026-08-29: how much a symbol's short-window acceleration percentile counts, under volume-and-volatility-blend -- the fraction of a recent kline window's own high-low range that happened in just its most recent slice (close to 1 = moving right now; close to 0 = already moved and gone quiet). This is the metric proposed to answer 'don't pick a symbol whose move is already over': docs/proposals/rank-by-recent-acceleration-not-just-24h-range.md. Only symbols the rotation has actually scanned carry a reading; the rest fall back to volume+volatility+momentum alone until their turn comes."

[symbol_selection_short_window_scan_size]
value = 60
unit  = "symbols per venue per refresh"
note  = "operator, 2026-08-29: how many liquidity-pool symbols get a fresh kline-based acceleration reading each catalogue refresh. Neither venue bulk-serves short-interval candles, so this is one REST call per symbol scanned -- bounded and rotated through the pool rather than scanning all symbol_selection_liquidity_pool_size (300) at once, since the per-call REST weight for a kline request was not confirmed against primary Binance documentation (WebFetch could not render the JS-rendered weight table; see the research behind this proposal). At 60/refresh with a 300-symbol pool, one full rotation takes 5 refreshes (75 minutes). Raise it once the actual weight cost is measured live."

[symbol_selection_short_window_kline_interval]
value = "5m"
unit  = "candle interval name"
note  = "operator, 2026-08-29: the bar size the acceleration scan requests. Five minutes, so symbol_selection_short_window_kline_count bars covers an hour at a resolution fine enough to tell 'moving in the last 15 minutes' from 'moved earlier in the hour'."

[symbol_selection_short_window_kline_count]
value = 12
unit  = "bars"
note  = "operator, 2026-08-29: how many symbol_selection_short_window_kline_interval bars the acceleration scan requests per symbol -- 12 five-minute bars is the one-hour baseline window symbol_selection_short_window_recent_bars is measured against."

[symbol_selection_short_window_recent_bars]
value = 3
unit  = "bars"
note  = "operator, 2026-08-29: how many of the most recent symbol_selection_short_window_kline_interval bars count as 'right now' when computing acceleration -- three five-minute bars is the last 15 minutes, measured against the full symbol_selection_short_window_kline_count-bar window."

[regime_state_checkpoint_interval]
value = 20000
unit  = "price observations"
note  = "operator, 2026-08-29: how many prices regime-classifier may observe before it writes its series down. Same figure and the same reasoning as pair_state_checkpoint_interval: this part reads the same symbol-price-frame wire cointegration-pair-finder does, at a comparable rate, and a price series changes hundreds of times a second so losing a few seconds of it costs nothing. Added after measuring 48,192 classification attempts and 48,192 unclassified -- every restart discarded the whole window, and regime_minimum_observations (1024) means a symbol whose window keeps getting wiped can never classify at all."

[remembered_fill_ids]
value = 5000
unit  = "fill ids"
note  = "operator, 2026-08-25: how many recent fill ids each lot-book part keeps so a venue re-sending a fill cannot count it twice. Bounded rather than unbounded for a reason that is arithmetic: the lot books are checkpointed on every fill, so a set that only grows makes each write larger and the total work quadratic -- at this run's ~40 fills an hour, a year of ids would be megabytes rewritten per fill. Five thousand is about five days at that rate and roughly 200 kB per checkpoint, against a re-delivery window a venue measures in seconds, so the bound is far wider than the thing it guards and still cheap. Getting it too low means a re-sent fill counted twice, which opens a phantom position; too high costs only writes. Raise or lower it against a measurement of actual re-delivery, and record what that measurement was."

[closed_trades_trustworthy_after_ns]
value = 1787639131000000000
unit  = "nanoseconds since the epoch, UTC"
note  = "operator, 2026-08-25: closed trades recorded before this moment carry an entry price and a quantity the market never printed, and every closed-trade-decoding part must refuse them rather than learn from them. position-close-detector backed the entry out of the closing fill, so a round trip sold in slices reported the whole trip's profit divided by whatever fraction closed last -- ten of the 113 trades on this machine carry one, including AAVE at 217.02 falling to 132.57 in 37 seconds and ETH at 3297 falling to 2517, neither of which happened. The fix is commit 460b7ec, committed 05:37:11Z; this value is 06:25:31Z, the first moment the live spine ran it, read from the supervisor log rather than guessed -- the code being committed is not the code being run. A decoder trained on the earlier rows would learn stop placement and exit quality from prices that never existed, which is worse than learning nothing. The bad rows are not deleted: the journal is append-only and digest-chained, and rewriting history to hide a defect is the one repair that costs more than the defect. Raise this only if another arithmetic defect is found in what a closed trade records, and say which."

[pair_state_checkpoint_interval]
value = 20000
unit  = "price observations"
note  = "operator, 2026-08-25: how many prices cointegration-pair-finder may observe before it writes its series and verdicts down. Twenty thousand, which at the observed rate -- about 4.7 price frames a second across 100 captured symbols, so roughly 470 observations a second -- is a write about every 40 seconds. The cost of a crash is that many observations, which for a 256-long window is a fraction of one refill; the cost of writing more often is an fsync of about a megabyte. Not every fill, as the lot books are: a lot book changes about 40 times an hour and losing one costs a whole round trip, while a price series changes hundreds of times a second and losing a second of it costs nothing. Raise it if checkpoint writes ever show up as an io-pressure-meter reading, and record that reading."

[peak_excursion_checkpoint_interval]
value = 1000
unit  = "basis observations"
note  = "operator, 2026-08-29: how many priced observations of an open position peak-excursion-tracker may make before it writes its extremes down. Counted only over ticks that actually had an open position to price (checkpointable_observations), not the whole market-data tape -- with a handful of positions open at a time this is a far lower rate than cointegration-pair-finder's, so its 20000 would have made this checkpoint about as stale as the fill-gated one it replaces. 1000 is a starting estimate, not a measurement: revisit against the observed write rate once this has run, and raise it if checkpoint writes ever show up as an io-pressure-meter reading."

[position_state_root]
value = "~/.local/share/ajit-segment-bots/positions"
unit  = "path"
note  = "operator, 2026-08-25: where a lot book waits for the next process. Its own directory rather than learned_state_root's, because a lot book is not learned -- it is what the venue filled, and an operator clearing what the system concluded must not also clear what it holds. Put through storage_facts.require_durable_directory, which refuses a memory-backed filesystem: /tmp is tmpfs on this box, so a position checkpointed there would survive right up until the machine restarted, which is the one moment it is needed. Measured reason this exists: the spine had started 46 times, 855 positions had been opened and only 115 round trips closed, because position-close-detector and cost-basis-tracker held their lot books in memory alone and every start forgot every open position."

[position_state_checkpoint_interval]
value = 1
unit  = "fills"
note  = "operator, 2026-08-25: how many fills a lot book may take before it is written down. One -- every fill. The learned models checkpoint every 500 observations because they train thousands of times a minute and an fsync per step would cost more than a crash; a fill is the opposite, arriving about 40 times an hour on this run, and what a missed one costs is not a fraction of a coefficient but a whole round trip that can never be scored. Raise it only against a measurement showing fill fsyncs are a cost, and record what that measurement was."

[tail_crowding_order_flow_deviation_threshold]
value = 2.0
unit  = "standard deviations"
note  = "Claude, 2026-09-01: how far the order-flow imbalance (broker-open-interest, buy minus sell quantity over their total) must sit from its usual level before it reads as a crowded position. Carried the crypto build's funding-deviation threshold's magnitude (tail_crowding_funding_deviation_threshold, operator, 2026-08-23) as a starting point since both measure a standardised deviation the same way -- NOT YET MEASURED against real Indian open-interest data."

[funding_premium_clamp]
value = 0.0005
unit  = "fraction of notional"
note  = "operator, 2026-08-29: the interest-vs-premium clamp in the venue formula funding-rate-forecaster computes (see that file's own docstring: clamp(interest - premium, +/-0.05%)). Five basis points, the standard perpetual-funding formula both venues document. Not fetched from either venue's API in this codebase -- unlike interval, cap, floor and interest rate, which are venue-declared per symbol and read off symbol-universe -- because neither exposes this clamp as a field on any endpoint read here. Reference knowledge from the venues' published formula documentation, not a live reading; revisit if a captured payload is ever found to carry it."

[vol_feature_medium_window]
value = 20
unit  = "candles"
note  = "operator, 2026-08-25: the middle horizon volatility-feature-builder measures over, between vol_feature_short_window (5) and vol_feature_long_window (60). The heterogeneous autoregressive form needs three legs and had two: a short and a long window can say whether volatility is rising or falling and cannot say whether it is doing so steadily or in a spike, which is a different trade. Twenty candles sits between the two at roughly the 1:4:12 spacing the daily HAR literature uses for 1, 5 and 22 days -- the ratios transfer to one-minute candles, the day counts do not, and annualising by 252 here would be applying a trading-day constant to minutes. From the volatility reel read 2026-08-20 (docs/research/instagram-2026-08-20.md section 1), whose ten-feature specification named RV1, RV5 and RV22 and which this system had implemented as two windows. Widen the spacing only against a measurement that the middle leg is carrying no weight the other two do not."

[level_refresh_interval_seconds]
value = 1.0
unit  = "seconds"
note  = "Claude, 2026-08-26: how long an unchanged level may go unsaid before a part says it again. A level -- a budget, a fault, a tier, a limit -- is true until it changes, and 23 parts ended their tick with an unconditional publish of one, so every level went onto the bus on every tick. Measured on the live spine at 10:14: failing-part-detector published 26,575 messages a second from 283 received and part-restart-budgeter 17,106 from 6,963, 89,747 a second across the spine, load average 28.7 on twelve cores, and seven parts reading as silent because they could not get the CPU to send the heartbeat that would have proved them alive. One second, matching part_health_interval: a level is refreshed at the cadence every part already reports at, so a consumer that starts after the last change waits no longer for the level than it already waits for a heartbeat, and a LatestByKey bounded by part_usage_reading_maximum_age_seconds (10 s) sees ten refreshes before it would age a still-true level out. The refresh is what keeps this from being pure edge-triggering, which is how a restarted consumer starves."

[sweep_short_window_fraction]
value = 0.25
unit  = "fraction of the window"
note  = "Claude, 2026-08-26: what 'recent' means for volatility_ratio -- the standard deviation of the last quarter of a window's returns against the whole window's. A ratio, so a symbol whose volatility is rising reads the same in a stablecoin pair and a thin alt, which is the property the raw number does not have. A quarter of detector_window_length (256) is 64 observations, comfortably above the two a standard deviation needs and short enough that a change in regime shows before the long window has absorbed it. Not measured against outcomes yet -- no instruction has been written, so nothing has been scored -- and this note is the record that the number is a stated choice awaiting that measurement rather than a fitted one."

[sweep_minimum_symbols_for_cross_section]
value = 8
unit  = "symbols"
note  = "Claude, 2026-08-26: the fewest symbols with a measurement before universal-symbol-sweeper and signal-outcome-labeller will state a cross-sectional rank or a market excess over it. A percentile over one observation is 0 or 1 by construction and describes nothing; over eight, the coarsest a rank can be is one-seventh, which is finer than any threshold a watch condition would sensibly place on it. Below this the measurement is absent rather than approximate, so the sweeper counts the symbol unmeasurable instead of evaluating a condition against a universe that was not there. Eight rather than a fraction of the universe because the bound is about whether a percentile means anything at all, not about coverage -- coverage is what symbols_not_reached already reports."

[regime_reading_maximum_age_seconds]
value = 120.0
unit  = "seconds"
note  = "Claude, 2026-08-26: how old a market-regime reading may be before signal-outcome-labeller stops attaching it to a claim. A LatestByKey with no age bound holds a key's last value forever, which is the shape that cost position-sizer a fifty-six minute stale price on 2026-08-23 and made every part the governor had switched off still look alive to it on 2026-08-26 -- the question to ask of every level is what makes its keys go away. 120 s is price_series_maximum_gap_seconds, and deliberately the same number: a regime is computed from a price window, so a reading whose series would already have been cleared as holed describes a stretch of market that no longer connects to now. regime-classifier publishes about once a second per symbol, so an ordinary reading is never near this; reaching it means the classifier stopped, and a claim then carries REGIME_NOT_KNOWN rather than the last thing it managed to say."

[tail_move_remaining_maximum_age_seconds]
value = 60.0
unit  = "seconds"
note  = "Claude, 2026-08-26: how old tail-move-remaining-estimator's reading may be before tail-trailing-exit-planner stops trailing against it. The estimator publishes when a follow-candidate arrives, so an ordinary reading is seconds old; reaching a minute means the move this bot joined is no longer being estimated, and a trail set against a stale figure is a stop placed by a number from a different market. Sixty seconds is reference_price_maximum_age_seconds, the same ceiling the price staleness estimator clamps to, and for the same reason: past it every symbol measured moves further than the stop distance being worked with, so the figure cannot place a stop whatever it says."

[margin_schedule_maximum_age_seconds]
value = 5400.0
unit  = "seconds"
note  = "Claude, 2026-08-26: how old a symbol-universe entry may be before liquidation-cluster-mapper stops reading its maintenance margin ladder. Every LatestByKey needs the question asked of it -- what makes its keys go away -- because a level with no age bound holds a key's last value forever, which is what made every part the governor had switched off still look alive to it on 2026-08-26. 5400 s is six times symbol_catalogue_refresh_interval (900 s), so five consecutive failed catalogue reads pass before a ladder expires: a margin ladder changes when a venue amends its risk limits, which is a matter of weeks, so the bound is about noticing the reader has died rather than about the number going stale. When it does expire the map is refused as no-margin-schedule, which is the correct answer -- a liquidation price computed from a ladder nobody is refreshing is a rule of thumb wearing a calculation's clothes."

