note  = "Claude, 2026-09-02: how long a reader of instrument-restriction or market-session-state believes the last statement about one key (one symbol, one segment). The bus publishes each item of a level as its own message and an empty level publishes nothing at all (runtime/bus.py publish: 'for item in items'), so 'this symbol is no longer banned' cannot travel as an empty tuple -- the reader has to expire the key. 180s is 3x instrument_restriction_refresh_interval_seconds' 60s, so two consecutive missed restatements are tolerated and the third expires the claim. Fails safe in both directions: an expired restriction stops halting a name the exchange released, and an expired session reads as 'not measured', which does not fill."

[equity_intraday_flat_brokerage]
