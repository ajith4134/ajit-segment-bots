[reference_price_move_anchor_seconds]
value = 1.0
unit  = "seconds between the prints a move is measured across"
note  = "operator, 2026-08-24: two trades a millisecond apart differ by the tick, not by the symbol's volatility, so a move is only measured against an anchor at least this old and is then scaled to one second by the square root of the gap. One second because that is the unit the bound is expressed in and the finest spacing at which the top-30 symbols all print reliably: BTCUSDT printed 807,425 times on 2026-08-23, ADAUSDT 60,229, so a one-second anchor is dense for the busiest and still reachable for the quietest."

[reference_price_move_quantile]
value = 0.95
unit  = "quantile of the absolute one-second move"
note  = "operator, 2026-08-24: the bound must hold on an unusual second, not a typical one -- a price is dangerous exactly when the market moved, and a median move would size the bound for the calm the trade is not taken in. The measurement in measurements/2026-08-24-reference-price-staleness/ reports median, p95 and p99 side by side, and p95 is the one the bound is set from."

[reference_price_move_window]
value = 3600
unit  = "one-second moves kept per symbol"
note  = "operator, 2026-08-24: an hour of moves at the anchor spacing. Bounded because volatility is not stationary -- a symbol calm this morning and violent this afternoon must be believed for a shorter time this afternoon -- and an hour is long enough that one burst cannot dominate the quantile while short enough that this morning does not decide this afternoon's bound."

[reference_price_move_observations_needed]
value = 300
unit  = "one-second moves before the estimate is the symbol's own"
note  = "operator, 2026-08-24: five minutes of prints. Below it the bound falls back to the measured prior rather than to a quantile of a handful of moves, which on a quiet five minutes would read as a symbol that never moves and licence an arbitrarily old price. Never seen is answered by the prior, not by optimism."

[reference_price_prior_one_second_move]
value = 0.000898
unit  = "fraction of price, 95th percentile of the absolute one-second move"
note  = "operator, 2026-08-24: what a symbol whose own moves have not been measured yet is assumed to do. The median across the six symbols measured on this system's own tape for 2026-08-23 -- BTCUSDT 0.0374%, SOLUSDT 0.0432%, ADAUSDT 0.0893%, ETHUSDT 0.0902%, 1000PEPEUSDT 0.0914%, ENAUSDT 0.1468% -- so an unmeasured symbol is treated as an ordinary one of this venue's top thirty rather than as the calmest or the wildest. It implies a 1.5s bound before anything is learned. Re-measure with measurements/2026-08-24-reference-price-staleness/measure_price_drift_by_age.py when the captured universe changes."

[reference_price_minimum_age_seconds]
value = 1.0
unit  = "seconds"
note  = "operator, 2026-08-24: the floor on the learned bound. Below the one-second anchor spacing the estimate is extrapolating inside its own resolution and cannot tell a 0.5s bound from a 0.1s one, so a symbol volatile enough to imply less than a second is held here rather than believed to a precision the measurement does not have. ENAUSDT implies 0.56s and is clamped to this."

[reference_price_maximum_age_seconds]
value = 60.0
unit  = "seconds"
note  = "operator, 2026-08-24: the ceiling on the learned bound. At sixty seconds every symbol measured on 2026-08-23 has a 95th-percentile drift at or above the median stop distance of the 320 bounded orders this system has actually produced (0.1866%): BTCUSDT 0.172%, 1000PEPEUSDT 0.510%, ETHUSDT 0.570%. A price that old cannot place a stop at all, whatever a quiet hour's quantile says about the symbol."

[price_series_maximum_gap_seconds]
value = 120.0
unit  = "seconds between consecutive prints"
note  = "operator, 2026-08-24: how long a symbol may be silent before the series a part is judging is treated as having a hole in it, and the window is cleared rather than computed across the hole. The bus drops rather than blocks, so prints do stop and resume; to a window with no clock the first print after the hole sits beside the last one before it and the difference reads as a move that happened in an instant -- which is the shape a momentum-burst or liquidation-cascade detector exists to fire on. Measured on binance-usdm for 2026-08-23 across 57 symbols: the median symbol's 99th-percentile gap between prints is 3.0s and the worst is 42.3s (CLUSDT), while the real feed outage that day shows as a maximum gap of about 1031s on nearly every symbol at once. 120s is 2.8x the worst ordinary p99 and 8.6x inside that outage, so ordinary quiet does not clear a window and a dead connection always does. Re-measure when the captured universe changes -- an illiquid perpetual admitted to the universe can be quiet for minutes at a time, and this becomes a per-symbol threshold estimated from that symbol's own arrival rate before captured_symbol_count is raised."

[price_frame_cadence_seconds]
value = 0.25
unit  = "seconds between frames"
note  = "operator, 2026-08-24: how often price-level-sampler publishes every symbol's latest price. Decided rather than chosen: a level has to be fresher than the tightest age any symbol will believe, and that floor is reference_price_minimum_age_seconds = 1.0s. Four frames inside that floor leaves a factor of four, so a frame delayed by a tick still carries levels every reader accepts. It is also what sets the time base for momentum-burst-detector and liquidation-cascade-detector, which now measure a return per interval rather than per print -- lowering it makes their returns smaller and noisier, raising it makes them slower to see a move, and either changes what they have learned. Cheap at any plausible universe: one frame per venue is 50.1 bytes per symbol measured, so 1,295 symbols is 64,980 bytes four times a second, about 260 KB/s per venue."

[price_frame_maximum_symbols]
value = 2000
unit  = "symbols in one frame"
note  = "operator, 2026-08-24: how many symbols one frame may carry before it is split. Measured on this box 2026-08-24 by serialising real frames: 50.1 bytes per symbol, so the largest frame the bus will carry under its 131,072-byte ceiling is 2,616 symbols. 2,000 keeps 24% headroom against that measurement and still sits above the full universe on either venue -- binance-usdm listed about 1,295 perpetuals, which is 64,980 bytes -- so a real universe never splits and the split path exists for the case nobody predicted rather than for the ordinary one. A split is counted in the part's standing, so a universe that has outgrown one frame is visible rather than inferred."

[excursion_journal_move_fraction]
value = 0.002
unit  = "fraction of the last journalled extreme price"
note  = "operator, 2026-08-24: how far a position's best or worst price must move past its last journalled value before position-recorder journals the excursion again. The first guard -- skipping exact repeats -- did not hold: an extreme is set by the market's newest best print, so on a trending symbol it moves on nearly every trade, and the journal took 8.59 million peak-excursion entries (4.2 GB, 99.9% of the file, 4.4 GiB of recorder RSS) in two live days. This journal exists so a restarted spine recovers an open position's extremes; recovering a peak at most 0.2% shy of the true one is the same recovery, and the exact extremes still land in the closed-trade entry when the trade ends. 0.2% is the same move signal_label_move_fraction already defines as the smallest the system treats as real, and the per-price path remains on the tape."

[part_scope_memory_max_bytes]
value = 536870912
unit  = "bytes of memory.max per part scope"
note  = "operator, 2026-08-24: the memory ceiling on each part's own cgroup, set when the spine first placed parts in scopes. 512 MiB is roughly ten times the largest healthy part measured live that day (venue-trade-stream-reader at 53.6 MiB RSS across 57 running parts, median 33.4 MiB) and twice the reserved_memory_bytes_per_critical_part floor. Writers do not need more: with the CacheReleasingWriter discipline a 500 MB tape write peaked at 16 MB of cgroup memory (measurements/2026-08-20-part-runtime). What this ceiling is for is the failure that motivated it -- position-recorder leaked to 4.4 GiB over two unmetered days; under this cap the kernel would have killed and the supervisor restarted it within minutes, with a part-fault on the board, instead of the leak compounding silently. Raise it deliberately when a part with a genuinely larger working set (a model, a large index) joins the spine, per part if need be."

[part_scope_cpu_weight]
value = 100
unit  = "cpu.weight of each part scope"
note  = "operator, 2026-08-24: the kernel's own default weight, stated rather than inherited so the choice is on record. cpu.weight only matters under contention, and no CPU contention has yet been measured on this box (busiest steady part 0.22 of a core against twelve). Differentiating weights by part priority is deferred until hog-detector has measured real contention -- a weighting scheme chosen before the phenomenon it shapes has been observed would be a number with no provenance."

[part_scope_pids_max]
value = 64
unit  = "tasks allowed in each part scope"
note  = "operator, 2026-08-24: measured live across 57 running parts the same day: at most 5 threads in any part (median 1), with BLAS thread caps applied at the forkserver. 64 is twelve times the worst observed -- no healthy part can touch it, and a part that spawns threads without bound is stopped by the kernel instead of taking the box down."

[part_usage_reading_maximum_age_seconds]
value = 10.0
unit  = "seconds"
note  = "Claude, 2026-08-26: how old a part-resource-usage reading may be before the part it names is no longer evidence that the part is running. part-appetite-meter sweeps once a second (part_usage_cadence_seconds), so ten seconds is ten missed sweeps -- the same figure and the same reasoning as heartbeat_silent_after_seconds, which is five supervision intervals of the live spine, so a part that died reads as gone here before the supervisor has restarted it. Measured why it is needed: LatestByKey holds a key's last value forever unless bounded, so on 2026-08-26 05:11 all 214 parts the governor had switched off were still in switching-planner's 'what is running' -- sheds_still_stopping 214, sheds_confirmed_gone 0 -- and off-state-verifier had recorded 167 faults and verified 0, because the reading it checks for a released part never expired. Four parts read this bound: switching-planner, off-state-verifier, hog-detector and duty-cycle-planner; hog-detector divides fair share among the parts it believes are running, so a stale key there makes every real part look greedier than it is."

[part_usage_cadence_seconds]
value = 1.0
unit  = "seconds between part-resource-usage sweeps"
note  = "operator, 2026-08-24: how often part-appetite-meter walks every part's cgroup and publishes what each costs. Measured without it, the first hour the scopes existed: the meter is woken by part-health from 57 parts and ticked ~340 times a second, publishing a 57-message usage sweep on nearly every tick -- duty-cycle-planner lost 45,079 usage messages to that flood inside four minutes. Once a second matches part_health_interval, which is the cadence everything downstream of the metering actually renders or plans at; the tick floor is how it is enforced, so data queues rather than drops and the part stays switchable while it waits."

[switch_plan_cadence_seconds]
value = 1.0
unit  = "seconds between switch plans"
note  = "operator, 2026-08-24: how often switching-planner weighs its fourteen inputs into a plan. Measured without it: 2,802 plans in under four minutes -- thirteen a second -- of which gate-actuator lost 218 to its own receive buffer, and every plan between two metering sweeps is computed from the same numbers as the last. A plan once a second matches part_usage_cadence_seconds, since a plan more often than the metering it reads cannot say anything new."

[price_gap_patience_multiple]
value = 2.8
unit  = "multiple of a symbol's own p99 inter-print gap"
note  = "operator, 2026-08-24: written before captured_symbol_count was first raised past 30, closing the promise in price_series_maximum_gap_seconds. A window's gap bound becomes max(the 120s floor, this multiple x that symbol's own p99 gap, estimated online from the gaps the window itself has observed) -- so a liquid symbol keeps the proven floor exactly as before, and an illiquid perpetual whose ordinary quiet is minutes stops clearing its window on every pause and staying permanently blind. 2.8 carries the floor's own provenance forward: 120s was set at 2.8x the worst ordinary p99 measured on 2026-08-23 (42.3s, CLUSDT), the ratio that let ordinary quiet through while the real 1031s outage that day still cleared every window by more than a factor of eight. The estimate needs half a window of observed gaps before it takes effect, so one early pause cannot set the patience."

[spread_reversion_rearm_z]
value = 1.0
unit  = "standard deviations of the pair's own spread"
note  = "operator, 2026-08-24: how far a fired spread must come back before the pair may produce a fresh candidate. Crossing alone was not enough: measured at 100 symbols per venue, spreads wiggling across the 2.0 firing threshold re-fired 25,880 candidates in twenty-five minutes -- each one the same episode announced again. One standard deviation is the point at which the reversion the candidate predicted has substantially happened: the spread is back inside its own ordinary range, so the next stretch from there is a new opportunity rather than the tail of the old one. Must sit inside spread_reversion_z_threshold; the detector refuses it otherwise."

[book_symbols_when_thinnable]
value = 50
unit  = "symbols"
note  = """Claude, 2026-08-28: how many of a venue's symbols carry a depth-book stream where that venue resends the whole ladder on every push, so the stream can be thinned to book_snapshot_interval and lose only resolution. Fifty -- the whole universe. Measured off this machine's own tape on 2026-08-28, per symbol per day, over the same days and the same ten symbols a venue: binance-usdm 0.008 GB and bybit-linear 0.377 GB, forty-seven times apart, because binance is thinned (18,868 messages dropped to the interval) and bybit cannot be. Fifty thinnable symbols is 0.4 GB a day against total tape growth of 6.9-16.8 GB a day, so the whole universe costs less than one delta-venue symbol and a half. This replaces book_symbols_per_venue, which was one number for both venues and therefore charged every venue the worst venue's price: it held binance to ten symbols for a byte cost binance does not have, and that is why tail-crowding-detector could read a book for one of the 37 candidates it was given -- 36 of them were on symbols nothing streamed a book for, so every reading came back NOT_MEASURED and the tailgater formed no conviction at all."""

[book_symbols_when_every_message_kept]
value = 10
unit  = "symbols"
note  = """Claude, 2026-08-28: how many of a venue's symbols carry a depth-book stream where the venue sends one snapshot and then deltas, so nothing may be dropped -- a missed delta does not cost resolution, it costs the book, and every later price is wrong with nothing in the record saying so. Ten, unchanged from the operator's standing cap of 2026-08-25, and unchanged deliberately: measured at 0.377 GB/symbol/day on 2026-08-26, raising this to the 50-symbol universe would write 18.9 GB a day of book alone against 6.9-16.8 GB a day of everything else, onto a disk with 145 GB free and no retention policy -- eight days to full, and it holds the only copy of the tape. Raise it only beside a fresh figure for free disk and a decision about what gets deleted."""

[probe_rest_multiple]
value = 20.0
unit  = "multiples of the probe's own measured duration"
note  = "Claude, 2026-08-26: how many times its own measured cost a probe rests before probe-runner reruns it. Twenty, so a probe may occupy at most one twenty-first of the runner and the other twenty parts of its time are available to everything else on the machine. Paced by each probe own duration rather than by a per-probe interval, because nobody knows what a probe costs until it has run and a hand-written list of intervals goes stale silently as the probes change. Measured on the live spine at 11:16 on 2026-08-26: one sweep of fourteen probes cost 7.93 s and 7.51 s of that was trading:readiness_to_trade, which walks the whole source tree to answer which blocks have code -- an answer that changes only when somebody writes a file. Run every second, as it was, that single probe was 95% of the sweep and probe-runner was the busiest process on a twelve-core machine at 83% of a core. At twenty it reruns about every 150 s while the thirteen cheap probes, none above 0.12 s, stay effectively per-sweep. A resting probe still reports its last answer with its own measured_at_ns rather than being dropped, so staleness stays visible instead of a tile going blank (Rule 8)."

[risk_limit_maximum_age_seconds]
value = 30.0
unit  = "seconds"
note  = "Claude, 2026-08-26: how long the sizer keeps believing a limiter that has stopped speaking. It is not what withdraws a limit -- a limiter's tick is one statement and its next statement replaces it whole, told apart by the limiter's own decided_at_ns, so an all-clear withdraws a scoped zero immediately. This bound is for the other silence: a limiter that is off, wedged or crashed, whose last word would otherwise bind forever. Every limiter restates its current word on every tick, so thirty seconds is tens of missed publishes -- including drawdown-breaker and stop-frequency-breaker, which until today published only when equity arrived or a trade closed and would have expired while holding a brake on. It fails in the safe direction: binding_limit_for returns None when no limit applies to a symbol and the sizer refuses to size without one, so expiry withdraws permission rather than granting it."

[anomaly_basis_window_observations]
value = 200
unit  = "prints"
note  = "Claude, 2026-08-26: how many of a venue-symbol's own prints market-anomaly-detector learns its normal basis from. Two venues pricing one contract apart is a fact about the contract, not a broken feed: measured across 36 symbols both venues carried on the tape of 2026-08-26, 2,871,711 prints, the median cross-venue disagreement is 0.0245% while BTRUSDT sits 1.38% apart on 98.9% of its prints with nothing wrong with either feed. Comparing levels flagged 3.75% of every print in the market and halted the symbol each time; comparing the departure from the learned basis flags 0.28% at the same threshold, and BTRUSDT falls from 98.9% to 6.5%. Two hundred prints because the busiest symbols print several times a second, so the window is seconds to a minute of market -- long enough that one broken print cannot move the median, short enough that a basis which genuinely shifts is relearned rather than defended. The measurement is in measurements/2026-08-26-anomaly-disagreement/."

[anomaly_minimum_basis_observations]
value = 50
unit  = "prints"
note  = "Claude, 2026-08-26: how many prints a venue-symbol pair must have before its basis is allowed to judge anything. Below it the check reports the-basis-between-these-venues-is-not-measured-yet, which is neither an anomaly nor a clean bill: an unmeasured basis is not a reason to distrust a feed and not evidence that it is sound (Rule 8). Fifty is the count the tape measurement used to produce the 0.28% flag rate above, and a quarter of the window, so a pair starts judging well before the window is full."

[anomaly_reference_maximum_age_seconds]
value = 5.0
unit  = "seconds"
note  = "Claude, 2026-08-26: how old the cross-venue reference may be before market-anomaly-detector refuses to check against it. The detector kept each symbol's last consolidated price forever, so a fresh print could be compared against a reference from any time ago and read as a venue that moved alone -- the same immortal-level shape that made a scoped risk limit permanent on the same day. Five seconds, matching consolidated_price_maximum_quote_age: the consolidator already drops a contributor after five, so a reading older than that is built from prices the market has left twice over."

[symbol_universe_restatement_interval]
value = 30.0
unit  = "seconds"
note  = "Claude, 2026-08-26: how long a consumer that has just started waits before symbol-catalogue-reader tells it which symbols this system captures. The venue's list is re-read every symbol_catalogue_refresh_interval (900 s) and was published only then, which makes a level into an event: measured on the live spine at 14:41, four minutes after a restart, the reader had selected 104 symbols across both venues and instrument-selector had received zero symbol-universe messages, registered no listings, and refused every one of the 794 intents the arbiter formed. Thirty seconds rather than the one second level_refresh_interval_seconds uses, because this level is 104 items to 37 consumers rather than one small payload, and a consumer that has just started is already waiting on quotes, prices and a stop plan -- half a minute of it is not the bottleneck. The read interval is unchanged: this is what is said between reads, not how often the venue is asked."

[sized_order_restatement_interval]
value = 5.0
unit  = "seconds"
note  = "Claude, 2026-08-26: how long position-sizer waits before saying again what an unchanged decision should be sized at. The arbiter publishes a standing opinion on every tick -- an opinion still held is still published -- so the sizer sized the same decision on every tick and put an order request on the bus each time: measured on the live spine at 15:56, `sized` 26,402 and paper-fill-simulator holding 26,911 in flight against 12 fills, about 57 requests a second for roughly thirty standing decisions. Nothing was double-filled, because order-idempotency-stamper gives every order for one decision the same id and the simulator holds a duplicate rather than filling it -- but the whole execution path decoded, gated, stamped and routed each one first. Five seconds because a sized order is a request to act rather than a level anybody reads: the restatement exists only so a decision whose datagram was lost is expressed within five seconds instead of never, and at thirty standing decisions that is six requests a second rather than fifty-seven."
