note  = "Claude, 2026-09-06: how many instruments the three broker bridges (market-data, candle, order-book) may hold an update for while waiting for that instrument's listing to reach them. 2000 is not a guess: it is Upstox's own documented ltpc_combined_limit / full_individual_limit (runtime/brokers/upstox.py, _LIMITS_SOURCE), the most instruments one feed connection can ever be subscribed to, so a bridge holding more keys than this is holding for instruments nobody subscribed and the oldest should go. Measured cause, live spine 2026-09-06: the feed delivers its whole snapshot the instant the socket connects, while subscribed-instrument-listing-filter restates the subscribed set over a 300 s conveyor cycle, so every bridge saw its updates against an empty map -- 2,000 / 1,878 / 1,999 updates received and 0 republished by all three, with instruments_resolved at 2,000 in each by the time anyone looked. A moving market hides this because the next tick replaces what was dropped; a quiet one, and every rarely-traded contract, loses it permanently."

