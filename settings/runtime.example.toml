# ajit-segment-bots -- runtime substrate settings.
#
# Copy to ~/.config/ajit-segment-bots/settings/runtime.toml and edit there.
# This file is the template and the schema; the live values live on the machine,
# outside every repository. No API keys or secrets belong here -- see docs/secrets.md.
#
# Every entry carries value, unit and note. The note is yours: who changed it and
# why. RL-061 refuses a number that cannot say where it came from.

[writeback_interval]
value = 8388608
unit  = "bytes"
note  = "operator, 2026-08-20: a stream writer forces writeback and drops its cache every 8 MiB. Measured on ext4 under MemoryMax=200M: never fsyncing is OOM-killed, fsync alone survives pinned at the 200 MB ceiling, fsync plus FADV_DONTNEED holds the same 500 MB write at a 16 MB peak."

[placement_confirmation_deadline]
value = 0.5
unit  = "seconds"
note  = "operator, 2026-08-20: how long gate-actuator waits for a placed PID to appear in its scope before calling it a fault. Placement measured at a 5.7 ms median and 6.9 ms p95 over 87 of 88 successes, so this is roughly 70x the p95."

[placement_confirmation_poll_interval]
value = 0.002
unit  = "seconds"
note  = "operator, 2026-08-20: how often to re-read /proc/<pid>/cgroup while waiting. Below the 5.7 ms median so a normal placement is confirmed on the second or third look."

[store_busy_timeout]
value = 5.0
unit  = "seconds"
note  = "operator, 2026-08-20: SQLite WAL permits one writer per file. Measured with this unset a second writer fails instantly with 'database is locked'; set, it waits 2.54 s and succeeds. Parts must never carry their own retry loop for this."

[fork_thread_ceiling]
value = 1
unit  = "kernel threads"
note  = "operator, 2026-08-20: the forkserver refuses to fork above this, read from field 20 of /proc/self/stat. Measured: with the BLAS caps unset, import numpy alone puts 12 kernel threads in the process while threading.active_count() still reports 1."

[part_health_interval]
value = 1.0
unit  = "seconds"
note  = "operator, 2026-08-20: how often a part emits part-health while on. Intraday bars at 1m/5m/15m/30m need about one message a second, so this matches the slowest thing worth noticing."

[settings_recheck_interval]
value = 5.0
unit  = "seconds"
note  = "operator, 2026-08-21: SettingsDirectoryWatch's periodic backstop -- it re-reads the whole settings directory on this cadence regardless of what any inotify event announced. Measured directly: watchdog==6.0.0's own C shim discards the kernel's IN_Q_OVERFLOW marker (wd == -1) before it ever reaches a handler, so nothing built on it can react to a real, reproduced overflow (a raw 49152-event burst against this box's max_queued_events=16384 produced one). This periodic re-read is the actual guarantee instead, and the cost of getting this number wrong is exactly the worst-case staleness of an operator's capital-bound edit sitting unreported: too high risks the board showing a stale main_balance or leverage_ceiling for that long; too low is still cheap, since parsing a 6-entry settings file measured at roughly 225 microseconds, so even this cadence is negligible CPU."

# --- Market data feed (phase 1, spec section 4.3) -----------------------------
# These nine are the block's own numbers. Venue capacity figures are NOT here --
# the operator does not decide that Binance allows 1024 streams per connection,
# so those are declared as VenueFacts inside each adapter, carrying the document
# they were read from. What is here is what the operator actually chooses.

[captured_venues]
value = ["binance-usdm", "bybit-linear"]
unit  = "venue ids"
note  = "operator, 2026-08-22: which venue adapters are live. A venue id resolves to runtime/venues/<id with underscores>.py, so adding a third venue is this line plus that module and nothing else -- the user's condition of 2026-08-21, 'mark it so if the 2 are not enough we can add more later'. binance-usdm and bybit-linear turned on 2026-08-22 as their adapters landed. An id named here with no module is refused loudly by adapter_registry rather than skipped quietly."

[captured_symbol_count]
value = 30
unit  = "symbols per venue"
note  = "operator, 2026-08-23: how many symbols to capture per venue, ordered by symbol_selection_metric. Stepped 30 -> 100 at 08:0x as step 1 of the measured walk towards the full universe (RL-009), and stepped back to 30 at 10:3x because the measurement came back negative: at 100 per venue the decision half cannot keep up. Measured on the live run of 2026-08-23 10:25:15 -- a trade was decided at an ENAUSDT price of 0.17019, which was the real market at 09:29:08. Fifty-six minutes stale. Each part keeps a per-symbol price level that only updates when a market-data message for that symbol reaches it, so under input loss a symbol can freeze for the better part of an hour while the part still looks busy. The fill simulator stayed current, so every such trade was decided at an hour-old price and filled at the real one, and its exits fired on arrival. What the walk costs is exactly this, and it is why it is walked rather than jumped: the next step is 50, taken only once decision staleness is probed and holding at 30."

[symbol_selection_metric]
value = "quote-volume-24h"
unit  = "metric name"
note  = "operator, 2026-08-22: how 'top N' is ordered when captured_symbol_count is not 0. 24-hour quote volume is the venue's own field and is comparable across the two venues because both quote in USDT. Getting this wrong costs capture of the wrong symbols for as long as it stands, and that capture cannot be recovered later."

[symbol_catalogue_refresh_interval]
value = 900.0
unit  = "seconds"
note  = "operator, 2026-08-22: how often each venue's symbol list is re-read. Not measured against a listing rate -- what is measured is that the count moved while it was being measured: Binance USDⓈ-M reported 169 TRADIFI perpetuals on one call and 170 minutes later on the next, 2026-08-21. So the cost of this being too high is a new listing uncaptured for up to that long, and the cost of it being too low is REST weight against a 2400-per-minute budget for a call that costs 1. Lower it if a listing gap is ever observed."

[book_depth_levels]
value = 20
unit  = "levels per side"
note  = "operator, 2026-08-22: how deep the shallow book snapshot goes. The venues do not offer the same levels -- Binance USDⓈ-M's partial-depth streams are 5/10/20 and Bybit linear's are 1/50/200/1000 -- so the adapter picks its own nearest supported level at or above this and records which it actually got. 20 is Binance's deepest partial stream, which makes this the deepest value both venues can serve without the adapters disagreeing about what 'shallow' means. Deeper couples to push rate on Bybit: choosing depth chooses cadence."

[book_snapshot_interval]
value = 5.0
unit  = "seconds"
note  = "operator, 2026-08-22: how often a book snapshot is written to the tape, as distinct from how often the venue pushes an update. The tape carries snapshots rather than every delta because a delta stream is only meaningful alongside the snapshot it was applied to, and spec section 6 has to be able to record that a resync happened. Too high loses book resolution permanently; too low costs tape volume against 238 GB free and 2-4 GB/day."

[venue_reconnect_backoff_floor]
value = 1.0
unit  = "seconds"
note  = "operator, 2026-08-22: the shortest wait before a reconnect, doubled from here on repeat failure. Bybit allows 500 new connections per IP per rolling 5 minutes, which is 1.67 per second across every connection this box holds, so a floor below this turns one venue outage into a self-inflicted ban. Binance's 24-hour forced disconnect is routine and is not a failure, so it does not enter the backoff at all."

[feed_gap_threshold]
value = 60.0
unit  = "seconds"
note  = "operator, 2026-08-22: how long a symbol may be silent before the silence is a feed-gap. This is the detector for spec section 1.1's live hazard -- a Binance connection missing its routed path stays open, errors nothing, and delivers nothing -- so it must be short enough to catch an empty socket. 60 s is safe at 30 symbols chosen by volume, where a genuinely silent minute is rare. It is NOT safe at the full universe: an illiquid perpetual is quiet for minutes at a time, and this becomes a per-symbol threshold estimated from that symbol's own arrival rate before captured_symbol_count is raised. Recorded here rather than discovered as a flood of false gaps."

[tape_root]
value = "~/.local/share/ajit-segment-bots/tape"
unit  = "path"
note  = "operator, 2026-08-22: where the tape lives. Expanded by the part that reads it, and then put through storage_facts.require_durable_directory, which refuses a memory-backed filesystem -- /tmp is tmpfs on this box, so a tape written there would measure as working right up until the machine restarted and it was gone. 238 GB free on / against 2-4 GB/day is months of runway."

[venue_reconnect_backoff_ceiling]
value = 60.0
unit  = "seconds"
note  = "operator, 2026-08-22: the longest a reader waits before retrying, doubling up from venue_reconnect_backoff_floor. Not in spec section 4.3, which named only the floor -- added because an unbounded doubling is a connection that has silently stopped trying, and after six failures the floor of 1 s is already 32 s. 60 s is one minute of tape lost per symbol in the worst case of a venue that comes back the instant after a retry, against Bybit's 500-connections-per-5-minutes which is what the floor protects. Lower it and a long outage costs connection budget; raise it and a short outage costs capture that cannot be recovered."

[stream_drain_interval]
value = 0.5
unit  = "seconds"
note  = "operator, 2026-08-22: how long a stream reader blocks on its socket in one tick. With part_health_interval this bounds how long the governor waits for an off to take effect -- run_part checks the control channel before each tick, so the worst case is one of each. 0.5 s keeps that under two seconds while still letting a busy symbol deliver a whole batch per tick: BTCUSDT aggTrade measured about 4 messages a second on 2026-08-22, and Bybit's 50-level book pushes every 20 ms, so a shorter interval would cost syscalls without capturing anything sooner."

[open_file_headroom]
value = 128
unit  = "file descriptors"
note  = "operator, 2026-08-22: how many descriptors stream-budget-planner leaves unclaimed below the process soft limit. A part needs more than its tapes and sockets: the settings file, the health log, the interpreter's own handles, and whatever a reconnect holds briefly while the old socket is closing. Measured on this box 2026-08-22: RLIMIT_NOFILE soft is 524288 -- NOT the 1024 spec section 4.2 assumed -- and a live 30-symbol capture holds 68 descriptors. So the descriptor ceiling is not what blocks the full-universe path here; at 1,295 symbols it would need 2,590 tape files, which this limit carries easily. The planner still checks, because the limit is a property of however the process was started and a smaller one elsewhere must be a refusal at planning time rather than a tape that stopped opening partway through the alphabet."

[inbox_receive_buffer_bytes]
value = 212992
unit  = "bytes"
note  = "operator, 2026-08-22: SO_RCVBUF on a part's inbox -- how far behind a consumer may fall before it starts losing messages. Measured on this box: the kernel's own default of 212992 accepts 167 messages of 222 bytes, and 278 of 160 bytes, before sending returns EAGAIN in 1.5 us. Raising it buys a longer stall before loss and costs kernel memory per inbox; there is no value at which a permanently stalled consumer stops losing data, which is why this is a buffer and not a queue (RL-066)."

[maximum_message_bytes]
value = 131072
unit  = "bytes"
note  = "operator, 2026-08-22: the largest frame the bus carries. Measured: a default AF_UNIX SOCK_DGRAM pair delivers a single datagram of 131072 bytes intact and refuses more; buffers grown to 8 MiB carry 4 MiB. Held at the default because a payload above it belongs in a state store with a reference published in its place, and a ceiling that fits one large message is a ceiling every inbox then reserves for."

[part_tick_floor]
value = 0.005
unit  = "seconds"
note  = "operator, 2026-08-22: the fastest a part may be woken by arriving data, so an unbounded producer cannot spin a consumer. Measured: waiting on 20 inputs and reading one costs 4.9 us, and the tape is recording 285.3 messages a second across 62 symbols -- about 3.5 ms apart -- so a 5 ms floor batches a busy stream while adding at most 5 ms of latency to a decision. It is held on the control socket alone, so a part waiting out its floor is still switchable."

[off_state_verify_delay]
value = 12.0
unit  = "seconds"
note  = "operator, 2026-08-22: how long after a part's process exits its memory is checked before calling the release complete (T-3). Measured with all 321 parts switched off at once: 942 MB of 1988 MB had returned after 2 seconds and all of it after 12. A verifier reading once and immediately reports a leak that is not there."

[part_stop_deadline]
value = 10.0
unit  = "seconds"
note  = "operator, 2026-08-22: how long the launcher waits for a part to exit after sending it off, before killing it. Measured: all 321 parts switched off together in 0.11 s with none refusing, so this is roughly ninety times the whole system's stop time. A part that needs the kill is a finding -- T-3 says off is the process exiting, and a part that ignored its switch is one the governor could not switch."

[switch_request_timeout]
value = 30.0
unit  = "seconds"
note  = "operator, 2026-08-22: how long gate-actuator waits for the launcher to answer a switch request. Covers the worst honest case -- a stop that runs the full part_stop_deadline of 10 s and then a kill and a second wait -- with room over. Measured for comparison: a switch on is 8.4 ms end to end (2.78 ms to fork, 5.6 ms to place), so a request that takes seconds is already a fault being reported rather than a switch being made."

[memory_exhaustion_warning]
value = 60.0
unit  = "seconds"
note  = "operator, 2026-08-22: how close to memory exhaustion the forecast must come before switching-planner starts turning parts off. This box has no swap, so exhaustion is an OOM kill rather than a slowdown. Measured: switching all 321 parts off takes 0.11 s and the memory is fully back within 12 s, so 60 s leaves five times the worst observed release time plus a full part_health_interval to see whether it worked."

[io_stall_fraction]
value = 0.2
unit  = "fraction of wall time"
note  = "operator, 2026-08-22: the share of recent wall time spent stalled on IO above which switching-planner treats the machine as IO-bound. Judgement, not measurement -- this box has never been under real IO contention, and the number to fit is the pressure at which the tape starts losing messages. Revisit against io-pressure-meter's own readings once contention exists; until then it is deliberately a fifth of the time rather than a value implied to be measured."

[released_memory_bytes]
value = 1048576
unit  = "bytes"
note  = "operator, 2026-08-22: how much memory a switched-off part may still be charged with before off-state-verifier calls it a fault. Measured: an idle part is 5.46 MB PSS, and a part that has genuinely gone leaves no scope at all, so a cgroup still holding a megabyte after its process exited is holding something rather than rounding noise."

[released_cpu_seconds_per_second]
value = 0.01
unit  = "CPU seconds per second"
note  = "operator, 2026-08-22: how much CPU a switched-off part may still appear to use before off-state-verifier calls it a fault. A process that exited uses none; this is 1% of one core, which at the 1 s part_health_interval sampling window is 10 ms of CPU time against cpu.stat's microsecond resolution -- comfortably distinguishable from zero and well below any real work."

[catalogue_request_timeout]
value = 30.0
unit  = "seconds"
note  = "operator, 2026-08-22: how long symbol-catalogue-reader waits on a venue's REST catalogue or ticker before treating the request as failed. Not a venue limit -- it is how long this system is willing to sit in a syscall before saying so. Both venues answer their catalogue in well under a second in practice, and a failed read keeps the previous selection rather than dropping to an empty one, so a generous timeout costs a delayed refresh rather than lost capture."

[candle_interval]
value = "1m"
unit  = "venue candle interval"
note  = "operator, 2026-08-22: which candle a stream plan reserves capacity for, and which one ccxt-venue-reader reads. One minute is the finest bar both venues serve and the base RL-043's 1m/5m/15m/30m ladder is aggregated from -- a coarser base cannot be refined later, while a finer one is capacity spent on a resolution the tape already holds as trades."

[regime_window_length]
value = 1024
unit  = "trades"
note  = "operator, 2026-08-22: how many trade prices regime-classifier keeps per symbol for its Hurst estimate. Measured on 60000 real trades from four symbols: the estimator's standard deviation falls from 0.26 at a 64-trade window to 0.046-0.139 at 1024, and barely improves at 2048 while doubling the market time a window spans. 1024 trades is 1.2-6.8 seconds on the busiest symbols. Full table in measurements/2026-08-22-vertical-numbers/README.md."

[regime_minimum_observations]
value = 1024
unit  = "trades"
note  = "operator, 2026-08-22: the fewest prices regime-classifier will estimate on -- set equal to the window, so it classifies only on a full one. Measured: below 512 trades the estimator's spread is wider than the distance from a random walk to either regime, so a shorter minimum produces a classifier that flips between trending and reverting on the same market. A symbol that has just started therefore reads 'unclassified', which is a real state rather than a guess."

[regime_trending_hurst_above]
value = 0.6
unit  = "Hurst exponent"
note  = "operator, 2026-08-22: above this the series is called trending. Measured at the 1024-trade window on four symbols: the median Hurst is 0.48-0.52 -- this market really is close to a random walk at these timescales -- and 0.60 is about the 95th percentile of the two least noisy symbols. So roughly one window in ten classifies on a calm symbol and fewer on a noisy one, which is the right direction: a noisier estimate should classify less often, not more."

[regime_reverting_hurst_below]
value = 0.4
unit  = "Hurst exponent"
note  = "operator, 2026-08-22: below this the series is called reverting. The mirror of regime_trending_hurst_above, and about the 5th percentile of the same measured distribution (q05 was 0.38-0.47 at the 1024-trade window). Both thresholds must sit either side of 0.5 and the classifier refuses at construction if they do not."

[cointegration_window_length]
value = 256
unit  = "observations"
note  = "operator, 2026-08-22: how many prices per symbol cointegration-pair-finder keeps for its spread test. Measured on 320000 real trades per venue: the spread's reversion per step is three to five times stronger at 256 than at 1024 (median 0.066 against 0.017 on binance-usdm, 0.050 against 0.009 on bybit-linear), and a longer window also delays the first candidate. Full table in measurements/2026-08-22-vertical-numbers/README.md."

[cointegration_minimum_observations]
value = 256
unit  = "observations"
note  = "operator, 2026-08-22: the fewest observations of each symbol before a pair is judged at all -- set equal to the window, so a pair is judged on a full one. Below it the finder reports too-few-observations, which is a state rather than a guess."

[cointegration_minimum_correlation]
value = 0.5
unit  = "absolute Pearson correlation"
note  = "operator, 2026-08-22: how related two symbols must be before their spread is worth testing. Measured at the 256 window: this is about the median pair on bybit-linear (q50 0.56) and the top quartile on binance-usdm (q75 0.50), so it is selective without being empty. Two prices sharing at least a quarter of their variance is the floor for calling the difference between them a spread."

[cointegration_minimum_reversion_strength]
value = 0.05
unit  = "fraction of deviation pulled back per step"
note  = "operator, 2026-08-22: how strongly a spread must pull back before the pair is called cointegrated rather than merely correlated. Measured at the 256 window: about the median on both venues (0.066 binance-usdm, 0.050 bybit-linear), so roughly half the pairs clear it and about a quarter clear it together with the correlation floor. Correlated-and-drifting is the classic way to lose money on pairs, which is why this test exists separately from the correlation one."

[cointegration_pairs_tested_per_tick]
value = 64
unit  = "pairs"
note  = "operator, 2026-08-22: how many symbol pairs the finder tests on one tick. Pairs grow as the square of symbols -- the 30 captured symbols per venue are 435 pairs -- and each test is a linear fit over the window. This bounds the work per tick so the part stays switchable (T-2); pairs are tested in rotation, so every pair is still reached, just not all in one tick."

[signal_prior_hit_rate]
value = 0.5
unit  = "fraction"
note  = "operator, 2026-08-22: what a detector's hit rate is assumed to be before it has been right or wrong even once. Half is the only honest prior: a detector with no history is not known to be better than chance, and any other value would be a claim about a detector nobody has measured. This is a prior, not a floor -- it is displaced by real outcomes as they arrive (RL-060)."

[signal_prior_weight]
value = 20.0
unit  = "pseudo-observations"
note  = "operator, 2026-08-22: how much evidence the prior is worth, in observations. Twenty means twenty real outcomes move the estimate halfway from the prior to what was actually observed, so a detector that is right thirty times in a row is believed rather than held back by an assumption. Small enough to be displaced quickly, large enough that three lucky calls do not read as a 100% hit rate."

[signal_half_life_observations]
value = 500.0
unit  = "observations"
note  = "operator, 2026-08-22: how quickly a detector's older outcomes stop counting. A market regime does not last forever and neither does a detector's edge in it, so evidence decays: after 500 outcomes an observation counts half as much as a fresh one. Paired with the per-regime split in SignalCalibrator, this is what stops a detector's record in a trending market from vouching for it in a choppy one."

[signal_minimum_observations]
value = 30
unit  = "observations"
note  = "operator, 2026-08-22: how many outcomes a detector needs before its measured hit rate is reported as measured rather than as an estimate resting on the prior. Below it the confidence carries that it is unproven, which is what stops an untested detector's first three correct calls from being read as an edge."

[spread_reversion_window_length]
value = 256
unit  = "observations"
note  = "operator, 2026-08-22: how many spread observations spread-reversion-detector keeps per pair before judging how stretched the current one is. Matched to cointegration_window_length deliberately: the spread being measured here is the one the finder judged cointegrated over that same span, and a detector measuring a different window would be judging a different spread from the one that was tested."

[spread_reversion_minimum_observations]
value = 256
unit  = "observations"
note  = "operator, 2026-08-22: the fewest spread observations before a z-score is computed -- a full window, as with the pair test. A z-score on a handful of points is a number with an error bar wider than the signal."

[spread_reversion_z_threshold]
value = 2.0
unit  = "standard deviations"
note  = "operator, 2026-08-22: how far the spread must be from its own mean before a candidate is raised. Judgement anchored to a measurement rather than measured directly: under a normal distribution two standard deviations is the outer 5%, and crypto spreads are fat-tailed, so this will fire more often than that -- which is the direction to prefer for a first run that needs candidates to exist at all. What would settle it is the realised reversion rate per z-bucket once trades have outcomes; until then the calibrator learns the hit rate rather than this number being tuned."

[spread_reversion_horizon]
value = 60.0
unit  = "seconds"
note  = "operator, 2026-08-22: how long the expected reversion is given to happen before the detector's call is scored. Anchored to measurement: the spread pulls back about 0.05 of its deviation per observation (median at the 256 window on both venues), so the half-life is roughly 14 observations -- 0.07 s on a symbol printing 200 trades a second, 14 s on one printing one. Sixty seconds covers that range with room, and a horizon that expired before the reversion could occur would train the calibrator against a detector that was right."

[bull_default_setup_weight]
value = 1.0
unit  = "weight"
note  = "operator, 2026-08-22: the weight the bull bot gives a detector it has no record of yet. One means an unproven detector's signal is taken at face value and neither favoured nor discounted, which is the only honest starting point -- the weight is then learned from what that detector's calls actually did (RL-060), and bull-setup-weight-learner is what moves it."

[bull_minimum_setup_weight]
value = 0.1
unit  = "weight"
note  = "operator, 2026-08-22: the floor a detector's learned weight cannot fall below, so a detector that has been wrong lately is discounted rather than silenced. Zero would be a detector that can never recover, because a weight of zero stops its candidates being seen and so stops any evidence that it has improved from ever arriving."

[bull_minimum_weighted_strength]
value = 0.5
unit  = "weighted signal strength"
note  = "operator, 2026-08-22: how strong a candidate must be after its detector's weight is applied before the bull bot works on it at all. At the default weight of 1.0 this admits any candidate of half strength or more. Judgement, and the thing that would settle it is the realised hit rate by weighted-strength bucket once trades have outcomes -- deliberately permissive for a first run, because a filter tuned before there is any outcome data is tuned against nothing."

[bull_feature_short_window]
value = 64
unit  = "observations"
note  = "operator, 2026-08-22: the shorter of the two price windows whose ratio tells the bull bot whether volatility is rising. Measured: at 202-883 trades a second on the busiest symbols, 64 trades is a third of a second of market on Binance aggregates and under a tenth on Bybit prints -- fast enough to be a current reading rather than a memory."

[bull_feature_long_window]
value = 512
unit  = "observations"
note  = "operator, 2026-08-22: the longer window in that ratio, eight times the short one. The ratio is what carries information, so the gap between them matters more than either: eight-to-one means a burst has to persist across roughly an order of magnitude of market time to move it, rather than every fast tick registering as a regime change. Must be longer than the short window; the builder refuses at construction if it is not."

[bull_feature_minimum_observations]
value = 64
unit  = "observations"
note  = "operator, 2026-08-22: the fewest prices before a feature is computed at all. Set to the short window, so a feature is either measured over a full window or reported as missing -- and the composer counts missing features rather than substituting zeros, which is what stops a symbol nobody has watched from looking like a symbol with nothing happening."

[bull_reference_order_size_quote]
value = 1000.0
unit  = "USDT"
note  = "operator, 2026-08-22: the order size the bull bot measures book impact against. Measured on 20000 real trades per symbol across twelve symbols: the median trade is 166 USDT on binance-usdm (100 ms aggregates) and 55 USDT on bybit-linear (single prints), with the 95th percentile near 20000 USDT on BTCUSDT. A thousand sits above the median trade -- so impact is a real question rather than noise -- and well below the size at which the biggest symbols start to move."

[bull_outlier_deviation_threshold]
value = 4.0
unit  = "robust standard deviations"
note  = "operator, 2026-08-22: how far from its own history a feature must sit before the vector is flagged as out of distribution. Four rather than the conventional three: crypto features are fat-tailed, and the cost of a false flag is a trade not taken while the cost of a missed one is a model asked to judge a market it has never seen. Judgement -- what would settle it is the model's realised error rate on flagged against unflagged vectors."

[bull_outlier_minimum_observations]
value = 200
unit  = "observations"
note  = "operator, 2026-08-22: how many vectors must be seen before the rejector claims to know what normal looks like. Below it every judgement reads as unjudgeable, which is a state rather than a pass -- a distribution estimated from a handful of points would flag whatever happened to differ from a small sample."

[bull_outlier_half_life_observations]
value = 2000.0
unit  = "observations"
note  = "operator, 2026-08-22: how quickly the rejector forgets old feature values. What counts as normal in this market changes, and a distribution built from a week ago would flag today's ordinary conditions. Ten times the minimum observation count, so the estimate is never dominated by the newest handful."

[bull_outlier_maximum_unjudgeable_fraction]
value = 0.5
unit  = "fraction of features"
note  = "operator, 2026-08-22: how much of a vector may be unjudgeable before the whole vector is called unjudgeable rather than clean. Half: a verdict resting on a minority of the features is a verdict about a different vector than the one presented, and reporting it as clean would be the exact failure Rule 8 exists to prevent."

[bull_learning_rate]
value = 0.01
unit  = "step size"
note  = "operator, 2026-08-22: how far the bull conviction model moves its weights per training observation. Small, because the label arrives long after the prediction and a large step turns one late outcome into a new model. Judgement anchored on the online-learning convention of a rate well below one over the feature count; what would settle it is the model's out-of-sample error against a sweep, which needs closed trades that do not exist yet."

[bull_l2_regularisation]
value = 0.0001
unit  = "penalty coefficient"
note  = "operator, 2026-08-22: how strongly the model is pulled back towards small weights. Nonzero so that a feature which happens to line up with a handful of early outcomes cannot dominate; small enough that it does not erase a real relationship. Judgement, to be replaced by a value chosen on held-out data once there is held-out data."

[bull_feature_half_life_observations]
value = 5000.0
unit  = "observations"
note  = "operator, 2026-08-22: how quickly the model's per-feature normalisation forgets older values. Longer than the rejector's 2000 deliberately: the rejector asks whether this vector is strange right now, the model asks what scale a feature usually has, and a scale that moved as fast as the strangeness test would make the model's inputs jump for reasons the market did not."

[bull_minimum_feature_observations]
value = 200
unit  = "observations"
note  = "operator, 2026-08-22: how many values of a feature are needed before the model will normalise it. Below it the feature is reported as unavailable rather than scaled by a mean and deviation estimated from almost nothing."

[bull_minimum_training_observations]
value = 100
unit  = "labelled observations"
note  = "operator, 2026-08-22: how many labelled outcomes of each class the model needs before it reports itself fitted. Below it the model returns its prior and says so, and with bull_opinion_require_trained_model set the composer forms no opinion at all -- which is the honest state for a model that has never been trained. Both classes, not just enough rows: a model trained on 500 rights and no wrongs has learned that everything works."

[bull_default_sample_weight]
value = 1.0
unit  = "weight"
note  = "operator, 2026-08-22: what one training observation counts for when nothing has said otherwise. One, so that a weight is a deliberate departure rather than a scale nobody chose."

[bull_maximum_sample_weight]
value = 10.0
unit  = "weight"
note  = "operator, 2026-08-22: the most any single observation may count for. Ten times the default: a bounded ceiling means an upstream part that miscomputed a weight can distort training but cannot replace it, which is the difference between a bad batch and a destroyed model."

[bull_calibration_bin_count]
value = 10
unit  = "bins"
note  = "operator, 2026-08-22: how many buckets the calibrator splits raw conviction into when comparing claimed confidence against realised hit rate. Ten gives each bin a tenth of the range; fewer would hide miscalibration inside a wide bin, more would leave each bin with too few outcomes to estimate from at the volumes a first run produces."

[bull_calibration_minimum_observations]
value = 50
unit  = "observations per bin"
note  = "operator, 2026-08-22: how many outcomes a bin needs before its correction is applied rather than reported as unmeasured. Fifty is where a hit rate's standard error falls to about seven percentage points, which is finer than the bin width the ten-bin split gives."

[bull_calibration_half_life_observations]
value = 1000.0
unit  = "observations"
note  = "operator, 2026-08-22: how quickly the calibrator forgets old outcomes. A model that has been retrained is a different model, and its old calibration describes a predictor that no longer exists."

[bull_conviction_margin_over_break_even]
value = 0.0
unit  = "probability"
note  = "operator, 2026-08-23: how far above its plan's break-even probability the bull bot's conviction must be before the bot will time an entry or form an opinion. The break-even itself is arithmetic from the plan -- (1 + fees in units of risk) / (1 + reward to risk), runtime/edge_arithmetic.py -- and replaces the 0.55 literal that stood in bull_entry_minimum_conviction and bull_opinion_minimum_conviction. That literal was set before the model had seen an outcome; measured on the live run of 2026-08-23 the model's output never left 0.44-0.50, so it refused 325 of 327 intents, and the learning loop behind a closed trade never ran. Zero margin on paper, by RL-005: paper is the unrestricted experiment, a trade worth exactly nothing on average is the boundary of what is worth learning from, and the size expresses how much edge there is. What would settle a non-zero margin is realised expectancy per conviction bucket, which needs closed trades."

[bull_entry_window_length]
value = 256
unit  = "observations"
note  = "operator, 2026-08-22: how many prices the entry timer keeps to judge whether the current one is extended. Matched to the pair test's window so the timer is judging the same stretch of market the candidate came from."

[bull_entry_minimum_observations]
value = 256
unit  = "observations"
note  = "operator, 2026-08-22: a full window before the timer judges extension, for the same reason every other estimator here requires one -- a quantile over a handful of points is not a quantile."

[bull_entry_trigger_validity]
value = 60.0
unit  = "seconds"
note  = "operator, 2026-08-22: how long an entry trigger stays valid before it is discarded. Matched to spread_reversion_horizon: the trigger exists to act on a candidate whose expected move has that horizon, and a trigger outliving the move it was raised for is an order placed on a reason that has expired."

[bull_entry_maximum_extension_quantile]
value = 0.8
unit  = "quantile"
note  = "operator, 2026-08-22: how extended a price may be, within its own recent range, and still be entered. Above the 80th percentile the bull bot waits: buying the top of the observed range is where a reversion setup turns into a momentum bet nobody intended."

[bull_entry_quality_window]
value = 200
unit  = "entries"
note  = "operator, 2026-08-22: how many past entries the timer scores itself over when learning what its fills actually cost. Two hundred is enough for a stable mean cost while still reflecting current conditions."

[bull_entry_prior_extension_cap]
value = 0.8
unit  = "quantile"
note  = "operator, 2026-08-22: the extension cap the timer uses before it has measured any entries of its own -- the same as the configured cap, so an untrained timer behaves as configured rather than more permissively. It is a prior, displaced as entry quality accrues (RL-060)."

[bull_entry_prior_entry_cost_fraction]
value = 0.0005
unit  = "fraction of price"
note  = "operator, 2026-08-22: what the timer assumes an entry costs in slippage before it has measured its own fills -- five basis points. Anchored to the taker fee it will also pay, so the assumed all-in cost of entering is roughly twice the fee rather than zero. A prior of zero would have the timer believe entering is free, which is the assumption that makes a marginal edge look tradeable."

[bull_exit_stop_safety_multiple]
value = 2.0
unit  = "multiples of recent deviation"
note  = "operator, 2026-08-22: how far beyond the symbol's own recent deviation a stop is placed. Two, so ordinary noise does not take the position out: a stop inside one deviation is hit by the market doing nothing unusual, which converts volatility into realised loss."

[bull_exit_target_quantiles]
value = [0.5, 0.75, 0.9]
unit  = "quantiles of the observed excursion distribution"
note  = "operator, 2026-08-22: where profit targets are placed, as quantiles of how far this symbol's moves have actually run. Three targets rather than one, because the distribution has a long right tail and a single target either leaves it all on the table or waits for a move most trades never make. Quantiles rather than fixed percentages so the plan adapts per symbol without anyone tuning it. Paired position-by-position with bull_exit_target_fractions, and the proposer refuses a plan whose fractions do not close the whole position."

[bull_exit_target_fractions]
value = [0.4, 0.4, 0.2]
unit  = "fraction of the position"
note  = "operator, 2026-08-22: how much of the position each target takes, in the same order as bull_exit_target_quantiles. Front-loaded: most of the position is taken at the two nearer targets and a fifth is left to run to the 90th percentile, because the far target is by construction reached least often. They must sum to one -- a plan whose fractions leave a remainder is a plan holding a position nobody decided to hold, and the proposer refuses it at construction."

[bull_exit_minimum_reward_to_risk]
value = 1.5
unit  = "ratio"
note  = "operator, 2026-08-22: the least a plan's first target may pay relative to what the stop risks, before the trade is refused as not worth taking. Judgement: at 1.5 a bot right half the time is profitable before costs, which is the minimum bar for a plan whose hit rate has never been measured. What would settle it is the realised distribution of reward to risk once trades close."

[bull_exit_conviction_horizon_multiple]
value = 2.0
unit  = "multiples of the candidate horizon"
note  = "operator, 2026-08-22: how much longer than the detector's own horizon a high-conviction position is given to work. The detector says the move should happen within its horizon; conviction is a statement about whether it will, not about when, so a strong opinion earns patience rather than a wider stop."

[bull_opinion_maximum_missing_features]
value = 7
unit  = "features"
note  = "operator, 2026-08-23: how many features may be missing from a vector before the composer refuses to form an opinion on it. Set from the model rather than from judgement: bull-conviction-model has trained on 1,408 outcomes using exactly five features -- detector_strength, price_z_score, realised_volatility_fraction, return_over_window and setup_weight -- and those five are precisely the ones this spine can build. Measured on 3,000 real ZECUSDT prints on 2026-08-23: 6 of the 12 are unavailable with a calibrated detector and 7 before it calibrates. Three need order-book-snapshot and order-book-reader has no start_part; funding_rate and funding_forecast_change both need funding-forecast and funding-rate-forecaster is not started; volatility_ratio_short_to_long needs a short-window volatility the 64-observation window does not yet yield. Seven, so the bot may act on the features its model was actually trained on. Demanding the other seven is demanding features no decision has ever used. Missing is still named, never defaulted. Every producer that comes on lowers the real count and this ceiling comes down with it -- and the gate that would replace this number outright is one that refuses when a feature the model was trained on is missing, rather than counting features it never saw."

[bull_opinion_require_trained_model]
value = true
unit  = "true or false"
note  = "operator, 2026-08-22, re-aimed 2026-08-23: whether the composer refuses a conviction from a model that has never been trained. True, and the intent is unchanged from the day it was written -- the alternative is a bot whose first trades come from a model that has never seen an outcome, which RL-060 exists to prevent. What changed is what it tests. It read conviction.is_measured, which is whether the *calibration* has been fitted, and calibration needs a bot-scorecard, which needs trade episodes, which need trades: a gate that demanded a measurement trading itself has to produce. Measured on the live run of 2026-08-23 07:48-08:09: 653 opinions formed, 653 refused, and no amount of waiting would have changed it. It now tests whether the model is fitted -- bull_minimum_training_observations labelled outcomes of each class -- which is what the original note meant by 'has never seen an outcome'. The calibration still applies the moment it fits; it is no longer a precondition for the first trade."

[signal_label_move_fraction]
value = 0.002
unit  = "fraction of price"
note  = "operator, 2026-08-22: how far price must move for signal-outcome-labeller to call a detector's claim right, or wrong if it moves that far the other way first. Twenty basis points, which is roughly twice the round trip in taker fees on both venues (5 bp a side on binance-usdm, 5.5 bp on bybit-linear at the base tier). A move smaller than the cost of capturing it is not a move worth predicting, so labelling it as a hit would teach the model that unprofitable signals are correct."

[signal_label_maximum_open_claims]
value = 5000
unit  = "claims"
note  = "operator, 2026-08-22: how many unresolved claims the labeller holds at once, above which new candidates are refused and counted rather than silently dropped. Each claim is a small record and the bound exists so a detector firing on every tick cannot grow this part's memory without limit -- the governor bounds the process, and this bounds what the process would ask for."

[bull_remembered_vectors_per_symbol]
value = 64
unit  = "feature vectors"
note  = "operator, 2026-08-22: how many recent feature vectors the bull conviction model keeps per symbol so a label arriving a horizon later can be matched to the vector that was current when the claim was made. Sixty-four covers a 60-second horizon comfortably -- the filter accepts at most one candidate per detector per symbol at a time, so vectors accrue at the rate candidates do, not at the rate trades do. It is a bound on a process's memory: an unbounded history of vectors is a leak with a good excuse."

[publisher_absent_recheck_interval]
value = 5.0
unit  = "seconds"
note  = "operator, 2026-08-22: how long a producer leaves an inbox alone after finding nobody bound to it, before trying again. Measured on the first live run: 59 of market-data's 66 consumers were off, so 89% of every publish was a syscall to nobody -- and the sends that mattered were being refused against a full buffer while that work was being done. A part switched on is picked up within one interval; switching a part on is measured at 8.4 ms, so five seconds is the delay before its first message rather than a delay in the switch itself."

[segment_id]
value = "futures"
unit  = "segment"
note  = "operator, 2026-08-22: which segment the parts that are per-segment belong to -- the capital reader, the money-mode reader and the paper account keeper each read the settings file named for it. Futures because RL-050 builds futures first and fully, with spot and options declared and honestly empty until it is done."

[taker_fee_rate]
value = 0.00055
unit  = "fraction of notional"
note  = "operator, 2026-08-22: what crossing the spread costs per side. The venues' published base-tier schedules are 0.0500% taker on binance-usdm and 0.0550% on bybit-linear; the higher of the two is used everywhere, so a cost estimate is never optimistic about which venue a fill lands on. Not measurable from public endpoints -- the per-account rate needs an authenticated call this phase deliberately cannot make -- so it is the published schedule, and it should be re-read from the venue once keys exist."

[maker_fee_rate]
value = 0.0002
unit  = "fraction of notional"
note  = "operator, 2026-08-22: what resting on the book costs per side. Both venues publish 0.0200% maker at the base tier, so unlike the taker rate there is no disagreement to resolve conservatively. Same caveat: the published schedule, not this account's measured rate."

[entry_slippage_fraction]
value = 0.0005
unit  = "fraction of price"
note  = "operator, 2026-08-22: how far past the stop a stop actually fills, as a fraction of price -- a stop is a trigger, not a guarantee, and sizing that ignores this under-risks every trade. Five basis points, matched to bull_entry_prior_entry_cost_fraction so the sizer and the entry timer assume the same cost of crossing. A prior: slippage-learner replaces it with what fills actually cost once trades exist (RL-060)."

[order_quantity_increment]
value = 0.001
unit  = "base units"
note  = "operator, 2026-08-22: the quantity step an order is snapped to. **This is the coarsest number in the system and it is temporary.** Every venue publishes a per-symbol lot size, and nothing in the blueprint consumes it yet -- symbol-catalogue-reader reads price increments and not quantity ones. A single global step is wrong for a symbol priced at 78000 and a symbol priced at 0.0001; it is here so the first paper order can be placed at all, and the honest fix is a per-symbol venue fact carried on instrument-choice."

[arbiter_conviction_margin_over_break_even]
value = 0.0
unit  = "probability"
note  = "operator, 2026-08-23: how far above the most demanding acting plan's break-even the brain's weighted conviction must be before it forms an intent. Replaces the 0.55 literal in arbiter_minimum_conviction, for the reason given at bull_conviction_margin_over_break_even: the floor is the plan's own arithmetic, the margin is the operator's. Zero on paper (RL-005). Kept as a separate number from the bull bot's because the brain weighs three bots and a margin here is a statement about the composition, not about one bot."

[arbiter_agreement_bonus]
value = 0.05
unit  = "added to the calibrated probability"
note  = "operator, 2026-08-22: how much two bots agreeing adds to the conviction the arbiter acts on. Small on purpose: bull and bear reading the same market from opposite sides and agreeing is genuine evidence, but they share their inputs, so treating agreement as independent confirmation would double-count one feed. Judgement -- what would settle it is the realised hit rate of agreed against sole opinions, which needs both bots running and closed trades."

[arbiter_sole_opinion_penalty]
value = 0.05
unit  = "subtracted from the calibrated probability"
note  = "operator, 2026-08-22: how much a single unopposed opinion is discounted. In the first runs only the bull bot is on, so every opinion is sole and every one is discounted -- which is correct and is one of the things the first run finds out: with the floor at 0.55, a conviction must reach 0.60 to act while it is the only voice in the room."

[arbiter_maximum_forecast_shade]
value = 0.1
unit  = "fraction of the conviction"
note  = "operator, 2026-08-22: the most a forecast bias may move the arbiter's conviction. A cap rather than a free hand: a forecaster that drifts must be able to tilt a decision without being able to make it."

[arbiter_minimum_competence]
value = 0.0
unit  = "competence score"
note  = "operator, 2026-08-22: the competence a bot must have shown on a symbol before its opinion is acted on. Zero while nothing has measured competence yet -- self-model-reporter is not running, so a positive floor would refuse every opinion for a reason that is about the absence of a measurement rather than about the bot. Raise it the moment competence is being measured; leaving it at zero once it is would be trusting a bot that has been shown not to know the symbol."

[arbiter_minimum_coverage]
value = 0.0
unit  = "fraction of candidates covered"
note  = "operator, 2026-08-22: how much of the candidate space a bot must have an opinion on before its opinions count. Zero for the same reason as the competence floor, and to be raised for the same reason: abstention-coverage-auditor is not running, so this measures nothing yet."

[instrument_maximum_cost_fraction]
value = 0.002
unit  = "fraction of notional"
note  = "operator, 2026-08-22: the most a chosen instrument's round trip may cost before the selector refuses it. Twenty basis points is twice the taker round trip on the worse venue, so an instrument whose spread and fees exceed the move signal-outcome-labeller calls a hit is refused rather than traded. The two numbers are deliberately the same size: a cost above the threshold that defines a successful signal is a trade that cannot win."

[journal_path]
value = "~/.local/share/ajit-segment-bots/journal.sqlite"
unit  = "path"
note  = "operator, 2026-08-22: where the trade lifecycle journal is written. Beside the tape rather than inside it: the tape is what the venue said and the journal is what this system decided, and mixing them would put our own reasoning into the record we promise is the venue's. Not under /tmp -- that is tmpfs on this box, and a journal that vanishes on reboot is not a journal."

[risk_maximum_per_position_fraction]
value = 0.01
unit  = "fraction of the allotment"
note  = "operator, 2026-08-22: the most one position may risk, as a fraction of the segment's allotment. One percent is the conventional single-trade risk and it is the number the position sizer turns into a quantity: at the 10000 USDT paper balance that is 100 USDT at risk per trade, and a stop 0.5% away therefore buys about 20000 USDT of notional -- which the per-trade capital ceiling then cuts to 1000. The two limits are deliberately both live: one bounds the loss, the other bounds the exposure."

[risk_maximum_total_fraction]
value = inf
unit  = "fraction of the allotment"
note  = "operator, 2026-08-22: the most every open position may risk together. Five times the single-position limit, so five trades at full size is the point at which nothing new is opened -- a bot that is right about one symbol is usually right about five correlated ones, and the total limit is what stops that being one bet wearing five names. Changed from 0.05 to inf -- no total cap -- on operator instruction at 2026-08-27 04:47 UTC: how many trades may be open at once is the bot's decision, twenty or forty or more if it judges them worth taking. This was the binding limit: at 04:12 that day the book held 13.1% against the 5% cap and position-sizer had refused 531 of 2,338 actionable intents with no risk allowed. What still bounds the book is per-trade: risk_maximum_per_position_fraction (1% of the allotment) sizes each one, and maximum_capital_per_trade (100 USDT of a 10,000 USDT paper allotment) is the capital behind it. The segment is on paper money (RL-005). Restore 0.05 before money_mode is ever set to live, or state a number chosen for real money."

[risk_maximum_per_cluster_fraction]
value = inf
unit  = "fraction of the allotment"
note  = "operator, 2026-08-22: the most one correlated cluster may risk. Twice a single position and well under the total: symbols that move together are one bet, and this is the limit that says so before the total limit has to. Nothing measures clusters yet -- correlation-cluster has no producer running -- so in the first runs every position is its own cluster, which is the permissive reading and is recorded here as such. Changed from 0.02 to inf -- no cluster cap -- on operator instruction at 2026-08-27 04:47 UTC, with the total cap, because a cluster cap of 2% against no total cap would simply become the limit that refuses the twentieth trade instead. It caps nothing today in any case: with no producer of correlation-cluster every symbol is its own cluster. Restore 0.02 with the total cap the moment clusters are actually measured, and before live money."

[tick_size_minimum_observations]
value = 20
unit  = "book updates"
note  = "operator, 2026-08-22: how many bid/ask spacings tick-size-resolver needs before inferring an increment a venue did not declare. Twenty, because the inference is a greatest-common-divisor over observed spacings and a handful of them would infer a coarser step than the venue really uses -- which would snap prices to a grid the venue rejects."

[learned_state_root]
value = "~/.local/share/ajit-segment-bots/learned"
unit  = "path"
note  = "operator, 2026-08-23: where a learned part's coefficients wait for the next process. Put through storage_facts.require_durable_directory by runtime/learned_state.py, which refuses a memory-backed filesystem -- /tmp is tmpfs on this box, so a model checkpointed there would measure as learning right up until the machine restarted. Beside the tape rather than inside it: the tape is what arrived and this is what was concluded from it, and an operator clearing one must not silently clear the other."

[learned_state_checkpoint_interval]
value = 25
unit  = "training observations"
note  = "operator, 2026-08-23: how many labelled outcomes a learned part may accumulate before its state is written to disk. Twenty-five against the hundred bull_minimum_training_observations needs, so a crash costs at most a quarter of the way to the bot's first decision. Not measured from the label rate, because no run has yet produced a labelled outcome to measure one from -- this is a judgement, and what would settle it is the observed labels-per-minute of the first run that trains, against the fsync cost this writes into the io_stall_fraction the governor already watches."

[risk_minimum_reward_to_risk]
value = 1.5
unit  = "reward per unit of risk"
note  = "operator, 2026-08-23: the least a trade must aim to make per unit it risks before risk will place a stop and target for it. A judgement, not a measurement -- what would settle it is the realised win rate, since a 1.5 ratio needs to be right 40% of the time to break even before costs and nothing has closed enough trades to say what the rate is. Deliberately a separate number from bull_exit_minimum_reward_to_risk: the bot's own gate is the bot judging its own setup, and a risk limit that read the same setting would not be an independent check."

[risk_maximum_stop_fraction]
value = 0.05
unit  = "fraction of entry price"
note  = "operator, 2026-08-23: the furthest a stop may sit from entry, whatever produced the distance. Five per cent, against a measured BTCUSDT range of 77415.1-77518.1 over the 28 seconds captured on 2026-08-22 -- 0.13% -- so the cap is far outside ordinary noise and bites only on a distance some upstream estimate got wrong. It is a ceiling on the damage a bad estimate can do, not a view about where stops belong."

[stop_cluster_clearance_fraction]
value = 0.002
unit  = "fraction of the cluster price"
note  = "operator, 2026-08-23: how far beyond a liquidation cluster a stop is moved when it would otherwise sit inside one. Beyond rather than short of: a stop placed just before a pool is hit by the very cascade the pool causes. Two tenths of a per cent is above the 0.13% range that BTCUSDT traded through in the captured run, so a stop moved clear of a cluster is clear of it by more than a normal half-minute of movement. Nothing produces liquidation-map yet, so this has no effect until liquidation-cluster-mapper runs."

[stop_excursion_minimum_observations]
value = 30
unit  = "closed trades"
note  = "operator, 2026-08-23: how many recorded adverse excursions a symbol needs before risk places its stop from measurement rather than from what the bot proposed. Thirty, because the placer takes the 85th percentile and a quantile that high estimated from fewer is decided by one or two observations. Below it the estimate reports itself unfitted and the proposal is used with that fact attached."

[stop_excursion_window]
value = 200
unit  = "closed trades"
note  = "operator, 2026-08-23: how many recent excursions the quantile is estimated over. Two hundred keeps roughly a season of a symbol's behaviour rather than all of its history: a stop distance learned across a regime that has ended is a stop placed for a market that no longer exists."

[signal_excursion_window]
value = 300
unit  = "settled claims"
note  = "operator, 2026-08-23: how many recent settled claims per symbol and side the excursion quantiles are estimated over. Three hundred keeps roughly a season of a symbol's behaviour rather than all of it: a stop distance learned in a regime that has ended is a stop placed for a market that no longer exists. Larger than stop_excursion_window's two hundred because a claim is cheaper evidence than a closed trade and there are far more of them -- the live run of 2026-08-23 raised 9 900 candidates in 27 minutes."

[signal_excursion_minimum_claims]
value = 30
unit  = "settled claims"
note  = "operator, 2026-08-23: how many claims a symbol and side need before the profile reports itself fitted. Thirty, matching stop_excursion_minimum_observations, because the quantile taken is high and a high quantile estimated from fewer is decided by one or two observations. Below it the profile is still published, with is_fitted false, and bull-exit-plan-proposer refuses it -- which is the correct state for a symbol nobody has watched long enough."

[signal_excursion_adverse_quantile]
value = 0.85
unit  = "quantile"
note  = "operator, 2026-08-23: which adverse excursion a stop must sit beyond. The 85th percentile of what a claim that came right had to survive, the same quantile stop-target-placer uses for the same reason: a stop inside the ordinary noise of a winning trade converts winners into losers, and that failure is invisible in the equity curve because it reads as a bad strategy rather than a bad stop. Not the maximum -- a stop beyond the worst excursion ever seen makes every loss as large as the worst one."

[signal_horizon_window]
value = 300
unit  = "settled claims"
note  = "operator, 2026-08-23: how many recent settled claims per detector the median time-to-resolve is taken over. Three hundred, matching signal_excursion_window, because both describe the same claims and a horizon estimated over a different span than the excursions would describe a different market."

[signal_horizon_minimum_claims]
value = 30
unit  = "settled claims"
note  = "operator, 2026-08-23: how many settled claims a detector needs before its horizon reports itself fitted. Thirty, matching the excursion minimum: the two profiles gate the same exit plan, and a lower bar on one would let a plan be built on half a measurement."

[bull_cold_start_stop_range_multiple]
value = 1.5
unit  = "multiples of the observed range"
note  = "operator, 2026-08-23: how far beyond the range a symbol actually traded through the cold-start stop sits, before any trade has closed. One and a half, on the same reasoning as bull_exit_stop_safety_multiple: a stop inside the movement the symbol makes anyway is a machine for being stopped out of trades that were going to work. Lower than the excursion-record multiple because the range already spans the whole window rather than being a quantile of adverse moves -- it is a wider base to start from. A judgement, and what settles it is the realised stop-out rate of the first hundred cold-start trades against the ones planned from an excursion record."

[bull_cold_start_reward_multiples]
value = [1.0, 2.0, 3.0]
unit  = "multiples of the risk"
note  = "operator, 2026-08-23: where cold-start targets sit, as reward-to-risk multiples of the stop, paired position by position with bull_exit_target_fractions. Multiples of the risk rather than quantiles of an excursion record, because before a trade has closed there is no record to take a quantile of. The risk is still measured -- it came from the symbol's own range -- so 2R on a symbol that swings 0.4% and 2R on one that swings 0.05% are different prices. One, two and three so the nearest rung clears bull_exit_minimum_reward_to_risk on its own and the far one is left to run."

[bull_cold_start_minimum_prints]
value = 20
unit  = "trade prints"
note  = "operator, 2026-08-23: how many of the venue's own prints must fall inside the claimed horizon before a range may be measured from them. Twenty, because a range over a handful of prints is those prints rather than a range, and a stop placed from it would be a stop placed from noise. Measured on the tape 2026-08-22: BTCUSDT prints about 4 a second, so a 60s horizon carries roughly 240 -- the bar binds on quiet symbols, which is exactly where it should."

[bull_cold_start_price_window]
value = 4000
unit  = "trade prints per symbol"
note  = "operator, 2026-08-23: how many recent prints per symbol the proposer keeps so a range can be measured over the horizon the detector claimed. Four thousand covers a 60s horizon on the busiest symbol measured (BTCUSDT at ~4 prints a second leaves 16x headroom) and is bounded because this is a process's memory -- an unbounded price history is a leak with a good excuse, and T-3 says an off part releases its memory."

[maximum_decision_price_drift]
value = 0.004
unit  = "fraction of the decision price"
note  = "operator, 2026-08-23: how far the market may have moved from the price a decision was made at before the book refuses to fill it. Measured, not chosen: BTCUSDT traded through 0.133% in the 28 seconds captured on 2026-08-22, so four tenths of a per cent is roughly three of those windows -- wide enough that ordinary movement between a decision and its fill passes, narrow enough that the 6% gap seen on 2026-08-23 at 10:25:15 does not. That gap was a decision priced at an ENAUSDT market 56 minutes gone. A live venue would fill such an order without complaint; this refusal is a guard on the decision, never a simulation of the venue, and paper-fill-simulator names it separately for exactly that reason. It comes down as decision staleness is measured and fixed rather than guarded against."

[heartbeat_table_path]
value = "~/.local/share/ajit-segment-bots/heartbeat-table.json"
unit  = "path"
note  = "operator, 2026-08-23: where heartbeat-collector writes the latest health of every part that has reported, with its age. Written so a board built in another process can read which parts are alive: until this existed the part monitor's RUNNING rung was unreachable and 41 live parts rendered as never run. Beside the learned state, not under /tmp -- though unlike the learned state a table lost to a reboot is the correct reading, since nothing is running after one."

[heartbeat_late_after_seconds]
value = 3.0
unit  = "seconds"
note  = "operator, 2026-08-23: how old a part's last health report may be before the collector calls it late. Three part_health_interval periods: one missed report is a scheduling hiccup under load, three in a row is not. Measured on the live run of 2026-08-23: at 30 symbols every spine part reports within 1.1 s of the last."

[heartbeat_silent_after_seconds]
value = 10.0
unit  = "seconds"
note  = "operator, 2026-08-23: how old a part's last health report may be before the collector calls it silent and the boards stop showing its last word as current. Ten seconds is five supervision intervals of the live spine (2 s), so a part that died is silent here before the supervisor has restarted it -- the board sees the death, not only the restart record."

[publisher_send_buffer_bytes]
value = 4194304
unit  = "bytes"
note  = "operator, 2026-08-23: SO_SNDBUF on a part's one publishing socket. Every datagram in flight to every consumer is charged to this buffer until that consumer reads it, so at the kernel default of 212992 one consumer 250 messages behind silenced the sends to all thirteen market-data readers: measured on the live spine, each lost the same 250 messages a second. 4194304 is net.core.wmem_max on this box, the most the kernel grants without CAP_NET_ADMIN -- a larger request is clamped to it silently, and the bus reads back what it was given. Twenty times the default, so thirteen consumers each a full inbox behind still leave headroom; a buffer large enough that nothing is ever lost does not exist, because loss is how RL-066 answers a consumer that is slower than its producer."

[feed_jump_threshold_increments]
value = 20
unit  = "price increments"
note  = "operator, 2026-08-23: how far a closed candle's open may sit from the previous close, in the symbol's own tick, before feed-jump-detector calls it a jump. Measured on today's tape across six symbols on both venues: the 99th percentile of the close-to-open move at minute boundaries is 1 to 11 ticks (BTCUSDT 7, ETHUSDT 1, DOGEUSDT 2.6, PUMPUSDT 2.5, TRUMPUSDT 10.8). Twenty sits above all of them, so a normal boundary is never reported and a stop inside the gap is. Re-measure when the universe widens; an illiquid symbol's normal boundary is wider."

[feed_jump_threshold_fraction]
value = 0.005
unit  = "fraction of price"
note  = "operator, 2026-08-23: the jump threshold used where the symbol declares no price increment, reported as inferred rather than declared. Measured on today's tape: the 99th percentile boundary move was at most 0.45% (TRUMPUSDT on bybit-linear), with single outliers to 1.46%. Half a percent is above the 99th percentile on every symbol measured and below the outliers that are exactly what this part exists to report."

[consolidated_price_maximum_quote_age]
value = 5.0
unit  = "seconds"
note  = "operator, 2026-08-23: how long cross-venue-price-consolidator believes a venue's last trade after that venue goes quiet, before the venue drops out of the consolidated price. Five seconds: both venues print the top thirty symbols several times a second (BTCUSDT aggTrade about 4 a second on 2026-08-22), so a venue silent for five is a venue whose price is no longer current, and a stale quote pulling a consolidated price is worse than a missing one because nothing downstream can see it. This was the part's own default until it became a setting."

[feed_coverage_window]
value = 300.0
unit  = "seconds"
note  = "operator, 2026-08-23: how long a stream may be silent on a symbol before feed-coverage-auditor says that stream no longer covers it. Five minutes, deliberately longer than feed_gap_threshold: a gap is an alert about one stream and this is a statement about whether the symbol is covered at all, and it must not flap on one quiet minute -- the thinnest symbol in the captured thirty printed at least once a minute on 2026-08-22. This was the part's own default until it became a setting."

[venue_gaps_before_throttled]
value = 3
unit  = "consecutive feed gaps"
note  = "operator, 2026-08-23: how many feed gaps in a row on one venue, with no data between them, before ban-signal-detector reads the venue as throttling us rather than as momentarily quiet. One gap is a quiet symbol; feed-gap-detector fires one per silent stream past feed_gap_threshold, so three consecutive with nothing arriving means the venue stopped delivering across the streams we hold, which is what a withheld stream looks like from the outside. A judgement until a real throttle has been observed; what would settle it is the gap count seen in the minute before the first measured 429."

[api_key_rejection_rest]
value = 600.0
unit  = "seconds"
note  = "operator, 2026-08-23: how long api-key-pool-rotator rests a key after a venue rejects it before offering it again. Ten minutes, which is the least Bybit holds a 403 (code 20003) before lifting it automatically, so a key offered sooner would be rejected again and count twice. Binance escalates 429 to 418 with a ban of two minutes to three days, so on that venue ten minutes is the floor, not the ceiling. No keys are held in phase 1 (RL-062); the rest applies the day one exists."

[hog_multiple_of_fair_share]
value = 3.0
unit  = "multiple"
note  = "operator, 2026-08-23: how many times a running part's fair share of a contended resource it must use before hog-detector names it. Fair share is one part's equal slice of the cores or RAM among the parts running, so at 47 parts on 12 cores it is 2.1% of the machine. Measured on the live run of 2026-08-23 12:0x: regime-classifier, reclassifying sixty symbols on every wake, sat at 21.5% of a core while every other part sat under 4% -- ten times its share, and the one part losing its feed. Three names that part and leaves a busy feed reader at twice its share alone. A judgement above one measured hog; what would settle it is the share distribution over a full day."

[cpu_contention_fraction]
value = 0.8
unit  = "fraction of logical cores"
note  = "operator, 2026-08-23: how much of the machine's CPU must be in use across all parts before hog-detector reports anyone at all. A hog on an idle machine is using what nobody wanted, and naming it would train the governor to switch off work that costs nothing. Four fifths leaves a fifth for the kernel, the tape writer's fsync and a board build; measured on 2026-08-23 the whole spine used 40% of one core of twelve, so this is far from binding today."

[memory_contention_fraction]
value = 0.8
unit  = "fraction of total RAM"
note  = "operator, 2026-08-23: how much of RAM must be in use before hog-detector reports a memory hog. This box has no swap, so exhaustion is an OOM kill; four fifths leaves six of thirty gigabytes for the page cache the tape reader relies on. Measured 2026-08-23: 2.4 GB used of 30, so not binding today."

[memory_forecast_window]
value = 300
unit  = "samples"
note  = "operator, 2026-08-23: how many of each part's memory readings memory-pressure-forecaster fits a growth rate over. part-appetite-meter reports once per part_health_interval (1 s), so three hundred is five minutes -- long enough that a part which spikes on a burst and settles does not read as growing forever, short enough that a leak of a megabyte a second is forecast well before memory_exhaustion_warning. Not yet measured against a real leak; what would settle it is the first part whose forecast came true."

[accelerator_slot_seconds]
value = 600.0
unit  = "seconds"
note  = "operator, 2026-08-23: how long accelerator-scheduler grants one device to one part before the slot expires. Ten minutes: a Kronos forecast over a window is seconds, a fine-tune is minutes, and a slot that outlives its holder's work starves the next part for the rest of it. This box has no accelerator (measured by the scheduler at start), so today every slot is a refusal that says so; the length applies the day one exists."

[duty_cycle_quiet_hours_wanted]
value = 4
unit  = "hours of the day"
note  = "operator, 2026-08-23: how many UTC hours duty-cycle-planner books for heavy work, chosen from the quietest it has observed. Four, because a retrain over a day of tape runs in well under that, and booking more would put heavy work into hours that are only moderately quiet. Which hours they are is learned from message counts per hour, never assumed."

[duty_cycle_minimum_days_observed]
value = 3
unit  = "days"
note  = "operator, 2026-08-23: how many days of per-hour activity the planner needs before it names quiet hours rather than allowing every hour with a reason that says it has no evidence. Three, so one weekend day cannot define the week; the tape has recorded since 2026-08-22, so this is met on 2026-08-25."

[duty_cycle_heavy_cpu_fraction]
value = 0.5
unit  = "cores"
note  = "operator, 2026-08-23: how much of a core a part must be using, as part-appetite-meter measures it, before the planner treats it as heavy work to be scheduled into quiet hours. Half a core: measured on the live spine of 2026-08-23, no steady part used more than 0.22 of a core and the one that did was a defect; a part above half a core for a whole health interval is doing work of the kind retraining is."

[part_restarts_allowed]
value = 3
unit  = "restarts"
note  = "operator, 2026-08-23: how many restarts of one part part-restart-budgeter allows inside part_restart_window before it withholds the next. The live spine backs off restarts from 1 s to a 60 s ceiling, so three inside five minutes is a part dying as fast as it is allowed to be started -- a crash loop, not a transient."

[part_restart_window]
value = 300.0
unit  = "seconds"
note  = "operator, 2026-08-23: the window part_restarts_allowed is counted over. Five minutes, five times the spine's restart backoff ceiling, so a part that genuinely recovered after one restart has its count forgotten within the hour."

[reservation_priority_ceiling]
value = 10
unit  = "priority rank"
note  = "operator, 2026-08-23: parts whose stated priority rank is at or below this number (lower is more important; the unstated middle is 50) are given a guaranteed resource floor by resource-reservation-ledger. Ten leaves room for the operator to rank the feed reader, the recorders and the collector among the first ten without every part stated in part-priority.toml taking a floor."

[never_switched_off_priority_ceiling]
value = 30
unit  = "priority rank"
note  = "Claude, 2026-08-26: parts whose stated priority rank is at or below this number are never switched off by switching-planner, for any reason. Distinct from reservation_priority_ceiling (10), which additionally guarantees each such part a CPU and memory floor -- a floor costs capacity that nothing else may then use, and this ceiling costs none. Measured, which is why it exists: across eight unattended hours from 2026-08-25 20:05 the governor wrote 152 switch-records, every one an off and every one hog-under-contention, with switched_on 0 across 30,150 plans; among the 42 parts left off were its own instruments -- memory-pressure-forecaster, duty-cycle-planner, part-restart-budgeter -- and order-book-reader, venue-quote-stream-reader and tick-size-resolver, after which the bot placed no order for eight hours. Twenty-seven covered the twelve ranks already stated in part-priority.toml plus the fourteen resource-governor parts and control-recorder, which together are the control path. Raised to 29 on 2026-08-26 for subscription-quota-watch and paid-spend-ledger, which are the survival tier's sensors rather than the governor's: conservation-planner stopped both under a SHUTDOWN tier the monitor reports whenever nothing has been measured, and since they are the only producers of llm-quota-state and llm-spend-state, nothing could ever measure again -- 182 parts off, 145 of 327 alive, and the tier locked at SHUTDOWN with no fault raised. The rule this ceiling now states in full: a control loop is never allowed to switch off the instrument it reads itself with, whether that loop is the governor or the tier. Raise it only for a part whose absence stops such a loop from measuring; every other part earns its place on the machine by not being the worst hog. Raised to 30 on 2026-08-27 for position-flattener, which is neither the governor's instrument nor the tier's: it is the part that carries out a human's close-positions by placing a market exit for every open position, and the argument is the same one a step further out -- a machine must not be able to switch off the part that carries out an instruction from outside it. It costs nothing to protect: with no override present it publishes no order at all."

[reserved_cpu_cores_per_critical_part]
value = 0.5
unit  = "cores"
note  = "operator, 2026-08-23: the CPU floor reserved for each part at or below reservation_priority_ceiling. Half a core is more than twice what any spine part used on 2026-08-23 (the busiest steady part at 0.22 of a core), so the floor holds under load without reserving cores nobody uses; ten such parts reserve five of twelve."

[reserved_memory_bytes_per_critical_part]
value = 268435456
unit  = "bytes"
note  = "operator, 2026-08-23: the memory floor reserved for each part at or below reservation_priority_ceiling. 256 MiB, against a forkserver child that starts at about 60 MB with numpy loaded and the feed reader's drain buffers on top; ten such parts reserve 2.5 of 30 GB."

[switch_transitions_before_flap]
value = 4
unit  = "transitions"
note  = "operator, 2026-08-23: how many on/off transitions of one part inside switch_flap_window switch-oscillation-damper needs before it calls the part flapping and asks for a hold. Four is off-on-off-on: a part switched off for pressure and back on when pressure eased is two, which is the governor working; the same again inside the window is the governor chasing its own tail."

[switch_flap_window]
value = 120.0
unit  = "seconds"
note  = "operator, 2026-08-23: the window switch_transitions_before_flap is counted over. Two minutes, which is twice memory_exhaustion_warning -- the horizon the switching planner acts on -- so an oscillation at the planner's own period is seen."

[switch_flap_base_hold]
value = 60.0
unit  = "seconds"
note  = "operator, 2026-08-23: how long a flapping part is held in its current state the first time it flaps; the damper doubles it on each repeat. One minute equals the spine's restart backoff ceiling, so a hold is never shorter than the substrate's own patience."

[risk_maximum_drawdown_fraction]
value = 0.1
unit  = "fraction of peak equity"
note  = "operator, 2026-08-23: how far realised equity may fall from its high-water mark before drawdown-breaker zeroes the risk limit. Ten percent of the 10000 USDT paper allotment is 1000 USDT, ten consecutive full-risk losses at risk_maximum_per_position_fraction -- a run long enough to be the strategy, not the noise. A judgement on paper; what would settle it is the realised distribution of drawdowns once enough trades have closed."

[risk_drawdown_recovery_fraction]
value = 0.5
unit  = "fraction of the drawdown"
note  = "operator, 2026-08-23: how much of the drawdown must be recovered before a tripped drawdown-breaker releases. Half, so a breaker does not flap at the floor: tripped at -10%, it releases at -5%, and a bot that only ever claws back a little stays stopped."

[risk_allowed_fraction_when_clear]
value = 1.0
unit  = "fraction of the allotment"
note  = "operator, 2026-08-23: the risk limit a breaker or enforcer publishes when nothing is wrong. One: the limit that binds in a clear market is exposure-limiter's per-position and per-cluster caps, and a second, lower number here would be a cap nobody could trace to a reason. Every limiter publishes a fraction and position-sizer takes the minimum."

[event_risk_anomaly_shrink_to]
value = 0.25
unit  = "fraction of the allotment"
note  = "operator, 2026-08-23: how far event-risk-limiter shrinks the risk limit while a market anomaly on a symbol stands -- a venue's price disagreeing with the consolidated price. A quarter, not zero: an anomaly is evidence that one print is wrong, not that trading is, and a position sized at a quarter survives being on the wrong side of it. Unmeasured until market-anomaly-detector has produced an anomaly on a live run."

[event_risk_anomaly_decay]
value = 300.0
unit  = "seconds"
note  = "operator, 2026-08-23: how long an anomaly's shrink decays back to the full limit. Five minutes, the same window feed-coverage uses to decide whether a stream is gone: a disagreement that has not resolved in five minutes is a new fact the detector will report again."

[event_risk_announcement_shrink_to]
value = 0.5
unit  = "fraction of the allotment"
note  = "operator, 2026-08-23: the limit while a venue announcement naming a symbol is in force -- a delisting, a maintenance window, a contract change. Half: the announcement is about the venue's plumbing, not the market, and the risk is that an exit cannot be made, which halving the size halves."

[event_risk_announcement_window]
value = 3600.0
unit  = "seconds"
note  = "operator, 2026-08-23: how long an announcement's shrink stands from when it is observed. An hour: both venues announce maintenance at least an hour ahead, and an announcement older than that either has an effective time the limiter reads as a scheduled event or has already happened."

[event_risk_scheduled_window]
value = 900.0
unit  = "seconds"
note  = "operator, 2026-08-23: how far either side of a scheduled market event the limiter shrinks the limit. Fifteen minutes, because repricing around a funding settlement or a listing happens in anticipation and a limiter that only shrank after the print would be positioned through the move it was meant to avoid."

[event_risk_scheduled_shrink_to]
value = 0.5
unit  = "fraction of the allotment"
note  = "operator, 2026-08-23: the limit inside a scheduled event's window. Half, the same reasoning as an announcement: the event is known, its direction is not, and a half-sized position is the expression of that."

[event_risk_turbulence_floor]
value = 0.1
unit  = "fraction of the allotment"
note  = "operator, 2026-08-23: the least the limit may shrink to under turbulence, however far the index is above normal. A tenth rather than zero: turbulence is a continuum and the floor keeps the bot in the market at the size where being wrong is survivable, which is where the learning about turbulent markets has to come from."

[event_risk_turbulence_horizon]
value = 600.0
unit  = "seconds"
note  = "operator, 2026-08-23: how long one turbulence reading shrinks the limit before it must be re-observed. Ten minutes, longer than the gauge's own interval, so a gauge that stops reporting leaves the shrink in place rather than releasing it into a market it can no longer see."

[leverage_target_liquidation_distance]
value = 0.1
unit  = "fraction of price"
note  = "operator, 2026-08-23: how far from the entry leverage-selector places the liquidation price, as the most leverage it will choose. Ten percent: measured on today's tape, the largest intraday move on the captured thirty was 1.5% (TRUMPUSDT), so a liquidation ten percent away survives six such moves stacked, which is the margin a paper bot learning its exits needs."

[leverage_volatility_horizons_to_survive]
value = 3.0
unit  = "horizons"
note  = "operator, 2026-08-23: how many forecast volatility horizons of adverse move the chosen leverage must survive before liquidation. Three, so a two-sigma move over the forecast horizon -- ordinary, not a tail -- leaves a third of the distance unspent."

[leverage_funding_tolerance_per_day]
value = 0.001
unit  = "fraction of notional per day"
note  = "operator, 2026-08-23: the most funding leverage-selector will pay per day at the chosen leverage before it reduces it. Ten basis points a day -- three settlements at the venues' base 0.01% each is three, so this tolerates a rate three times base, which on 2026-08-22 the captured fundingInfo put only a few symbols above."

[maintenance_margin_rate]
value = 0.005
unit  = "fraction of notional"
note  = "operator, 2026-08-23: the venue's maintenance margin at the lowest risk tier, used wherever a liquidation distance is computed. Half a percent, which is both venues' published first tier for BTCUSDT perpetuals; tiers rise with position size and the 1000 USDT per-trade cap keeps every paper position in the first. Not readable from public endpoints per symbol without an authenticated call, so it is the published schedule and should be re-read once keys exist."

[liquidation_danger_price_distance]
value = 0.03
unit  = "fraction of price"
note  = "operator, 2026-08-23: how close the mark may come to a position's liquidation price before margin-liquidation-watch zeroes new risk. Three percent: twice the largest intraday move measured on the captured thirty today (1.5%), so a single ordinary move cannot take a position from safe to liquidated inside one health interval."

[liquidation_danger_equity_headroom]
value = 0.2
unit  = "fraction of the maintenance requirement"
note  = "operator, 2026-08-23: how much equity above the account's maintenance requirement is the least margin-liquidation-watch calls safe. A fifth over maintenance; below it the venue, not the bot, decides what closes."

[order_participation_cap]
value = 0.1
unit  = "fraction of traded volume"
note  = "operator, 2026-08-23: the share of a symbol's measured traded volume one slice of an order may be, above which participation-capped-order-splitter splits it. A tenth: measured on today's tape the thinnest captured symbol trades about 30 prints a minute, and a slice that is a tenth of a minute's volume moves the price by about one spread on both books captured. A judgement until slippage-learner has measured impact against participation."

[order_slice_interval]
value = 10.0
unit  = "seconds"
note  = "operator, 2026-08-23: how far apart the splitter schedules slices. Ten seconds, the window the participation cap is measured over, so one slice is one window's share."

[order_maximum_schedule_horizon]
value = 300.0
unit  = "seconds"
note  = "operator, 2026-08-23: the longest a split order may take to complete. Five minutes, the horizon the spread-reversion detector claims over, after which the decision that produced the order is a decision about a market that has gone."

[order_volatility_urgency_factor]
value = 1.0
unit  = "multiplier"
note  = "operator, 2026-08-23: how much a volatility forecast shortens the schedule -- at one, a symbol forecast to move twice its normal is scheduled in half the time. One until the trade-off between impact and the cost of waiting has been measured."

[profit_lock_break_even_trigger]
value = 0.02
unit  = "fraction of entry price"
note  = "operator, 2026-08-23: how far a position must be in profit before profit-lock moves its stop to break-even. Two percent, about three times the two-fee round trip plus the measured typical adverse excursion on the captured symbols, so a stop moved to break-even is not immediately hit by the noise that preceded the move."

[profit_lock_prior_retracement]
value = 0.01
unit  = "fraction of price"
note  = "operator, 2026-08-23: the retracement a winner is assumed to give back, used to place the trailing stop before profit-lock has observed enough retracements on the symbol to measure its own. One percent, below the 1.5% largest intraday move measured today so that an ordinary pullback does not stop a winner out before the measurement exists."

[profit_lock_maximum_trail]
value = 0.1
unit  = "fraction of price"
note  = "operator, 2026-08-23: the widest a trailing stop may be set from the peak, whatever the measured retracement says. Ten percent; a trail wider than that is not locking profit, it is a new stop."

[profit_lock_minimum_observations]
value = 10
unit  = "retracements"
note  = "operator, 2026-08-23: how many retracements profit-lock needs on a symbol before it trails by the measured quantile rather than the prior. Ten, the least a quantile of a small sample can mean; below it the prior is used and the adjustment says so."

[profit_lock_window]
value = 50
unit  = "retracements"
note  = "operator, 2026-08-23: how many recent retracements per symbol profit-lock keeps for its quantile. Fifty, so a regime change shows within fifty winners and an outlier weighs two percent."

[stop_frequency_window]
value = 20
unit  = "closed trades"
note  = "operator, 2026-08-23: how many recent closed trades stop-frequency-breaker counts stop-outs over. Twenty, enough that a cluster of stops is a rate rather than a coincidence, few enough that the breaker trips before the equity curve shows it, which is the whole point."

[stop_frequency_prior_rate]
value = 0.4
unit  = "fraction of closed trades"
note  = "operator, 2026-08-23: the stop-out rate assumed normal before enough trades have closed to measure one. Two in five: at the 1.5 reward-to-risk the exit plans aim for, a bot right half the time stops out half the time, and the prior sits just under that so an early run at the break-even rate does not trip it."

[stop_frequency_excess_ratio]
value = 1.8
unit  = "multiple of the normal rate"
note  = "operator, 2026-08-23: how many times the normal stop-out rate the recent rate must reach to trip. At 1.8 times 0.4 the breaker trips when 72% of recent trades stopped out, which over a twenty-trade window is a four-sigma excess against the prior."

[stop_frequency_minimum_observations]
value = 5
unit  = "closed trades"
note  = "operator, 2026-08-23: how many trades must have closed before the breaker judges at all. Five: three stop-outs in three trades is no evidence of anything."

[stop_frequency_cooldown_trades]
value = 5
unit  = "closed trades"
note  = "operator, 2026-08-23: how many trades after a trip the breaker stays tripped, at the size the sizer is left with. Five, so the bot re-enters small and the recovery is measured rather than assumed."

[live_switch_minimum_closed_trades]
value = 100
unit  = "closed trades"
note  = "operator, 2026-08-23: how many closed paper trades a bot needs before live-switch-guard will let its segment trade live money. A hundred: at the 1.5 reward-to-risk the plans aim for, a hundred trades separate a 55% hit rate from a coin flip at about two standard errors, which is the least evidence RL-005 (live only for what paper proved) can mean. On paper this guard publishes the full limit and judges nothing."

[live_switch_minimum_days_traded]
value = 14.0
unit  = "days"
note  = "operator, 2026-08-23: how many days of paper trading a bot needs before live. Two weeks, so a record spanning only one kind of week -- one regime, one funding cycle -- cannot graduate."

[live_switch_maximum_drawdown_fraction]
value = 0.2
unit  = "fraction of peak paper equity"
note  = "operator, 2026-08-23: the worst paper drawdown a bot may have shown and still go live. Twice risk_maximum_drawdown_fraction: a bot that tripped its own breaker once on paper has a record; one that tripped it twice over has a habit."

[order_latency_prior]
value = 0.25
unit  = "seconds"
note  = "operator, 2026-08-23: the round-trip latency order-latency-simulator assumes for a paper order before it has measured live round trips. A quarter second: REST order placement to both venues from this box measured 80 to 200 ms on 2026-08-22, and the prior sits above the slowest so a paper fill is never faster than a live one would have been."

[order_latency_maximum]
value = 5.0
unit  = "seconds"
note  = "operator, 2026-08-23: the longest the simulator will hold an order whatever the measured latency says. Five seconds, beyond which a venue would have answered with an error rather than a fill, and a paper order held longer would be simulating an outage rather than latency."

[order_latency_minimum_observations]
value = 20
unit  = "live round trips"
note  = "operator, 2026-08-23: how many live round trips the simulator needs before it draws from the measured distribution rather than the prior. Twenty, the least a drawn quantile of latency can mean."

[order_latency_window]
value = 200
unit  = "live round trips"
