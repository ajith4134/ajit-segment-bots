# Which parts matter most when the machine is contended. Lower wins; unlisted
# parts take the middle rank (50). Parts at or below reservation_priority_ceiling
# (10) are given a guaranteed CPU and memory floor by resource-reservation-ledger,
# and the switching-planner never switches a reserved part off for memory, hog or
# io reasons.
#
# Written by Claude 2026-08-24 when gate-actuator was first started, following the
# reservation_priority_ceiling note of 2026-08-23 ("room for the operator to rank
# the feed reader, the recorders and the collector among the first ten"). The
# ranking is the operator's to change; the reasons each part is here:
#
#   venue-trade-stream-reader  writes the tape. An hour not captured is gone
#                              permanently -- nothing else in this file is that.
#   price-level-sampler        thirty-seven parts read nothing but its frames;
#                              off, they all starve at once.
#   heartbeat-collector        every board and every governor decision reads the
#                              table it writes; off, the system goes dark to us.
#   trade-lifecycle-recorder   the journal of what the bot did with money.
#   position-recorder          the positions the paper account actually holds.
#   paper-account-keeper       the paper balance itself.
#   paper-fill-simulator       the venue stand-in; off mid-trade, resting stops
#                              stop triggering while positions stay open.
#   bull-conviction-model      the live run's learning (RL-071); its checkpoint
#                              survives a stop but the run's unlearned tail does not.
#   stream-budget-planner      decides the feed's connections; the reader keeps
#                              its last plan, so it ranks below the reader itself.
#   symbol-catalogue-reader    the universe the feed captures.
#
#   venue-quote-stream-reader  and quote-level-sampler rank 11 and 12 -- just
#   quote-level-sampler        below the reservation ceiling, deliberately. They
#                              matter: without them instrument-selector falls back
#                              to a traded price and refuses the symbols nobody is
#                              trading, which is what they were added to stop
#                              (2026-08-24). But a missed quote is not history
#                              lost the way a missed trade is, and displacing any
#                              of the ten above to reserve them would trade
#                              something irreplaceable for something that
#                              reappears on the next message.

#
# Ranks 13 to 27 added by Claude 2026-08-26, and they are what
# never_switched_off_priority_ceiling (27) covers: the control path itself. They
# take no resource floor -- that stops at reservation_priority_ceiling (10) --
# they are simply never shed. Written after an unattended night in which the
# governor switched off memory-pressure-forecaster, duty-cycle-planner and
# part-restart-budgeter for being hogs, and then went on planning against the
# last levels those three managed to publish.
#
#   hardware-scanner           the planner refuses to plan at all without a
#                              complete capacity reading; off, the governor stops.
#   part-appetite-meter        the same, for the metering: no usage sweep and
#                              what is running is unknown rather than nothing.
#   hog-detector               the only evidence a part is shed on -- and, since
#                              2026-08-26, the only evidence it comes back on.
#   part-priority-reader       publishes this file. Off, every rank in it is the
#                              unstated middle and this ceiling protects nobody.
#   switching-planner          the one part that decides.
#   gate-actuator              the one part that flips a switch (T-2).
#   off-state-verifier         proves a part told to stop actually let go (T-3).
#   memory-pressure-forecaster the runway. Shed on 2026-08-25 21:08.
#   io-pressure-meter          the other pressure the planner weighs.
#   resource-reservation-ledger the floor the ten above it stand on.
#   part-restart-budgeter      what stops a crash loop being answered forever.
#   switch-oscillation-damper  what stops the new return path becoming a flap.
#   duty-cycle-planner         the hours a part is allowed. Shed on 2026-08-25.
#   accelerator-scheduler      grants the one scarce device; nothing else can.
#   control-recorder           the journal every switch is written to. Off, the
#                              governor acts and no record of it exists.

[priority]
"venue-trade-stream-reader" = 1
"price-level-sampler" = 2
"heartbeat-collector" = 3
"trade-lifecycle-recorder" = 4
"position-recorder" = 5
"paper-account-keeper" = 6
"paper-fill-simulator" = 7
"bull-conviction-model" = 8
"stream-budget-planner" = 9
"symbol-catalogue-reader" = 10
"venue-quote-stream-reader" = 11
"quote-level-sampler" = 12
"hardware-scanner" = 13
"part-appetite-meter" = 14
"hog-detector" = 15
"part-priority-reader" = 16
"switching-planner" = 17
"gate-actuator" = 18
"off-state-verifier" = 19
"memory-pressure-forecaster" = 20
"io-pressure-meter" = 21
"resource-reservation-ledger" = 22
"part-restart-budgeter" = 23
"switch-oscillation-damper" = 24
"duty-cycle-planner" = 25
"accelerator-scheduler" = 26
"control-recorder" = 27

#   subscription-quota-watch   and paid-spend-ledger are the survival tier's own
#   paid-spend-ledger          sensors, added 2026-08-26. survival-tier-monitor
#                              computes the tier from llm-quota-state and
#                              llm-spend-state and these two are their only
#                              producers; before either has published, the
#                              monitor reports SHUTDOWN on purpose, because
#                              assuming unmeasured runway is how a system finds
#                              out it is broke by stopping. Measured on the live
#                              spine at 10:38 on 2026-08-26: 364 such unmeasured
#                              readings drove conservation-planner to stop 182
#                              parts -- 182 per plan across 1,251 plans -- and
#                              both sensors were in them. Their processes were
#                              released (T-3), so neither could publish a reading
#                              again and the tier stayed SHUTDOWN permanently:
#                              145 of 327 parts alive, every conservation block
#                              dark, the machine at 9 GB of 29, and no fault
#                              reported anywhere, because every one of those
#                              stops was a decision the planner was entitled to
#                              make. A loop must not be able to switch off the
#                              instrument it reads itself with.
"subscription-quota-watch" = 28
"paid-spend-ledger" = 29

#   position-flattener         added 2026-08-27, the part that carries out a
#                              human's close-positions by placing a market exit
#                              for every open position. Ranked inside the ceiling
#                              for the reason the governor's own instruments are:
#                              a part that exists to carry out an instruction
#                              from outside must not be switched off by the
#                              machine being instructed. It takes no resource
#                              floor -- that stops at 10 -- it is simply never
#                              shed. It costs nothing when idle: with no override
#                              present it publishes no order at all.
"position-flattener" = 30
