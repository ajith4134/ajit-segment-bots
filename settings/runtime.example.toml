note  = "operator, 2026-08-23: a stop further than this many typical movements is too wide to be a stop. Five."

[stop_audit_approach_fraction]
value = 0.8
unit  = "fraction of the stop distance"
note  = "operator, 2026-08-23: how close to the stop the worst price must have come for the auditor to say the stop was nearly hit. Four fifths."

[luck_significance_threshold]
value = 1.0
unit  = "standard errors"
note  = "operator, 2026-08-23: how many standard errors of expected noise an outcome must exceed before luck-skill-separator calls it significant. One; inside it the outcome is what the symbol's volatility would have produced with no decision."

[luck_minimum_comparable_outcomes]
value = 5
