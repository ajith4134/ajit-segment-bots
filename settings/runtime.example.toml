note  = "operator, 2026-08-23: the share of the peak favourable excursion an exit may give back before exit-quality-scorer calls it a late exit. Half."

[stop_audit_inside_noise_below]
value = 1.0
unit  = "typical movements"
note  = "operator, 2026-08-23: a stop closer than this many of the symbol's typical movements is inside the noise; stop-placement-auditor says so. One: a stop within one ordinary move is reached by the ordinary."

[stop_audit_too_wide_above]
value = 5.0
