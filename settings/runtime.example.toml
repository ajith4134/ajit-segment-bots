note  = "Claude, 2026-09-02: which contracts history is read for. CE and PE are the option types in Upstox's own master; segment_id is index-options, and the master carries 75,278 instruments of which only these two types are what this segment trades. Widened when Phase B's segments are built, not before."

[broker_history_fetch_interval_seconds]
